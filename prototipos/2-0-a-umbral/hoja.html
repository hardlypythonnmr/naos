<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NAOS · Hoja de etiquetas (prueba)</title>
<style>
@font-face{font-family:"IBM Plex Sans Condensed";src:url(../../assets/fuentes/IBMPlexSansCondensed-SemiBold.woff2) format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(../../assets/fuentes/IBMPlexSans.woff2) format("woff2");font-weight:400 600;font-display:swap}
body{margin:0;padding:16px;font:400 16px/24px "IBM Plex Sans",system-ui,sans-serif;background:#fff;color:#0E1116}
h1{font:600 18px/24px "IBM Plex Sans",sans-serif;margin:0 0 4px}
p{margin:0 0 12px;max-width:600px}
.rot{display:inline-block;font:600 11px/16px "IBM Plex Sans Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em;border:1px dashed #59616D;color:#59616D;padding:0 6px}
.hoja{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px;margin-top:16px}
.etq{border:2px solid #0E1116;display:flex;align-items:center;justify-content:center;min-height:90px;font:600 40px/44px "IBM Plex Sans Condensed",sans-serif;text-align:center;overflow-wrap:anywhere;padding:6px;
  background-image:radial-gradient(circle,#D7DBE0 2.4px,transparent 2.8px);background-size:9px 9px}
a,button{min-height:48px;display:inline-flex;align-items:center;padding:0 14px;border:2px solid #0E1116;border-radius:12px;background:#fff;color:#0E1116;font:600 16px/24px "IBM Plex Sans",sans-serif;text-decoration:none;cursor:pointer}
@page{size:A4;margin:12mm}
@media print{.no-imprimir{display:none}.hoja{max-width:none}.etq{min-height:60mm;font-size:34pt;background:none;border-color:#000}}
</style>
</head>
<body>
<h1 id="t">Hoja de etiquetas</h1>
<p><span class="rot" id="maq">Hoja estática de prueba · prototipo no publicado</span></p>
<p id="ayuda">Ocho etiquetas por hoja, en tinta sola. Recorta una, escríbela a mano en cinta de enmascarar o pégala donde la leas.</p>
<p class="no-imprimir"><button type="button" id="imp">Imprimir</button> <a id="vol" href="index.html">Volver</a></p>
<div class="hoja" id="hoja"></div>
<script>
(function () {
  var p = new URLSearchParams(location.search), es = p.get("lang") !== "en";
  var palabra = (p.get("p") || (es ? "lámpara" : "lamp")).slice(0, 14);
  document.documentElement.lang = es ? "es" : "en";
  if (!es) {
    document.title = "NAOS · Label sheet (test)";
    document.getElementById("t").textContent = "Label sheet";
    document.getElementById("maq").textContent = "Static test sheet · unpublished prototype";
    document.getElementById("ayuda").textContent = "Eight labels per sheet, in single ink. Cut one out, write it by hand on masking tape or stick it where you'll read it.";
    document.getElementById("imp").textContent = "Print";
    document.getElementById("vol").textContent = "Back";
  }
  document.getElementById("vol").href = es ? "es/index.html" : "index.html";
  var h = document.getElementById("hoja");
  for (var i = 0; i < 8; i++) { var d = document.createElement("div"); d.className = "etq"; d.textContent = palabra; h.appendChild(d); }
  document.getElementById("imp").addEventListener("click", function () { try { window.print(); } catch (e) { /* nada */ } });
})();
</script>
</body>
</html>
