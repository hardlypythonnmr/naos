<svg class="fl fl-hor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 736" width="960" height="736" role="img" aria-labelledby="fl-en-h-t" aria-describedby="fl-en-h-d" lang="en">
<title id="fl-en-h-t">Flow in five steps across three places: a chat that starts almost empty, a handover, a private folder, a notes file under 200 lines, and a first real task on its own branch.</title>
<desc id="fl-en-h-d">A path with five steps in three places. In the chat: 1, it starts almost empty; 2, a handover that you keep outside the chat. In the folder: 3, a private folder that keeps every saved step; 4, a notes file, with two numbers: under 200 lines is the size Anthropic suggests, and a study of code repositories found over 20 percent more cost on average. In the code: 5, your first real task, with one number: in a study of 47 people, those with an AI assistant wrote less secure code. A dotted rule marks the older evidence, an assistant from 2022.</desc>
<style>svg.fl{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);--idx:var(--lab-accent,#2438C7);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.fl[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116);--idx:var(--lab-night-accent,#8C9BFF)}svg.fl text{fill:var(--ink)}svg.fl .fl-z{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:22px;font-weight:400}svg.fl .fl-t{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:18px;font-weight:400}svg.fl .fl-b{fill:var(--sec);font-size:15px}svg.fl .fl-m{fill:var(--grey);font-size:15px}svg.fl .fl-v{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}svg.fl .fl-q{fill:var(--sec);font-size:15px}svg.fl .fl-o{fill:var(--grey);font-size:15px}svg.fl .fl-n{fill:var(--idx);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}svg.fl .fl-zr{stroke:var(--ink);stroke-width:1.5}svg.fl .fl-rail{stroke:var(--chart);stroke-width:2;fill:none}svg.fl .fl-c{fill:var(--paper);stroke:var(--ink);stroke-width:2}svg.fl .fl-s{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}svg.fl .fl-s.fl-viejo{stroke:var(--chart);stroke-dasharray:1 5}</style>
<path class="fl-rail" d="M24 78H196"/><path class="fl-rail" d="M220 78H392"/><path class="fl-rail" d="M416 78H588"/><path class="fl-rail" d="M612 78H784"/>
<text class="fl-z" x="0" y="26" data-r="372">Chat</text>
<line class="fl-zr" x1="0" y1="38" x2="372" y2="38"/>
<text class="fl-z" x="392" y="26" data-r="764">Folder</text>
<line class="fl-zr" x1="392" y1="38" x2="764" y2="38"/>
<text class="fl-z" x="784" y="26" data-r="960">Code</text>
<line class="fl-zr" x1="784" y1="38" x2="960" y2="38"/>
<circle class="fl-c" cx="12" cy="78" r="12"/><text class="fl-n" x="12" y="83" text-anchor="middle">1</text>
<text class="fl-t" x="0" y="122" data-r="176">It starts almost</text><text class="fl-t" x="0" y="144" data-r="176">empty</text>
<text class="fl-b" x="0" y="170" data-r="176">Each new chat starts</text><text class="fl-b" x="0" y="191" data-r="176">almost empty. Where</text><text class="fl-b" x="0" y="212" data-r="176">memory is on, it</text><text class="fl-b" x="0" y="233" data-r="176">carries a few saved</text><text class="fl-b" x="0" y="254" data-r="176">topics.</text>
<text class="fl-m" x="0" y="277" data-r="176">Official docs [1] [2]</text>
<circle class="fl-c" cx="208" cy="78" r="12"/><text class="fl-n" x="208" y="83" text-anchor="middle">2</text>
<text class="fl-t" x="196" y="122" data-r="372">A handover</text>
<text class="fl-b" x="196" y="148" data-r="372">You ask for the goal,</text><text class="fl-b" x="196" y="169" data-r="372">the decisions and the</text><text class="fl-b" x="196" y="190" data-r="372">open questions, and</text><text class="fl-b" x="196" y="211" data-r="372">keep them outside the</text><text class="fl-b" x="196" y="232" data-r="372">chat.</text>
<text class="fl-m" x="196" y="255" data-r="372">Our method [3] [11]</text><text class="fl-m" x="196" y="275" data-r="372">[12]</text>
<circle class="fl-c" cx="404" cy="78" r="12"/><text class="fl-n" x="404" y="83" text-anchor="middle">3</text>
<text class="fl-t" x="392" y="122" data-r="568">A private folder</text>
<text class="fl-b" x="392" y="148" data-r="568">A private repository</text><text class="fl-b" x="392" y="169" data-r="568">keeps every saved</text><text class="fl-b" x="392" y="190" data-r="568">step, and you can go</text><text class="fl-b" x="392" y="211" data-r="568">back to any of them.</text>
<text class="fl-m" x="392" y="234" data-r="568">Official docs [7] [8]</text>
<circle class="fl-c" cx="600" cy="78" r="12"/><text class="fl-n" x="600" y="83" text-anchor="middle">4</text>
<text class="fl-t" x="588" y="122" data-r="764">A notes file</text>
<text class="fl-b" x="588" y="148" data-r="764">Claude Code reads it</text><text class="fl-b" x="588" y="169" data-r="764">at the start of every</text><text class="fl-b" x="588" y="190" data-r="764">session. Short notes</text><text class="fl-b" x="588" y="211" data-r="764">work best.</text>
<text class="fl-m" x="588" y="234" data-r="764">Official docs · Study</text><text class="fl-m" x="588" y="254" data-r="764">[5] [24]</text>
<line class="fl-s" x1="588" y1="290" x2="624" y2="290"/><text class="fl-v" x="588" y="318" data-r="764">Under 200 lines</text><text class="fl-q" x="588" y="339" data-r="764">The size Anthropic</text><text class="fl-q" x="588" y="359" data-r="764">suggests for a notes</text><text class="fl-q" x="588" y="379" data-r="764">file.</text><text class="fl-o" x="588" y="402" data-r="764">Claude Code docs, read</text><text class="fl-o" x="588" y="422" data-r="764">16 Oct 2026 [5]</text>
<line class="fl-s" x1="588" y1="470" x2="624" y2="470"/><text class="fl-v" x="588" y="498" data-r="764">Over 20%</text><text class="fl-q" x="588" y="519" data-r="764">more cost on average</text><text class="fl-q" x="588" y="539" data-r="764">with context files, in</text><text class="fl-q" x="588" y="559" data-r="764">a study of code</text><text class="fl-q" x="588" y="579" data-r="764">repositories. No</text><text class="fl-q" x="588" y="599" data-r="764">general gain in task</text><text class="fl-q" x="588" y="619" data-r="764">success.</text><text class="fl-o" x="588" y="642" data-r="764">Gloaguen and others,</text><text class="fl-o" x="588" y="662" data-r="764">v3, 29 Sep 2026 [24]</text>
<circle class="fl-c" cx="796" cy="78" r="12"/><text class="fl-n" x="796" y="83" text-anchor="middle">5</text>
<text class="fl-t" x="784" y="122" data-r="960">Your first real task</text>
<text class="fl-b" x="784" y="148" data-r="960">You ask the AI to work</text><text class="fl-b" x="784" y="169" data-r="960">on its own branch,</text><text class="fl-b" x="784" y="190" data-r="960">list every file it</text><text class="fl-b" x="784" y="211" data-r="960">changed and wait for</text><text class="fl-b" x="784" y="232" data-r="960">your OK.</text>
<text class="fl-m" x="784" y="255" data-r="960">Our method · Study [9]</text><text class="fl-m" x="784" y="275" data-r="960">[13] [25]</text>
<line class="fl-s fl-viejo" x1="784" y1="311" x2="820" y2="311"/><text class="fl-v" x="784" y="339" data-r="960">47 people</text><text class="fl-q" x="784" y="360" data-r="960">In a study of five</text><text class="fl-q" x="784" y="380" data-r="960">security tasks, those</text><text class="fl-q" x="784" y="400" data-r="960">who used an AI</text><text class="fl-q" x="784" y="420" data-r="960">assistant wrote less</text><text class="fl-q" x="784" y="440" data-r="960">secure code and felt</text><text class="fl-q" x="784" y="460" data-r="960">more sure it was fine.</text><text class="fl-q" x="784" y="480" data-r="960">The assistant was from</text><text class="fl-q" x="784" y="500" data-r="960">2022.</text><text class="fl-o" x="784" y="523" data-r="960">Perry and others,</text><text class="fl-o" x="784" y="543" data-r="960">2023 [25]</text>
<line class="fl-s fl-viejo" x1="0" y1="712" x2="36" y2="712"/><text class="fl-m" x="48" y="717" data-r="960">Dotted rule: older evidence</text>
</svg>
