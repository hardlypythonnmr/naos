<svg class="fl fl-hor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 796" width="960" height="796" role="img" aria-labelledby="fl-es-h-t" aria-describedby="fl-es-h-d" lang="es">
<title id="fl-es-h-t">Flujo de cinco pasos en tres lugares: un chat que arranca casi vacío, un resumen para retomar, una carpeta privada, un archivo de notas de menos de 200 líneas y una primera tarea de verdad en su propia rama.</title>
<desc id="fl-es-h-d">Un camino de cinco pasos en tres lugares. En el chat: 1, arranca casi vacío; 2, un resumen para retomar, que guardas fuera del chat. En la carpeta: 3, una carpeta privada que guarda cada paso; 4, un archivo de notas, con dos cifras: menos de 200 líneas es el tamaño que sugiere Anthropic, y un estudio de repositorios de código halló más de 20 por ciento de costo extra en promedio. En el código: 5, tu primera tarea de verdad, con una cifra: en un estudio de 47 personas, quienes usaron un asistente de IA escribieron código menos seguro. Una regla punteada marca la evidencia más vieja, un asistente de 2022.</desc>
<style>svg.fl{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);--idx:var(--lab-accent,#2438C7);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.fl[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116);--idx:var(--lab-night-accent,#8C9BFF)}svg.fl text{fill:var(--ink)}svg.fl .fl-z{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:22px;font-weight:400}svg.fl .fl-t{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:18px;font-weight:400}svg.fl .fl-b{fill:var(--sec);font-size:15px}svg.fl .fl-m{fill:var(--grey);font-size:15px}svg.fl .fl-v{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}svg.fl .fl-q{fill:var(--sec);font-size:15px}svg.fl .fl-o{fill:var(--grey);font-size:15px}svg.fl .fl-n{fill:var(--idx);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}svg.fl .fl-zr{stroke:var(--ink);stroke-width:1.5}svg.fl .fl-rail{stroke:var(--chart);stroke-width:2;fill:none}svg.fl .fl-c{fill:var(--paper);stroke:var(--ink);stroke-width:2}svg.fl .fl-s{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}svg.fl .fl-s.fl-viejo{stroke:var(--chart);stroke-dasharray:1 5}</style>
<path class="fl-rail" d="M24 78H196"/><path class="fl-rail" d="M220 78H392"/><path class="fl-rail" d="M416 78H588"/><path class="fl-rail" d="M612 78H784"/>
<text class="fl-z" x="0" y="26" data-r="372">Chat</text>
<line class="fl-zr" x1="0" y1="38" x2="372" y2="38"/>
<text class="fl-z" x="392" y="26" data-r="764">Carpeta</text>
<line class="fl-zr" x1="392" y1="38" x2="764" y2="38"/>
<text class="fl-z" x="784" y="26" data-r="960">Código</text>
<line class="fl-zr" x1="784" y1="38" x2="960" y2="38"/>
<circle class="fl-c" cx="12" cy="78" r="12"/><text class="fl-n" x="12" y="83" text-anchor="middle">1</text>
<text class="fl-t" x="0" y="122" data-r="176">Arranca casi vacío</text>
<text class="fl-b" x="0" y="148" data-r="176">Cada chat nuevo</text><text class="fl-b" x="0" y="169" data-r="176">empieza casi vacío. Si</text><text class="fl-b" x="0" y="190" data-r="176">la memoria está</text><text class="fl-b" x="0" y="211" data-r="176">activada, trae algunos</text><text class="fl-b" x="0" y="232" data-r="176">temas guardados.</text>
<text class="fl-m" x="0" y="255" data-r="176">Documentación oficial</text><text class="fl-m" x="0" y="275" data-r="176">[1] [2]</text>
<circle class="fl-c" cx="208" cy="78" r="12"/><text class="fl-n" x="208" y="83" text-anchor="middle">2</text>
<text class="fl-t" x="196" y="122" data-r="372">Un resumen para</text><text class="fl-t" x="196" y="144" data-r="372">retomar</text>
<text class="fl-b" x="196" y="170" data-r="372">Pides la meta, las</text><text class="fl-b" x="196" y="191" data-r="372">decisiones y las</text><text class="fl-b" x="196" y="212" data-r="372">preguntas abiertas, y</text><text class="fl-b" x="196" y="233" data-r="372">las guardas fuera del</text><text class="fl-b" x="196" y="254" data-r="372">chat.</text>
<text class="fl-m" x="196" y="277" data-r="372">Nuestro método [3]</text><text class="fl-m" x="196" y="297" data-r="372">[11] [12]</text>
<circle class="fl-c" cx="404" cy="78" r="12"/><text class="fl-n" x="404" y="83" text-anchor="middle">3</text>
<text class="fl-t" x="392" y="122" data-r="568">Una carpeta privada</text>
<text class="fl-b" x="392" y="148" data-r="568">Un repositorio privado</text><text class="fl-b" x="392" y="169" data-r="568">conserva cada paso</text><text class="fl-b" x="392" y="190" data-r="568">guardado, y puedes</text><text class="fl-b" x="392" y="211" data-r="568">volver a cualquiera de</text><text class="fl-b" x="392" y="232" data-r="568">ellos.</text>
<text class="fl-m" x="392" y="255" data-r="568">Documentación oficial</text><text class="fl-m" x="392" y="275" data-r="568">[7] [8]</text>
<circle class="fl-c" cx="600" cy="78" r="12"/><text class="fl-n" x="600" y="83" text-anchor="middle">4</text>
<text class="fl-t" x="588" y="122" data-r="764">Un archivo de notas</text>
<text class="fl-b" x="588" y="148" data-r="764">Claude Code lo lee al</text><text class="fl-b" x="588" y="169" data-r="764">empezar cada sesión.</text><text class="fl-b" x="588" y="190" data-r="764">Las notas cortas</text><text class="fl-b" x="588" y="211" data-r="764">funcionan mejor.</text>
<text class="fl-m" x="588" y="234" data-r="764">Documentación oficial</text><text class="fl-m" x="588" y="254" data-r="764">· Estudio [5] [24]</text>
<line class="fl-s" x1="588" y1="290" x2="624" y2="290"/><text class="fl-v" x="588" y="318" data-r="764">Menos de 200</text><text class="fl-q" x="588" y="339" data-r="764">líneas: el tamaño que</text><text class="fl-q" x="588" y="359" data-r="764">sugiere Anthropic para</text><text class="fl-q" x="588" y="379" data-r="764">un archivo de notas.</text><text class="fl-o" x="588" y="402" data-r="764">Doc. de Claude Code,</text><text class="fl-o" x="588" y="422" data-r="764">leída el 16 oct</text><text class="fl-o" x="588" y="442" data-r="764">2026 [5]</text>
<line class="fl-s" x1="588" y1="490" x2="624" y2="490"/><text class="fl-v" x="588" y="518" data-r="764">Más de 20 %</text><text class="fl-q" x="588" y="539" data-r="764">de costo extra en</text><text class="fl-q" x="588" y="559" data-r="764">promedio con archivos</text><text class="fl-q" x="588" y="579" data-r="764">de contexto, en un</text><text class="fl-q" x="588" y="599" data-r="764">estudio de</text><text class="fl-q" x="588" y="619" data-r="764">repositorios de</text><text class="fl-q" x="588" y="639" data-r="764">código. Sin mejora</text><text class="fl-q" x="588" y="659" data-r="764">general en el éxito de</text><text class="fl-q" x="588" y="679" data-r="764">las tareas.</text><text class="fl-o" x="588" y="702" data-r="764">Gloaguen y otros, v3,</text><text class="fl-o" x="588" y="722" data-r="764">29 sep 2026 [24]</text>
<circle class="fl-c" cx="796" cy="78" r="12"/><text class="fl-n" x="796" y="83" text-anchor="middle">5</text>
<text class="fl-t" x="784" y="122" data-r="960">Tu primera tarea de</text><text class="fl-t" x="784" y="144" data-r="960">verdad</text>
<text class="fl-b" x="784" y="170" data-r="960">Le pides a la IA que</text><text class="fl-b" x="784" y="191" data-r="960">trabaje en su propia</text><text class="fl-b" x="784" y="212" data-r="960">rama, liste cada</text><text class="fl-b" x="784" y="233" data-r="960">archivo que cambió y</text><text class="fl-b" x="784" y="254" data-r="960">espere tu visto bueno.</text>
<text class="fl-m" x="784" y="277" data-r="960">Nuestro método ·</text><text class="fl-m" x="784" y="297" data-r="960">Estudio [9] [13] [25]</text>
<line class="fl-s fl-viejo" x1="784" y1="333" x2="820" y2="333"/><text class="fl-v" x="784" y="361" data-r="960">47 personas</text><text class="fl-q" x="784" y="382" data-r="960">En un estudio de cinco</text><text class="fl-q" x="784" y="402" data-r="960">tareas de seguridad,</text><text class="fl-q" x="784" y="422" data-r="960">quienes usaron un</text><text class="fl-q" x="784" y="442" data-r="960">asistente de IA</text><text class="fl-q" x="784" y="462" data-r="960">escribieron código</text><text class="fl-q" x="784" y="482" data-r="960">menos seguro y estaban</text><text class="fl-q" x="784" y="502" data-r="960">más seguros de que su</text><text class="fl-q" x="784" y="522" data-r="960">código era seguro. El</text><text class="fl-q" x="784" y="542" data-r="960">asistente era de 2022.</text><text class="fl-o" x="784" y="565" data-r="960">Perry y otros,</text><text class="fl-o" x="784" y="585" data-r="960">2023 [25]</text>
<line class="fl-s fl-viejo" x1="0" y1="772" x2="36" y2="772"/><text class="fl-m" x="48" y="777" data-r="960">Regla punteada: evidencia más vieja</text>
</svg>
