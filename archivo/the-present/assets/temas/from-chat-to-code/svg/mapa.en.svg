<svg class="mp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" width="360" height="610" role="img" aria-labelledby="mp-en-t" aria-describedby="mp-en-d" lang="en">
<title id="mp-en-t">Map of this page: seven pieces on one ladder, from the full video on 20 October up to guardrails and undo on 17 November.</title>
<desc id="mp-en-d">Seven steps go down and to the right like a staircase, in date order. It starts with a chat that forgets and ends with a project that remembers. Step 1, Tuesday 20 October: all six parts in one video. 2, Wednesday 21 October: why the chat forgets. 3, Friday 23 October: what you need. 4, Sunday 25 October: the first prompt. 5, Thursday 29 October: a memory file. 6, Saturday 7 November: your first real task. 7, Tuesday 17 November: guardrails and undo. A square marks the video and a dot marks each Short and Reel.</desc>
