<svg class="hc" data-step="6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 396" width="360" height="396" role="img" aria-labelledby="hc-es-t" aria-describedby="hc-es-d" lang="es">
<title id="hc-es-t">Animación en seis pasos: un chat vacío se llena, las líneas más viejas se desdibujan, se escribe un resumen para retomar, se guarda fuera del chat y un chat nuevo parte de él.</title>
<desc id="hc-es-d">Dos paneles lado a lado, un chat a la izquierda y tus notas, fuera del chat, a la derecha. Uno: el chat está vacío. Dos: el hilo crece, seis líneas. Tres: las tres líneas más viejas se vuelven puntos, porque en un hilo largo se pueden perder detalles. Cuatro: aparece en el chat una nota con tres filas: Meta, Decisiones y Preguntas abiertas. Cinco: una copia de la nota pasa a tus notas. Seis: abajo se abre un chat nuevo con la misma nota adentro. Esta imagen es el final de la animación, el paso seis.</desc>
<style>svg.hc{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);--idx:var(--lab-accent,#2438C7);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.hc[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116);--idx:var(--lab-night-accent,#8C9BFF)}svg.hc text{fill:var(--ink)}svg.hc .hc-l{font-size:15px;font-weight:600}svg.hc .hc-g{fill:var(--grey);font-size:15px}svg.hc .hc-p{fill:none;stroke:var(--ink);stroke-width:1.5}svg.hc .hc-bar{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}svg.hc .hc-dot{fill:none;stroke:var(--chart);stroke-width:5;stroke-linecap:round;stroke-dasharray:.1 7.5}svg.hc .hc-card{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}svg.hc .hc-r{font-size:15px}svg.hc .hc-arr{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:miter}svg.hc .hc-head{fill:var(--ink)}svg.hc .hc-v{opacity:0;transition:opacity var(--t-enter,600ms) var(--ease-enter,cubic-bezier(.2,0,0,1)) var(--d,0ms)}svg.hc[data-step="1"] .k1{opacity:1}svg.hc[data-step="2"] .k2{opacity:1}svg.hc[data-step="3"] .k3{opacity:1}svg.hc[data-step="4"] .k4{opacity:1}svg.hc[data-step="5"] .k5{opacity:1}svg.hc[data-step="6"] .k6{opacity:1}svg.hc .hc-nb{transform:translate(0,0);transition:opacity var(--t-slide,600ms) var(--ease-enter,cubic-bezier(.2,0,0,1)),transform var(--t-slide,600ms) var(--ease-enter,cubic-bezier(.2,0,0,1))}svg.hc[data-step="5"] .hc-nb,svg.hc[data-step="6"] .hc-nb{transform:translate(176px,0)}@media (prefers-reduced-motion:reduce){svg.hc .hc-v{transition:none}svg.hc .hc-nb{transition:none}}</style>
