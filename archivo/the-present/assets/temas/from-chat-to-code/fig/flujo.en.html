<figcaption><p class="viz-que"><strong>What this shows.</strong> The path of a project, from a chat that starts almost empty to a first real task, where you ask the AI to work on its own branch and wait for your OK. Three numbers sit where they matter, each with its source and the date we read it.</p>
<p class="viz-nota">The study of notes files covers code repositories only, and the security study used a 2022 assistant, so we read both as reasons to look before you say yes. The steps marked Our method are ours. On 16 October 2026 Claude ran the prompts once, and we kept the log; someone new to code has not tried them yet.</p>
