<h3 class="viz-t">A handover, step by step</h3>
<svg class="hc" data-step="6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 396" width="360" height="396" role="img" aria-labelledby="hc-en-t" aria-describedby="hc-en-d" lang="en">
<title id="hc-en-t">Animation in six steps: an empty chat fills up, the oldest lines blur, a handover note is written, saved outside the chat, and a new chat starts from it.</title>
<desc id="hc-en-d">Two panels side by side, a chat on the left and your notes outside the chat on the right. One: the chat is empty. Two: the thread grows, six lines. Three: the three oldest lines turn to dots, because in a long thread details can slip. Four: a note appears in the chat with three rows: Goal, Decisions and Open questions. Five: a copy of the note moves to your notes. Six: below, a new chat opens with the same note in it. This picture is the end of the animation, step six.</desc>

<figcaption><p class="viz-que"><strong>What this shows.</strong> A chat starts almost empty and grows, and in a long thread details can slip. A handover (the goal, the decisions and the open questions) saved outside the chat gives the next chat something to start from. Play it, or go one step at a time.</p>
<p class="viz-nota">This is our method drawn as a picture. Claude ran the prompt once on 16 October 2026, and the log is noted in section 4.</p>
<details class="viz-alt"><summary>The six steps in words</summary><ol><li>A new chat starts almost empty.</li><li>You work for a while, and the thread grows.</li><li>In a long thread details can slip, and some chats drop the oldest part.</li><li>You ask for a handover: the goal, the decisions and the open questions.</li><li>You save it outside the chat: a phone note, or a document you own.</li><li>A new chat can start from your notes instead of from nothing.</li></ol></details></figcaption>
</figure>
