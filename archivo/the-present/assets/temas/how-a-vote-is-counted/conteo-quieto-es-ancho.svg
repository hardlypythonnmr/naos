<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" width="800" height="484" role="img" aria-labelledby="cvq-es-ancho-t cvq-es-ancho-d" style="max-width:100%;height:auto">
<title id="cvq-es-ancho-t">El conteo en cuatro pasos</title>
<desc id="cvq-es-ancho-d">Tres pistas, una por país, cada una con cuatro paradas numeradas y una ficha de papeleta en la última. Brasil: en la sección, sin internet, la primera cifra, revísalo tú. Estados Unidos: el voto por correo, la primera cifra (no oficial), el conteo oficial, la fecha. España: en la mesa, la primera cifra (provisional), el conteo oficial, la fecha.</desc>
<style>
.cv-base{stroke:var(--naos-chart,#737B87);stroke-width:3;fill:none}
.cv-avance{stroke:var(--naos-ink,#0E1116);stroke-width:4;fill:none}
.cv-st .cv-c{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:3}
.cv-st .cv-nn{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:14px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.cv-st .cv-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.cv-st.is-fut .cv-c{stroke:var(--naos-chart,#737B87);stroke-width:2}
.cv-st.is-fut .cv-nn{fill:var(--naos-grey,#59616D)}
.cv-st.is-act .cv-c{fill:var(--naos-ink,#0E1116)}
.cv-st.is-act .cv-nn{fill:var(--naos-paper,#FFFFFF)}
.cv-st.is-act .cv-aro{opacity:1}
.cv-lb{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-sec,#454C57)}
.cv-st.is-act .cv-lb{fill:var(--naos-ink,#0E1116);font-weight:600}
.cv-es{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;font-weight:600;fill:var(--naos-ink,#0E1116)}
.cv-cu{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.cv-ficha-r{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2}
.cv-ficha-l{fill:var(--naos-ink,#0E1116)}
.cv-pais-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);font-size:20px;fill:var(--naos-ink,#0E1116)}
.cv-sep{stroke:var(--naos-rule,#D7DBE0);stroke-width:1;fill:none}
</style>
<g><path class="cv-base" d="M200 44 H704"/><path class="cv-avance" d="M200 44 H704"/><g class="cv-st is-hecho"><circle class="cv-c" cx="200" cy="44" r="13"/><text class="cv-nn" x="200" y="49" text-anchor="middle">1</text><text class="cv-lb" x="200" y="82" text-anchor="middle">En la sección</text><text class="cv-cu" x="200" y="102" text-anchor="middle">Al cerrar la votación</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="368" cy="44" r="13"/><text class="cv-nn" x="368" y="49" text-anchor="middle">2</text><text class="cv-lb" x="368" y="82" text-anchor="middle">Sin internet</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="536" cy="44" r="13"/><text class="cv-nn" x="536" y="49" text-anchor="middle">3</text><text class="cv-lb" x="536" y="82" text-anchor="middle">La primera cifra</text><text class="cv-cu" x="536" y="102" text-anchor="middle">17:00 de Brasilia, 16:00</text><text class="cv-cu" x="536" y="118" text-anchor="middle">ET</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="704" cy="44" r="13"/><text class="cv-nn" x="704" y="49" text-anchor="middle">4</text><text class="cv-lb" x="704" y="82" text-anchor="middle">Revísalo tú</text></g><text class="cv-pais-t" x="16" y="50" text-anchor="start">Brasil</text><g class="cv-ficha" transform="translate(696 4)"><rect class="cv-ficha-r" x="0" y="0" width="16" height="22" rx="2"/><rect class="cv-ficha-l" x="3.5" y="5" width="9" height="3"/><rect class="cv-ficha-l" x="3.5" y="11" width="9" height="3"/></g></g>
<path class="cv-sep" d="M16 150 H784"/>
<g><path class="cv-base" d="M200 198 H704"/><path class="cv-avance" d="M200 198 H704"/><g class="cv-st is-hecho"><circle class="cv-c" cx="200" cy="198" r="13"/><text class="cv-nn" x="200" y="203" text-anchor="middle">1</text><text class="cv-lb" x="200" y="236" text-anchor="middle">El voto por correo</text><text class="cv-cu" x="200" y="256" text-anchor="middle">Lo decide cada estado</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="368" cy="198" r="13"/><text class="cv-nn" x="368" y="203" text-anchor="middle">2</text><text class="cv-lb" x="368" y="236" text-anchor="middle">La primera cifra</text><text class="cv-es" x="368" y="256" text-anchor="middle">No oficial</text><text class="cv-cu" x="368" y="274" text-anchor="middle">La noche de votar</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="536" cy="198" r="13"/><text class="cv-nn" x="536" y="203" text-anchor="middle">3</text><text class="cv-lb" x="536" y="236" text-anchor="middle">El conteo oficial</text><text class="cv-es" x="536" y="256" text-anchor="middle">Oficial</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="704" cy="198" r="13"/><text class="cv-nn" x="704" y="203" text-anchor="middle">4</text><text class="cv-lb" x="704" y="236" text-anchor="middle">La fecha</text><text class="cv-es" x="704" y="256" text-anchor="middle">Oficial</text><text class="cv-cu" x="704" y="274" text-anchor="middle">Michigan jue 5 nov,</text><text class="cv-cu" x="704" y="290" text-anchor="middle">Georgia vie 20 nov</text></g><text class="cv-pais-t" x="16" y="204" text-anchor="start">Estados Unidos</text><g class="cv-ficha" transform="translate(696 158)"><rect class="cv-ficha-r" x="0" y="0" width="16" height="22" rx="2"/><rect class="cv-ficha-l" x="3.5" y="5" width="9" height="3"/><rect class="cv-ficha-l" x="3.5" y="11" width="9" height="3"/></g></g>
<path class="cv-sep" d="M16 322 H784"/>
<g><path class="cv-base" d="M200 370 H704"/><path class="cv-avance" d="M200 370 H704"/><g class="cv-st is-hecho"><circle class="cv-c" cx="200" cy="370" r="13"/><text class="cv-nn" x="200" y="375" text-anchor="middle">1</text><text class="cv-lb" x="200" y="408" text-anchor="middle">En la mesa</text><text class="cv-cu" x="200" y="428" text-anchor="middle">Cierran las urnas a las</text><text class="cv-cu" x="200" y="444" text-anchor="middle">20:00, 14:00 ET</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="368" cy="370" r="13"/><text class="cv-nn" x="368" y="375" text-anchor="middle">2</text><text class="cv-lb" x="368" y="408" text-anchor="middle">La primera cifra</text><text class="cv-es" x="368" y="428" text-anchor="middle">Provisional</text><text class="cv-cu" x="368" y="446" text-anchor="middle">dom 29 nov</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="536" cy="370" r="13"/><text class="cv-nn" x="536" y="375" text-anchor="middle">3</text><text class="cv-lb" x="536" y="408" text-anchor="middle">El conteo oficial</text><text class="cv-es" x="536" y="428" text-anchor="middle">Oficial</text><text class="cv-cu" x="536" y="446" text-anchor="middle">vie 4 a lun 7 dic</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="704" cy="370" r="13"/><text class="cv-nn" x="704" y="375" text-anchor="middle">4</text><text class="cv-lb" x="704" y="408" text-anchor="middle">La fecha</text><text class="cv-es" x="704" y="428" text-anchor="middle">Oficial</text></g><text class="cv-pais-t" x="16" y="376" text-anchor="start">España</text><g class="cv-ficha" transform="translate(696 330)"><rect class="cv-ficha-r" x="0" y="0" width="16" height="22" rx="2"/><rect class="cv-ficha-l" x="3.5" y="5" width="9" height="3"/><rect class="cv-ficha-l" x="3.5" y="11" width="9" height="3"/></g></g>
<path class="cv-sep" d="M16 478 H784"/>
</svg>
