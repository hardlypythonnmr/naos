<svg xmlns="http://www.w3.org/2000/svg" class="vx-e" viewBox="0 0 360 695" width="360" height="695" role="img" aria-labelledby="cvq-es-estrecho-t cvq-es-estrecho-d" style="max-width:100%;height:auto">
<title id="cvq-es-estrecho-t">El conteo en cuatro pasos</title>
<desc id="cvq-es-estrecho-d">Tres pistas, una por país, cada una con cuatro paradas numeradas y una ficha de papeleta en la última. Brasil: en la sección, sin internet, la primera cifra, revísalo tú. Estados Unidos: el voto por correo, la primera cifra (no oficial), el conteo oficial, la fecha. España: en la mesa, la primera cifra (provisional), el conteo oficial, la fecha.</desc>
<style>
.cv-base{stroke:var(--naos-chart,#737B87);stroke-width:3;fill:none}
.cv-avance{stroke:var(--naos-ink,#0E1116);stroke-width:4;fill:none}
.cv-st .cv-c{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:3}
.cv-st .cv-nn{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:14px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.cv-st .cv-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.cv-st.is-fut .cv-c{stroke:var(--naos-chart,#737B87);stroke-width:2}
.cv-st.is-fut .cv-nn{fill:var(--naos-grey,#59616D)}
.cv-st.is-act .cv-c{fill:var(--naos-ink,#0E1116)}
.cv-st.is-act .cv-nn{fill:var(--naos-paper,#FFFFFF)}
.cv-st.is-act .cv-aro{opacity:1}
