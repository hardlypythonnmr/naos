<svg xmlns="http://www.w3.org/2000/svg" class="vx-e" viewBox="0 0 360 1189" width="360" height="1189" role="img" aria-labelledby="vg-en-estrecho-t vg-en-estrecho-d" style="max-width:100%;height:auto">
<title id="vg-en-estrecho-t">Days from voting day to each official step</title>
<desc id="vg-en-estrecho-d">How many days pass between voting day and each official step, where our sources give a date. In the United States, Michigan&#x27;s county boards meet by day 2, Georgia&#x27;s counties certify by day 6 and its state by day 17. In Spain, the official general count runs from day 5 to day 8. In each case the first number comes on voting night and the official step has its own date. Brazil&#x27;s first count starts at 17:00 Brasília; our sources give no official-result date, so that row ends in a dotted line. Michigan and Georgia are two examples; each US state sets its own dates. This is the calendar the law sets; how fast a count goes is a different question. Sources: [2] [3] [4] [17] [25] [27] [34] [35] [40]. Read on 16 October 2026. Georgia&#x27;s dates come from a Wayback copy of its calendar dated 26 March 2026.</desc>
<style>
.vg-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)}
.vg-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.vg-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:14px;fill:var(--naos-sec,#454C57)}
.vg-v{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:14px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vg-t,.vg-f,.vg-s,.vg-v{paint-order:stroke;stroke:var(--naos-paper,#FFFFFF);stroke-width:4px;stroke-linejoin:round}
.vg-grid{stroke:var(--naos-rule,#D7DBE0);stroke-width:1}
.vg-base{stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vg-sep{stroke:var(--naos-ink,#0E1116);stroke-width:1}
.vg-espera{stroke:var(--naos-chart,#737B87);stroke-width:2.5;fill:none}
.vg-punt{stroke:var(--naos-ink,#0E1116);stroke-width:3;stroke-linecap:round;fill:none;stroke-dasharray:.1 7}
.vg-dia0{fill:var(--naos-ink,#0E1116)}
.vg-ofi{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2.5}
.vg-vieja{stroke-dasharray:3.5 3}
.vx-e .vg-f,.vx-e .vg-s,.vx-e .vg-v{font-size:16px}
</style>
<line class="vg-grid" x1="26.0" x2="26.0" y1="178" y2="768"/>
<text class="vg-f" x="26.0" y="788" text-anchor="middle">0</text>
<line class="vg-grid" x1="104.0" x2="104.0" y1="178" y2="768"/>
<text class="vg-f" x="104.0" y="788" text-anchor="middle">5</text>
<line class="vg-grid" x1="182.0" x2="182.0" y1="178" y2="768"/>
<text class="vg-f" x="182.0" y="788" text-anchor="middle">10</text>
<line class="vg-grid" x1="260.0" x2="260.0" y1="178" y2="768"/>
<text class="vg-f" x="260.0" y="788" text-anchor="middle">15</text>
<line class="vg-grid" x1="338.0" x2="338.0" y1="178" y2="768"/>
<text class="vg-f" x="338.0" y="788" text-anchor="middle">20</text>
<text class="vg-t" font-size="22" x="16" y="34" text-anchor="start">Days from voting day to</text><text class="vg-t" font-size="22" x="16" y="60" text-anchor="start">each official step</text>
<text class="vg-f" x="16" y="84" text-anchor="start">Where our sources give a date.</text><text class="vg-f" x="16" y="104" text-anchor="start">Michigan and Georgia are two</text><text class="vg-f" x="16" y="124" text-anchor="start">examples: each US state sets its own</text><text class="vg-f" x="16" y="144" text-anchor="start">dates.</text>
<text class="vg-t" x="16" y="198" font-size="17">Brazil, runoff · Sun 25 Oct</text>
<text class="vg-t" x="16" y="360" font-size="17">United States, midterms · Tue 3 Nov</text>
<text class="vg-t" x="16" y="646" font-size="17">Spain, general · Sun 29 Nov</text>
<text class="vg-s" x="16" y="226" text-anchor="start">First count: president, from 17:00</text><text class="vg-s" x="16" y="246" text-anchor="start">Brasília</text>
<path class="vg-punt" d="M42.0 268 H70.0"/><circle class="vg-dia0" cx="26.0" cy="268" r="7"/>
<text class="vg-s" x="19.0" y="300" text-anchor="start">Official date: not confirmed in</text><text class="vg-s" x="19.0" y="320" text-anchor="start">our sources</text>
<text class="vg-s" x="16" y="388" text-anchor="start">Michigan: county boards meet</text>
<path class="vg-espera" d="M26.0 410 H57.2"/><circle class="vg-dia0" cx="26.0" cy="410" r="7"/><circle class="vg-ofi" cx="57.2" cy="410" r="8"/>
<text class="vg-v" x="49.2" y="442" text-anchor="start">by day 2 · Thu 5 Nov</text>
<text class="vg-s" x="16" y="470" text-anchor="start">Georgia: counties certify</text>
<path class="vg-espera" d="M26.0 492 H119.6"/><circle class="vg-dia0" cx="26.0" cy="492" r="7"/><circle class="vg-ofi vg-vieja" cx="119.6" cy="492" r="8"/>
<text class="vg-v" x="111.6" y="524" text-anchor="start">by day 6 · Mon 9 Nov</text>
<text class="vg-s" x="16" y="552" text-anchor="start">Georgia: state deadline</text>
<path class="vg-espera" d="M26.0 574 H291.2"/><circle class="vg-dia0" cx="26.0" cy="574" r="7"/><circle class="vg-ofi vg-vieja" cx="291.2" cy="574" r="8"/>
<text class="vg-v" x="299.2" y="606" text-anchor="end">by day 17 · Fri 20 Nov</text>
<text class="vg-s" x="16" y="674" text-anchor="start">General count by the Provincial</text><text class="vg-s" x="16" y="694" text-anchor="start">Boards</text>
<path class="vg-espera" d="M26.0 716 H104.0"/><circle class="vg-dia0" cx="26.0" cy="716" r="7"/><rect class="vg-ofi" x="96.0" y="708" width="62.8" height="16" rx="8"/>
<text class="vg-v" x="16" y="748" text-anchor="start">days 5 to 8 · Fri 4 to Mon 7 Dec</text>
<text class="vg-f" x="182.0" y="808" text-anchor="middle">Days after voting day (0 is voting</text><text class="vg-f" x="182.0" y="828" text-anchor="middle">day)</text>
<circle class="vg-dia0" cx="28" cy="870" r="6"/>
<text class="vg-f" x="56" y="875" text-anchor="start">First number, on voting night</text>
<rect class="vg-ofi" x="16" y="894" width="30" height="14" rx="7"/>
<text class="vg-f" x="56" y="906" text-anchor="start">Official step (a long shape is a</text><text class="vg-f" x="56" y="925" text-anchor="start">window of days)</text>
<circle class="vg-ofi vg-vieja" cx="31" cy="951" r="7.5"/>
<text class="vg-f" x="56" y="956" text-anchor="start">Dashed ring: date read from an</text><text class="vg-f" x="56" y="975" text-anchor="start">older copy, checked again before</text><text class="vg-f" x="56" y="994" text-anchor="start">3 Nov</text>
<path class="vg-punt" d="M20 1020 H46"/>
<text class="vg-f" x="56" y="1025" text-anchor="start">Dotted line: no official date</text><text class="vg-f" x="56" y="1044" text-anchor="start">confirmed</text>
<line class="vg-sep" x1="16" x2="344" y1="1068" y2="1068"/>
<text class="vg-f" x="16" y="1090" text-anchor="start">Sources: [2] [3] [4] [17] [25] [27]</text><text class="vg-f" x="16" y="1109" text-anchor="start">[34] [35] [40]. Read on 16 October</text><text class="vg-f" x="16" y="1128" text-anchor="start">2026. Georgia&#x27;s dates come from a</text><text class="vg-f" x="16" y="1147" text-anchor="start">Wayback copy of its calendar dated 26</text><text class="vg-f" x="16" y="1166" text-anchor="start">March 2026.</text>
</svg>
