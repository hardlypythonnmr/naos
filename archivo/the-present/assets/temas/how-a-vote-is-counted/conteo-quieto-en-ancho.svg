<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 468" width="800" height="468" role="img" aria-labelledby="cvq-en-ancho-t cvq-en-ancho-d" style="max-width:100%;height:auto">
<title id="cvq-en-ancho-t">The count in four moves</title>
<desc id="cvq-en-ancho-d">Three tracks, one per country, each with four numbered stops and a ballot slip at the last one. Brazil: at the section, off the internet, the first number, check it yourself. United States: mail ballots, the first number (unofficial), the official count, the date. Spain: at the table, the first number (provisional), the official count, the date.</desc>
<style>
.cv-base{stroke:var(--naos-chart,#737B87);stroke-width:3;fill:none}
.cv-avance{stroke:var(--naos-ink,#0E1116);stroke-width:4;fill:none}
.cv-st .cv-c{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:3}
.cv-st .cv-nn{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:14px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.cv-st .cv-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.cv-st.is-fut .cv-c{stroke:var(--naos-chart,#737B87);stroke-width:2}
.cv-st.is-fut .cv-nn{fill:var(--naos-grey,#59616D)}
.cv-st.is-act .cv-c{fill:var(--naos-ink,#0E1116)}
.cv-st.is-act .cv-nn{fill:var(--naos-paper,#FFFFFF)}
.cv-st.is-act .cv-aro{opacity:1}
.cv-lb{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-sec,#454C57)}
.cv-st.is-act .cv-lb{fill:var(--naos-ink,#0E1116);font-weight:600}
.cv-es{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;font-weight:600;fill:var(--naos-ink,#0E1116)}
.cv-cu{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.cv-ficha-r{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2}
.cv-ficha-l{fill:var(--naos-ink,#0E1116)}
.cv-pais-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);font-size:20px;fill:var(--naos-ink,#0E1116)}
.cv-sep{stroke:var(--naos-rule,#D7DBE0);stroke-width:1;fill:none}
</style>
<g><path class="cv-base" d="M200 44 H704"/><path class="cv-avance" d="M200 44 H704"/><g class="cv-st is-hecho"><circle class="cv-c" cx="200" cy="44" r="13"/><text class="cv-nn" x="200" y="49" text-anchor="middle">1</text><text class="cv-lb" x="200" y="82" text-anchor="middle">At the section</text><text class="cv-cu" x="200" y="102" text-anchor="middle">When voting ends</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="368" cy="44" r="13"/><text class="cv-nn" x="368" y="49" text-anchor="middle">2</text><text class="cv-lb" x="368" y="82" text-anchor="middle">Off the internet</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="536" cy="44" r="13"/><text class="cv-nn" x="536" y="49" text-anchor="middle">3</text><text class="cv-lb" x="536" y="82" text-anchor="middle">The first number</text><text class="cv-cu" x="536" y="102" text-anchor="middle">17:00 Brasília, 16:00 ET</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="704" cy="44" r="13"/><text class="cv-nn" x="704" y="49" text-anchor="middle">4</text><text class="cv-lb" x="704" y="82" text-anchor="middle">Check it yourself</text></g><text class="cv-pais-t" x="16" y="50" text-anchor="start">Brazil</text><g class="cv-ficha" transform="translate(696 4)"><rect class="cv-ficha-r" x="0" y="0" width="16" height="22" rx="2"/><rect class="cv-ficha-l" x="3.5" y="5" width="9" height="3"/><rect class="cv-ficha-l" x="3.5" y="11" width="9" height="3"/></g></g>
<path class="cv-sep" d="M16 134 H784"/>
<g><path class="cv-base" d="M200 182 H704"/><path class="cv-avance" d="M200 182 H704"/><g class="cv-st is-hecho"><circle class="cv-c" cx="200" cy="182" r="13"/><text class="cv-nn" x="200" y="187" text-anchor="middle">1</text><text class="cv-lb" x="200" y="220" text-anchor="middle">Mail ballots</text><text class="cv-cu" x="200" y="240" text-anchor="middle">Each state sets its own</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="368" cy="182" r="13"/><text class="cv-nn" x="368" y="187" text-anchor="middle">2</text><text class="cv-lb" x="368" y="220" text-anchor="middle">The first number</text><text class="cv-es" x="368" y="240" text-anchor="middle">Unofficial</text><text class="cv-cu" x="368" y="258" text-anchor="middle">Election night</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="536" cy="182" r="13"/><text class="cv-nn" x="536" y="187" text-anchor="middle">3</text><text class="cv-lb" x="536" y="220" text-anchor="middle">The official count</text><text class="cv-es" x="536" y="240" text-anchor="middle">Official</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="704" cy="182" r="13"/><text class="cv-nn" x="704" y="187" text-anchor="middle">4</text><text class="cv-lb" x="704" y="220" text-anchor="middle">The date</text><text class="cv-es" x="704" y="240" text-anchor="middle">Official</text><text class="cv-cu" x="704" y="258" text-anchor="middle">Michigan Thu 5 Nov,</text><text class="cv-cu" x="704" y="274" text-anchor="middle">Georgia Fri 20 Nov</text></g><text class="cv-pais-t" x="16" y="188" text-anchor="start">United States</text><g class="cv-ficha" transform="translate(696 142)"><rect class="cv-ficha-r" x="0" y="0" width="16" height="22" rx="2"/><rect class="cv-ficha-l" x="3.5" y="5" width="9" height="3"/><rect class="cv-ficha-l" x="3.5" y="11" width="9" height="3"/></g></g>
<path class="cv-sep" d="M16 306 H784"/>
<g><path class="cv-base" d="M200 354 H704"/><path class="cv-avance" d="M200 354 H704"/><g class="cv-st is-hecho"><circle class="cv-c" cx="200" cy="354" r="13"/><text class="cv-nn" x="200" y="359" text-anchor="middle">1</text><text class="cv-lb" x="200" y="392" text-anchor="middle">At the table</text><text class="cv-cu" x="200" y="412" text-anchor="middle">Polls close 20:00, 14:00</text><text class="cv-cu" x="200" y="428" text-anchor="middle">ET</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="368" cy="354" r="13"/><text class="cv-nn" x="368" y="359" text-anchor="middle">2</text><text class="cv-lb" x="368" y="392" text-anchor="middle">The first number</text><text class="cv-es" x="368" y="412" text-anchor="middle">Provisional</text><text class="cv-cu" x="368" y="430" text-anchor="middle">Sun 29 Nov</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="536" cy="354" r="13"/><text class="cv-nn" x="536" y="359" text-anchor="middle">3</text><text class="cv-lb" x="536" y="392" text-anchor="middle">The official count</text><text class="cv-es" x="536" y="412" text-anchor="middle">Official</text><text class="cv-cu" x="536" y="430" text-anchor="middle">Fri 4 to Mon 7 Dec</text></g><g class="cv-st is-hecho"><circle class="cv-c" cx="704" cy="354" r="13"/><text class="cv-nn" x="704" y="359" text-anchor="middle">4</text><text class="cv-lb" x="704" y="392" text-anchor="middle">The date</text><text class="cv-es" x="704" y="412" text-anchor="middle">Official</text></g><text class="cv-pais-t" x="16" y="360" text-anchor="start">Spain</text><g class="cv-ficha" transform="translate(696 314)"><rect class="cv-ficha-r" x="0" y="0" width="16" height="22" rx="2"/><rect class="cv-ficha-l" x="3.5" y="5" width="9" height="3"/><rect class="cv-ficha-l" x="3.5" y="11" width="9" height="3"/></g></g>
<path class="cv-sep" d="M16 462 H784"/>
</svg>
