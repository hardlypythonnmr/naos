<svg class="qv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 414" width="344" height="414" role="img" aria-labelledby="qv-t-es qv-d-es" lang="es">
<title id="qv-t-es">Proceso: seis cosas que salen después de que la Fed decide el 28 de octubre, en orden, desde el comunicado a las 2:00 p. m. ET hasta las actas del 18 de noviembre.</title>
<desc id="qv-d-es">Una línea vertical con seis pasos. Uno: miércoles 28 de octubre a las 2:00 p. m. ET, el comunicado y la votación. Dos: en ese mismo momento, la nota con las tasas de la Fed. Tres: 2:30 p. m. ET, la conferencia de prensa. Cuatro: jueves 29 de octubre hacia las 9:00 a. m. ET, la tasa efectiva de la Fed de Nueva York. Cinco: jueves 29 de octubre a las 11:59 p. m. ET, termina el silencio. Seis: miércoles 18 de noviembre a las 2:00 p. m. ET, las actas y la encuesta. Una línea gruesa marca el silencio, hasta el paso cinco.</desc>
<style>svg.qv{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.qv[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.qv text{fill:var(--ink)}svg.qv .qv-c{fill:var(--sec);font-size:13px;font-variant-numeric:tabular-nums}svg.qv .qv-q{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:16px;font-weight:400}svg.qv .qv-k{fill:var(--grey);font-size:13px}svg.qv .qv-sp{fill:none;stroke:var(--chart);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:.1 7}svg.qv .qv-sil{fill:var(--ink)}svg.qv .qv-band{fill:var(--rule)}svg.qv .qv-halo{fill:var(--paper)}svg.qv .qv-pt{fill:var(--paper);stroke:var(--ink);stroke-width:2.4}svg.qv .is-pas .qv-pt{fill:var(--ink)}svg.qv .qv-cur{fill:none;stroke:var(--ink);stroke-width:2.5}svg.qv .is-now .qv-q{font-weight:600}</style>
<rect class="qv-band" x="6" y="13" width="332" height="54" transform="translate(0 310)"/>
<path class="qv-sp" d="M28 40V350"/>
<rect class="qv-sil" x="25" y="40" width="6" height="248"/>
<g class="qv-f is-pas" data-k="0"><circle class="qv-halo" cx="28" cy="40" r="10"/><circle class="qv-pt" cx="28" cy="40" r="5.5"/><text class="qv-c" x="56" y="35">mié 28 oct, 2:00 p. m. ET</text><text class="qv-q" x="56" y="55">El comunicado y la votación</text></g>
<g class="qv-f is-pas" data-k="1"><circle class="qv-halo" cx="28" cy="102" r="10"/><circle class="qv-pt" cx="28" cy="102" r="5.5"/><text class="qv-c" x="56" y="97">En ese mismo momento</text><text class="qv-q" x="56" y="117">La nota con las tasas de la Fed</text></g>
<g class="qv-f is-pas" data-k="2"><circle class="qv-halo" cx="28" cy="164" r="10"/><circle class="qv-pt" cx="28" cy="164" r="5.5"/><text class="qv-c" x="56" y="159">mié 28 oct, 2:30 p. m. ET</text><text class="qv-q" x="56" y="179">La conferencia de prensa</text></g>
<g class="qv-f is-pas" data-k="3"><circle class="qv-halo" cx="28" cy="226" r="10"/><circle class="qv-pt" cx="28" cy="226" r="5.5"/><text class="qv-c" x="56" y="221">jue 29 oct, hacia las 9:00 a. m. ET</text><text class="qv-q" x="56" y="241">La tasa efectiva, de la Fed de Nueva York</text></g>
<g class="qv-f is-pas" data-k="4"><circle class="qv-halo" cx="28" cy="288" r="10"/><circle class="qv-pt" cx="28" cy="288" r="5.5"/><text class="qv-c" x="56" y="283">jue 29 oct, 11:59 p. m. ET</text><text class="qv-q" x="56" y="303">Termina el silencio</text></g>
<g class="qv-f is-pas is-now" data-k="5"><circle class="qv-halo" cx="28" cy="350" r="10"/><circle class="qv-pt" cx="28" cy="350" r="5.5"/><text class="qv-c" x="56" y="345">mié 18 nov, 2:00 p. m. ET</text><text class="qv-q" x="56" y="365">Las actas y la encuesta</text></g>
<circle class="qv-cur" cx="28" cy="40" r="11" transform="translate(0 310)"/>
<rect class="qv-sil" x="25" y="385" width="6" height="18"/><text class="qv-k" x="56" y="398">Línea gruesa: el silencio</text>
</svg>
