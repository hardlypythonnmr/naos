<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170" role="img" aria-labelledby="vm-es-ancho-t vm-es-ancho-d" style="max-width:100%;height:auto">
<title id="vm-es-ancho-t">De un titular a su fuente</title>
<desc id="vm-es-ancho-d">Seis piezas en orden de fecha, del titular hacia el original. La pieza de la que vienes se ilumina. 1, Lun 19 oct: Un titular del fin de semana. 2, Mar 20 oct: ¿Etiquetar toda imagen de IA?. 3, Sáb 14 nov: Un titular de la COP31. 4, Lun 16 nov, mediodía: Resúmenes: ¿sí o no?. 5, Lun 16 nov, tarde: Resúmenes de IA y clics. 6, Lun 28 dic: La historia de la que dudas. Las paradas van a la misma distancia, sin escala.</desc>
<style>
.vm-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);font-size:17px;fill:var(--naos-ink,#0E1116)}
.vm-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.vm-n{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:14px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vm-lin{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vm-pta{fill:var(--naos-ink,#0E1116)}
.vm-plato{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vm-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.vm-origen .vm-plato{fill:var(--naos-ink,#0E1116)}
.vm-origen .vm-n{fill:var(--naos-paper,#FFFFFF)}
.vm-origen .vm-aro{opacity:1}
.vm-origen .vm-t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
</style>
