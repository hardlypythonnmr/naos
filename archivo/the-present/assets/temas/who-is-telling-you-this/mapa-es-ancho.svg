<g class="vm-seat" data-n="2" data-src="1020p"><circle class="vm-aro" cx="208" cy="62" r="23"/><circle class="vm-plato" cx="208" cy="62" r="16"/><text class="vm-n" x="208" y="67" text-anchor="middle">2</text><text class="vm-f" x="208" y="28" text-anchor="middle">Mar 20 oct</text><text class="vm-t" x="208" y="112" text-anchor="middle">¿Etiquetar toda</text><text class="vm-t" x="208" y="134" text-anchor="middle">imagen de IA?</text></g>
<g class="vm-seat" data-n="3" data-src="1114p"><circle class="vm-aro" cx="336" cy="62" r="23"/><circle class="vm-plato" cx="336" cy="62" r="16"/><text class="vm-n" x="336" y="67" text-anchor="middle">3</text><text class="vm-f" x="336" y="28" text-anchor="middle">Sáb 14 nov</text><text class="vm-t" x="336" y="112" text-anchor="middle">Un titular de</text><text class="vm-t" x="336" y="134" text-anchor="middle">la COP31</text></g>
<g class="vm-seat" data-n="4" data-src="1116p-story-1200"><circle class="vm-aro" cx="464" cy="62" r="23"/><circle class="vm-plato" cx="464" cy="62" r="16"/><text class="vm-n" x="464" y="67" text-anchor="middle">4</text><text class="vm-f" x="464" y="12" text-anchor="middle">Lun 16 nov,</text><text class="vm-f" x="464" y="28" text-anchor="middle">mediodía</text><text class="vm-t" x="464" y="112" text-anchor="middle">Resúmenes: ¿sí</text><text class="vm-t" x="464" y="134" text-anchor="middle">o no?</text></g>
