# Rebuilds the schedule grid (data/semana.json) and, through it, the topic pages, short links, calendar files and sitemap
# every 30 minutes. The market data builder (construir-datos.mjs, data/situacion.json, data/radar.json) left with D-263:
# NAOS is Humanity only and nothing on the page read it.
# One pass per run (Opus 9, 13-nov-2026). The old loop (11 rounds with sleep 1800 and cancel-in-progress) kept a runner busy
# ~24 h a day (13.713 min in November). The home page only flags the grid as out of date after 72 h, so a pass every 2 h is
# plenty even when GitHub skips some schedule slots. It starts on the schedule or by hand.
name: Refresh page data

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build, check and push (one pass)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ronda in 1; do
            git pull -q --rebase origin main || true
            # The schedule grid (data/semana.json): the home page swaps its first block for "The schedule is out of date."
            # past 72 h, so it is rebuilt here. Kept when the grid changed or the committed one is over 12 h old.
            if node scripts/construir-semana.mjs; then
              node -e '
                const fs = require("fs"), cp = require("child_process");
                const nuevo = JSON.parse(fs.readFileSync("data/semana.json", "utf8"));
                const viejo = JSON.parse(cp.execSync("git show HEAD:data/semana.json", { encoding: "utf8" }));
                const sin = (d) => JSON.stringify({ ...d, generado: null });
                if (!Array.isArray(nuevo.items) || !nuevo.items.length) { console.log("semana.json: empty grid"); process.exit(1); }
                if (sin(nuevo) === sin(viejo) && Date.now() - Date.parse(viejo.generado) < 12 * 36e5) { console.log("semana.json: unchanged"); process.exit(1); }
                console.log("semana.json:", nuevo.generado, nuevo.items.length, "items");
              ' || git checkout -- data/semana.json
            else
              echo "round $ronda: schedule builder failed"; git checkout -- data/semana.json data/cortos.json temas es s sitemap.xml
            fi
            # construir-semana.mjs también rehace las páginas de tema, los enlaces cortos y el sitemap (construir-temas.mjs, D-252):
            # cambian solo si cambia data/enlaces.json o data/temas.json (salida determinista); es/ es la edición en español (D-253) y
            # data/cortos.json el registro de enlaces cortos, solo de suma
            if git diff --quiet -- data/semana.json data/cortos.json assets/ics temas es s sitemap.xml && [ -z "$(git ls-files --others --exclude-standard -- temas es s)" ]; then echo "round $ronda: no change"; continue; fi
            git add data/semana.json data/cortos.json assets/ics temas es s sitemap.xml
            git commit -q -m "Refresh page data $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep $((i * 5))
            done
            # Pushes made with GITHUB_TOKEN may not start the branch-based Pages build on their own; ask for one.
            gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
          done
