<h3 class="viz-t">Qué sale y en qué orden</h3>
<svg class="qv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 414" width="344" height="414" role="img" aria-labelledby="qv-t-es qv-d-es" lang="es">
<title id="qv-t-es">Proceso: seis cosas que salen después de que la Fed decide el 28 de octubre, en orden, desde el comunicado a las 2:00 p. m. ET hasta las actas del 18 de noviembre.</title>
<desc id="qv-d-es">Una línea vertical con seis pasos. Uno: miércoles 28 de octubre a las 2:00 p. m. ET, el comunicado y la votación. Dos: en ese mismo momento, la nota con las tasas de la Fed. Tres: 2:30 p. m. ET, la conferencia de prensa. Cuatro: jueves 29 de octubre hacia las 9:00 a. m. ET, la tasa efectiva de la Fed de Nueva York. Cinco: jueves 29 de octubre a las 11:59 p. m. ET, termina el silencio. Seis: miércoles 18 de noviembre a las 2:00 p. m. ET, las actas y la encuesta. Una línea gruesa marca el silencio, hasta el paso cinco.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> Después de la decisión del 28 de octubre salen seis cosas, en este orden y de lugares distintos. Reprodúcelo, o avanza un paso a la vez.</p>
<p class="viz-nota">Sin escala. Horas de Nueva York (ET); Colombia va una hora atrás hasta el 1 de noviembre. Ninguna cifra del día: las da la Fed. Descriptivo, sin asesoría financiera.</p>
<details class="viz-alt"><summary>Versión en texto del proceso</summary><ol><li>Miércoles 28 de octubre, 2:00 p. m. ET, 1:00 p. m. en Colombia. Sale el comunicado, con la votación y quién votó en contra.</li><li>En ese mismo momento. La nota de implementación trae las tasas de las herramientas de la propia Fed.</li><li>Miércoles 28 de octubre, 2:30 p. m. ET, 1:30 p. m. en Colombia. El presidente de la Fed, Kevin Warsh, habla con la prensa.</li><li>Jueves 29 de octubre, hacia las 9:00 a. m. ET, 8:00 a. m. en Colombia. La Fed de Nueva York publica la tasa efectiva.</li><li>Jueves 29 de octubre, 11:59 p. m. ET, 10:59 p. m. en Colombia. Termina el silencio. Desde el viernes 30 los miembros de la Fed vuelven a hablar.</li><li>Miércoles 18 de noviembre, 2:00 p. m. ET, 2:00 p. m. en Colombia. Salen las actas de esta reunión. Hacia esa fecha sale también la encuesta de expectativas de la Fed de Nueva York.</li></ol><p class="viz-nota">Colombia va una hora atrás de Nueva York hasta el domingo 1 de noviembre; desde ese día tienen la misma hora.</p></details></figcaption>
