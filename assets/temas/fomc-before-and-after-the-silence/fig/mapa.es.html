<figure class="viz viz-mapa" lang="es" data-viz="mapa">
<h3 class="viz-t">Del silencio a las actas</h3>
<svg class="mp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 793" width="344" height="793" role="img" aria-labelledby="mp-t-es mp-d-es" lang="es">
<title id="mp-t-es">Mapa de esta página: nueve paradas por fecha, desde el día en que la Fed se calla, el 17 de octubre, hasta su próxima reunión, el 8 y 9 de diciembre.</title>
<desc id="mp-d-es">Una línea vertical con nueve paradas en orden de fecha. Sábado 17 de octubre, empieza el silencio. En la semana de la reunión: martes 27 de octubre, antes de la decisión; miércoles 28 de octubre a las 2:00 p. m. ET, el comunicado; a las 2:30 p. m. ET, la conferencia de prensa; jueves 29 de octubre a las 11:59 p. m. ET, termina el silencio; viernes 30 de octubre, tres palabras. Después: domingo 1 de noviembre, cinco bancos; miércoles 18 de noviembre a las 2:00 p. m. ET, las actas; martes 8 y miércoles 9 de diciembre, la próxima reunión, con proyecciones. Una línea gruesa marca el silencio, del 17 al 29 de octubre. Los puntos llenos son Shorts y Reels de esta página.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> La semana de la reunión queda en el centro. Antes va el silencio y después, las actas. Se enciende la pieza de la que vienes.</p>
<p class="viz-nota">Las paradas van a igual distancia, no a escala de tiempo. Las horas son de Nueva York (ET).</p>
