<h3 class="viz-t">What comes out, in order</h3>
<svg class="qv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 414" width="344" height="414" role="img" aria-labelledby="qv-t-en qv-d-en" lang="en">
<title id="qv-t-en">Process: six things that come out after the Fed decides on 28 October, in order, from the statement at 2:00 p.m. ET to the minutes on 18 November.</title>
<desc id="qv-d-en">A vertical line with six steps. One: Wednesday 28 October at 2:00 p.m. ET, the statement and the vote. Two: at the same moment, the note with the Fed&#x27;s tool rates. Three: 2:30 p.m. ET, the Chair&#x27;s press conference. Four: Thursday 29 October at about 9:00 a.m. ET, the effective rate from the New York Fed. Five: Thursday 29 October at 11:59 p.m. ET, the silence ends. Six: Wednesday 18 November at 2:00 p.m. ET, the minutes and the survey. A heavy line marks the silence, up to step five.</desc>

<p class="qv-estado">Wed 18 Nov, 2:00 p.m. ET (2:00 p.m. in Medellín): the minutes of this meeting come out. The New York Fed&#x27;s survey of what markets expected comes out about then too.</p>

<figcaption><p class="viz-que"><strong>What this shows.</strong> After the decision on 28 October, six things come out, in this order and from different places. Play it, or go one step at a time.</p>
<p class="viz-nota">Not to scale. Times are New York (ET); Medellín is one hour behind until 1 November. No numbers from the day: they come from the Fed. Descriptive, not financial advice.</p>
<details class="viz-alt"><summary>Text version of the process</summary><ol><li>Wed 28 Oct, 2:00 p.m. ET, 1:00 p.m. in Medellín. The statement comes out. It lists the vote and who voted against.</li><li>At the same moment. The implementation note lists the rates on the Fed&#x27;s own tools.</li><li>Wed 28 Oct, 2:30 p.m. ET, 1:30 p.m. in Medellín. Chair Kevin Warsh speaks to the press.</li><li>Thursday 29 October, about 9:00 a.m. ET, 8:00 a.m. in Medellín. The New York Fed posts the effective rate.</li><li>Thursday 29 October, 11:59 p.m. ET, 10:59 p.m. in Medellín. The silence ends. From Friday 30 October, officials talk again.</li><li>Wednesday 18 November, 2:00 p.m. ET, 2:00 p.m. in Medellín. The minutes of this meeting come out. The New York Fed&#x27;s survey of what markets expected comes out about then too.</li></ol><p class="viz-nota">Medellín is one hour behind New York until Sunday 1 November, and on the same hour after that.</p></details></figcaption>
