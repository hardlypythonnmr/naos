<svg class="mp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 776" width="344" height="776" role="img" aria-labelledby="mp-t-en mp-d-en" lang="en">
<title id="mp-t-en">Map of this page: nine stops in date order, from the day the Fed falls silent on 17 October to its next meeting on 8 and 9 December.</title>
<desc id="mp-d-en">A vertical line with nine stops in date order. Saturday 17 October, the silence begins. In the week of the meeting: Tuesday 27 October, before the decision; Wednesday 28 October at 2:00 p.m. ET, the statement; at 2:30 p.m. ET, the press conference; Thursday 29 October at 11:59 p.m. ET, the silence ends; Friday 30 October, three words. Afterwards: Sunday 1 November, five banks; Wednesday 18 November at 2:00 p.m. ET, the minutes; Tuesday 8 and Wednesday 9 December, the next meeting, with projections. A heavy line marks the silence, from 17 to 29 October. Filled dots are Shorts and Reels on this page.</desc>
<style>svg.mp{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.mp[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.mp text{fill:var(--ink)}svg.mp .mp-gh{fill:var(--grey);font-size:13px;font-weight:600}svg.mp .mp-d{fill:var(--grey);font-size:13px;font-variant-numeric:tabular-nums}svg.mp .mp-t{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:17px;font-weight:400}svg.mp .mp-p{fill:var(--grey);font-size:13px}svg.mp .mp-k{fill:var(--grey);font-size:13px}svg.mp .mp-sp{fill:none;stroke:var(--chart);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:.1 7}svg.mp .mp-sil{fill:var(--ink)}svg.mp .mp-halo{fill:var(--paper)}svg.mp .mp-sh{fill:var(--ink);stroke:var(--ink);stroke-width:2}svg.mp .mp-st{fill:var(--paper);stroke:var(--ink);stroke-width:2.4}svg.mp .mp-sel{display:none;fill:none;stroke:var(--ink);stroke-width:2}svg.mp .is-from .mp-sel{display:inline}svg.mp .is-from .mp-t{font-weight:600}</style>
