<svg class="qv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 414" width="344" height="414" role="img" aria-labelledby="qv-t-en qv-d-en" lang="en">
<title id="qv-t-en">Process: six things that come out after the Fed decides on 28 October, in order, from the statement at 2:00 p.m. ET to the minutes on 18 November.</title>
<desc id="qv-d-en">A vertical line with six steps. One: Wednesday 28 October at 2:00 p.m. ET, the statement and the vote. Two: at the same moment, the note with the Fed&#x27;s tool rates. Three: 2:30 p.m. ET, the Chair&#x27;s press conference. Four: Thursday 29 October at about 9:00 a.m. ET, the effective rate from the New York Fed. Five: Thursday 29 October at 11:59 p.m. ET, the silence ends. Six: Wednesday 18 November at 2:00 p.m. ET, the minutes and the survey. A heavy line marks the silence, up to step five.</desc>
<style>svg.qv{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.qv[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.qv text{fill:var(--ink)}svg.qv .qv-c{fill:var(--sec);font-size:13px;font-variant-numeric:tabular-nums}svg.qv .qv-q{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:16px;font-weight:400}svg.qv .qv-k{fill:var(--grey);font-size:13px}svg.qv .qv-sp{fill:none;stroke:var(--chart);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:.1 7}svg.qv .qv-sil{fill:var(--ink)}svg.qv .qv-band{fill:var(--rule)}svg.qv .qv-halo{fill:var(--paper)}svg.qv .qv-pt{fill:var(--paper);stroke:var(--ink);stroke-width:2.4}svg.qv .is-pas .qv-pt{fill:var(--ink)}svg.qv .qv-cur{fill:none;stroke:var(--ink);stroke-width:2.5}svg.qv .is-now .qv-q{font-weight:600}</style>
<rect class="qv-band" x="6" y="13" width="332" height="54" transform="translate(0 310)"/>
<path class="qv-sp" d="M28 40V350"/>
<rect class="qv-sil" x="25" y="40" width="6" height="248"/>
<g class="qv-f is-pas" data-k="0"><circle class="qv-halo" cx="28" cy="40" r="10"/><circle class="qv-pt" cx="28" cy="40" r="5.5"/><text class="qv-c" x="56" y="35">Wed 28 Oct, 2:00 p.m. ET</text><text class="qv-q" x="56" y="55">The statement and the vote</text></g>
<g class="qv-f is-pas" data-k="1"><circle class="qv-halo" cx="28" cy="102" r="10"/><circle class="qv-pt" cx="28" cy="102" r="5.5"/><text class="qv-c" x="56" y="97">At the same moment</text><text class="qv-q" x="56" y="117">The note with the Fed&#x27;s tool rates</text></g>
<g class="qv-f is-pas" data-k="2"><circle class="qv-halo" cx="28" cy="164" r="10"/><circle class="qv-pt" cx="28" cy="164" r="5.5"/><text class="qv-c" x="56" y="159">Wed 28 Oct, 2:30 p.m. ET</text><text class="qv-q" x="56" y="179">The Chair&#x27;s press conference</text></g>
<g class="qv-f is-pas" data-k="3"><circle class="qv-halo" cx="28" cy="226" r="10"/><circle class="qv-pt" cx="28" cy="226" r="5.5"/><text class="qv-c" x="56" y="221">Thu 29 Oct, about 9:00 a.m. ET</text><text class="qv-q" x="56" y="241">The effective rate, from the New York Fed</text></g>
<g class="qv-f is-pas" data-k="4"><circle class="qv-halo" cx="28" cy="288" r="10"/><circle class="qv-pt" cx="28" cy="288" r="5.5"/><text class="qv-c" x="56" y="283">Thu 29 Oct, 11:59 p.m. ET</text><text class="qv-q" x="56" y="303">The silence ends</text></g>
<g class="qv-f is-pas is-now" data-k="5"><circle class="qv-halo" cx="28" cy="350" r="10"/><circle class="qv-pt" cx="28" cy="350" r="5.5"/><text class="qv-c" x="56" y="345">Wed 18 Nov, 2:00 p.m. ET</text><text class="qv-q" x="56" y="365">The minutes, and the survey</text></g>
<circle class="qv-cur" cx="28" cy="40" r="11" transform="translate(0 310)"/>
<rect class="qv-sil" x="25" y="385" width="6" height="18"/><text class="qv-k" x="56" y="398">Heavy line: the silence</text>
</svg>
