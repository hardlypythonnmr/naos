<text class="vg-v" x="365.6" y="296" text-anchor="start">by day 2 · Thu 5 Nov</text>
<text class="vg-s" x="30" y="333" text-anchor="start">Georgia: counties certify</text>
<path class="vg-espera" d="M330.0 328 H460.8"/><circle class="vg-dia0" cx="330.0" cy="328" r="7"/><circle class="vg-ofi vg-vieja" cx="460.8" cy="328" r="8"/>
