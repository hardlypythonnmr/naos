<text class="vg-s" x="30" y="397" text-anchor="start">Georgia: state deadline</text>
<path class="vg-espera" d="M330.0 392 H700.6"/><circle class="vg-dia0" cx="330.0" cy="392" r="7"/><circle class="vg-ofi vg-vieja" cx="700.6" cy="392" r="8"/>
<text class="vg-v" x="708.6" y="424" text-anchor="end">by day 17 · Fri 20 Nov</text>
<text class="vg-s" x="30" y="501" text-anchor="start">General count by the Provincial Boards</text>
<path class="vg-espera" d="M330.0 496 H439.0"/><circle class="vg-dia0" cx="330.0" cy="496" r="7"/><rect class="vg-ofi" x="431.0" y="488" width="81.4" height="16" rx="8"/>
<text class="vg-v" x="431.0" y="528" text-anchor="start">days 5 to 8 · Fri 4 to Mon 7 Dec</text>
<text class="vg-f" x="548.0" y="588" text-anchor="middle">Days after voting day (0 is voting day)</text>
<circle class="vg-dia0" cx="28" cy="628" r="6"/>
<text class="vg-f" x="56" y="633" text-anchor="start">First number, on voting night</text>
<rect class="vg-ofi" x="16" y="650" width="30" height="14" rx="7"/>
<text class="vg-f" x="56" y="662" text-anchor="start">Official step (a long shape is a window of days)</text>
<circle class="vg-ofi vg-vieja" cx="31" cy="686" r="7.5"/>
<text class="vg-f" x="56" y="691" text-anchor="start">Dashed ring: date read from an older copy, checked again before 3 Nov</text>
