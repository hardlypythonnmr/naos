<text class="vg-f" x="56" y="720" text-anchor="start">Dotted line: no official date confirmed</text>
<line class="vg-sep" x1="16" x2="784" y1="742" y2="742"/>
<text class="vg-f" x="16" y="762" text-anchor="start">Sources: [2] [3] [4] [17] [25] [27] [34] [35] [40]. Read on 16 October 2026. Georgia&#x27;s dates come from a Wayback copy of</text><text class="vg-f" x="16" y="779" text-anchor="start">its calendar dated 26 March 2026.</text>
