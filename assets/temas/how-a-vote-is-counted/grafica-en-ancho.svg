<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="vg-en-ancho-t vg-en-ancho-d" style="max-width:100%;height:auto">
<title id="vg-en-ancho-t">Days from voting day to each official step</title>
<desc id="vg-en-ancho-d">How many days pass between voting day and each official step, where our sources give a date. In the United States, Michigan&#x27;s county boards meet by day 2, Georgia&#x27;s counties certify by day 6 and its state by day 17. In Spain, the official general count runs from day 5 to day 8. In each case the first number comes on voting night and the official step has its own date. Brazil&#x27;s first count starts at 17:00 Brasília; our sources give no official-result date, so that row ends in a dotted line. Michigan and Georgia are two examples; each US state sets its own dates. This is the calendar the law sets; how fast a count goes is a different question. Sources: [2] [3] [4] [17] [25] [27] [34] [35] [40]. Read on 16 October 2026. Georgia&#x27;s dates come from a Wayback copy of its calendar dated 26 March 2026.</desc>
<style>
.vg-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)}
.vg-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.vg-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:14px;fill:var(--naos-sec,#454C57)}
.vg-v{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:14px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vg-t,.vg-f,.vg-s,.vg-v{paint-order:stroke;stroke:var(--naos-paper,#FFFFFF);stroke-width:4px;stroke-linejoin:round}
.vg-grid{stroke:var(--naos-rule,#D7DBE0);stroke-width:1}
.vg-base{stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vg-sep{stroke:var(--naos-ink,#0E1116);stroke-width:1}
.vg-espera{stroke:var(--naos-chart,#737B87);stroke-width:2.5;fill:none}
.vg-punt{stroke:var(--naos-ink,#0E1116);stroke-width:3;stroke-linecap:round;fill:none;stroke-dasharray:.1 7}
.vg-dia0{fill:var(--naos-ink,#0E1116)}
.vg-ofi{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2.5}
.vg-vieja{stroke-dasharray:3.5 3}
</style>
