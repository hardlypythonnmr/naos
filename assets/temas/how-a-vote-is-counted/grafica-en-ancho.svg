<text class="vg-f" x="330.0" y="566" text-anchor="middle">0</text>
<line class="vg-grid" x1="439.0" x2="439.0" y1="108" y2="548"/>
<text class="vg-f" x="439.0" y="566" text-anchor="middle">5</text>
<line class="vg-grid" x1="548.0" x2="548.0" y1="108" y2="548"/>
<text class="vg-f" x="548.0" y="566" text-anchor="middle">10</text>
<line class="vg-grid" x1="657.0" x2="657.0" y1="108" y2="548"/>
<text class="vg-f" x="657.0" y="566" text-anchor="middle">15</text>
<line class="vg-grid" x1="766.0" x2="766.0" y1="108" y2="548"/>
<text class="vg-f" x="766.0" y="566" text-anchor="middle">20</text>
<text class="vg-t" font-size="22" x="16" y="34" text-anchor="start">Days from voting day to each official step</text>
<text class="vg-f" x="16" y="58" text-anchor="start">Where our sources give a date. Michigan and Georgia are two examples: each US state sets its own</text><text class="vg-f" x="16" y="76" text-anchor="start">dates.</text>
<text class="vg-t" x="16" y="128" font-size="17">Brazil, runoff · Sun 25 Oct</text>
<text class="vg-t" x="16" y="232" font-size="17">United States, midterms · Tue 3 Nov</text>
<text class="vg-t" x="16" y="464" font-size="17">Spain, general · Sun 29 Nov</text>
<text class="vg-s" x="30" y="156" text-anchor="start">First count: president, from 17:00</text><text class="vg-s" x="30" y="174" text-anchor="start">Brasília</text>
