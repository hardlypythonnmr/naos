<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-labelledby="vm-en-ancho-t vm-en-ancho-d" style="max-width:100%;height:auto">
<title id="vm-en-ancho-t">From the first count to the official one</title>
<desc id="vm-en-ancho-d">Three elections on one line: first the night&#x27;s count, then an official step with its own date. Brazil&#x27;s official date is not in our sources yet, and the line is not to scale. 1, Sat 24 Oct: Before Brazil&#x27;s runoff. 2, Sun 25 Oct, 16:00 ET: Brazil&#x27;s first count. 3, Tue 3 Nov: US Election Day. 4, Thu 5 Nov: A county canvass. 5, Fri 20 Nov: A state&#x27;s deadline. 6, Sun 29 Nov, 14:00 ET: Spain counts. 7, Fri 4 to Mon 7 Dec: Spain&#x27;s official count.</desc>
<style>
.vm-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);font-size:17px;fill:var(--naos-ink,#0E1116)}
.vm-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-sec,#454C57)}
.vm-g{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.vm-n{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:14px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vm-lin{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vm-pta{fill:var(--naos-ink,#0E1116)}
.vm-tick{stroke:var(--naos-chart,#737B87);stroke-width:1.5}
.vm-m{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2.5}
.vm-primero .vm-m{fill:var(--naos-ink,#0E1116)}
.vm-primero .vm-n{fill:var(--naos-paper,#FFFFFF)}
.vm-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.vm-origen .vm-aro{opacity:1}
.vm-origen .vm-t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
</style>
<path class="vm-lin" d="M24 113 H764"/><path class="vm-pta" d="M782 113 l-14 -7 v14 z"/>
<path class="vm-tick" d="M84.0 99 V83"/>
<g class="vm-seat vm-alrededor" data-n="1" data-src="1024p"><circle class="vm-aro" cx="84.0" cy="113" r="21"/><rect class="vm-m" x="71.0" y="100" width="26" height="26"/><text class="vm-n" x="84.0" y="118" text-anchor="middle">1</text><text class="vm-f" x="84.0" y="33" text-anchor="middle">Sat 24 Oct</text><text class="vm-t" x="84.0" y="54" text-anchor="middle">Before Brazil&#x27;s</text><text class="vm-t" x="84.0" y="75" text-anchor="middle">runoff</text></g>
<path class="vm-tick" d="M189.3 127 V143"/>
<g class="vm-seat vm-primero" data-n="2" data-src=""><circle class="vm-aro" cx="189.3" cy="113" r="21"/><circle class="vm-m" cx="189.3" cy="113" r="13"/><text class="vm-n" x="189.3" y="118" text-anchor="middle">2</text><text class="vm-f" x="189.3" y="157" text-anchor="middle">Sun 25 Oct, 16:00 ET</text><text class="vm-t" x="189.3" y="178" text-anchor="middle">Brazil&#x27;s first</text><text class="vm-t" x="189.3" y="199" text-anchor="middle">count</text></g>
<path class="vm-tick" d="M294.7 99 V83"/>
<g class="vm-seat vm-primero" data-n="3" data-src="1031p 1103p"><circle class="vm-aro" cx="294.7" cy="113" r="21"/><circle class="vm-m" cx="294.7" cy="113" r="13"/><text class="vm-n" x="294.7" y="118" text-anchor="middle">3</text><text class="vm-f" x="294.7" y="54" text-anchor="middle">Tue 3 Nov</text><text class="vm-t" x="294.7" y="75" text-anchor="middle">US Election Day</text></g>
<path class="vm-tick" d="M400.0 127 V143"/>
<g class="vm-seat vm-oficial" data-n="4" data-src=""><circle class="vm-aro" cx="400.0" cy="113" r="21"/><circle class="vm-m" cx="400.0" cy="113" r="13"/><text class="vm-n" x="400.0" y="118" text-anchor="middle">4</text><text class="vm-f" x="400.0" y="157" text-anchor="middle">Thu 5 Nov</text><text class="vm-t" x="400.0" y="178" text-anchor="middle">A county canvass</text><text class="vm-g" x="400.0" y="195" text-anchor="middle">US, example: Michigan</text></g>
<path class="vm-tick" d="M505.3 99 V83"/>
<g class="vm-seat vm-oficial" data-n="5" data-src=""><circle class="vm-aro" cx="505.3" cy="113" r="21"/><circle class="vm-m" cx="505.3" cy="113" r="13"/><text class="vm-n" x="505.3" y="118" text-anchor="middle">5</text><text class="vm-f" x="505.3" y="37" text-anchor="middle">Fri 20 Nov</text><text class="vm-t" x="505.3" y="58" text-anchor="middle">A state&#x27;s deadline</text><text class="vm-g" x="505.3" y="75" text-anchor="middle">US, example: Georgia</text></g>
<path class="vm-tick" d="M610.7 127 V143"/>
<g class="vm-seat vm-primero" data-n="6" data-src="1128p 1130p"><circle class="vm-aro" cx="610.7" cy="113" r="21"/><circle class="vm-m" cx="610.7" cy="113" r="13"/><text class="vm-n" x="610.7" y="118" text-anchor="middle">6</text><text class="vm-f" x="610.7" y="157" text-anchor="middle">Sun 29 Nov, 14:00 ET</text><text class="vm-t" x="610.7" y="178" text-anchor="middle">Spain counts</text></g>
<path class="vm-tick" d="M716.0 99 V83"/>
<g class="vm-seat vm-oficial" data-n="7" data-src=""><circle class="vm-aro" cx="716.0" cy="113" r="21"/><circle class="vm-m" cx="716.0" cy="113" r="13"/><text class="vm-n" x="716.0" y="118" text-anchor="middle">7</text><text class="vm-f" x="716.0" y="33" text-anchor="middle">Fri 4 to Mon 7 Dec</text><text class="vm-t" x="716.0" y="54" text-anchor="middle">Spain&#x27;s official</text><text class="vm-t" x="716.0" y="75" text-anchor="middle">count</text></g>
<g class="vm-primero"><circle class="vm-m" cx="32" cy="236" r="8"/></g><text class="vm-g" x="50" y="241">First count, on the night</text>
<g class="vm-oficial"><circle class="vm-m" cx="260.5" cy="236" r="8"/></g><text class="vm-g" x="278.5" y="241">An official step</text>
<g class="vm-alrededor"><rect class="vm-m" x="418.9" y="228" width="16" height="16"/></g><text class="vm-g" x="444.9" y="241">A date around the count</text>
</svg>
