<h3 class="viz-t">The moon on the four walking nights</h3>
<p class="viz-sub">How much of the moon is lit at 8 pm in New York, and when it rises or sets, by each city&#x27;s own clock</p>
<svg class="cl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 466" width="420" height="466" role="img" aria-labelledby="cl-t-en cl-d-en" lang="en">
<title id="cl-t-en">Dot chart of four walking nights. Thursday 22 October, about 88% lit: the moon rises at 16:13 in New York and 15:08 in Medellín. Sunday 13 December, about 21% lit: it sets at 20:43 and 21:42. Tuesday 15 December, about 38% lit: it sets at 22:47 and 23:11. Thursday 17 December, about 58% lit: it rises at 11:59 and 12:16.</title>
<desc id="cl-d-en">Four rows, one per night, each with a small moon drawn at its lit share and two points on a clock axis from 11:00 to 24:00: a filled dot for New York and a ring for Medellín, each labeled with the hour the moon rises or sets. A dotted line marks 10 pm. On 13 December both points sit left of the line: the moon has set before ten in both cities.</desc>

<figcaption><p class="viz-que"><strong>What this shows.</strong> How much moon there is on each walking night, and when it rises or sets by each city&#x27;s clock. For the Geminids on 13 December we ask you to be out at ten, and by then the moon has set in both cities.</p>
<p class="viz-nota">Measured. Rise and set times: U.S. Naval Observatory [4]. Share lit: NASA/JPL Horizons [5]. Both checked on 16 October 2026. Each city shows its own clock: New York is on daylight time on 22 October (EDT) and on standard time in December (EST).</p>
