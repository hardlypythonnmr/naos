<h3 class="viz-t">Ocho tardes, un camino</h3>
<div class="cv-wrap"><svg class="cv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" width="360" height="272" role="img" aria-labelledby="cv-t-es cv-d-es" lang="es">
<title id="cv-t-es">La primera ronda de la primera caminata: una fila de ocho lunas, de un poco más de la mitad a casi llena, con las fechas del 18 al 25 de octubre, y debajo un solo camino de puntos que va hasta una curva y vuelve. Toca una luna para marcarla con lápiz.</title>
<desc id="cv-d-es">Ocho tardes seguidas, del domingo 18 al domingo 25 de octubre. Un punto camina hasta la curva del camino, se detiene, mira una vez la luna de esa tarde y vuelve, y se dibuja una raya de lápiz bajo la fecha de esa tarde. Las lunas se dibujan con la fase de la luna a las 8 de la noche en Nueva York; van de un poco más de la mitad a casi llena.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> Las rayas de lápiz de la primera caminata, una por tarde. Un punto recorre el mismo camino hasta la curva y de vuelta, mira la luna una vez, y esa tarde queda con su raya. Corre una sola vez, y puedes pausarla, ir tarde por tarde o tocar una luna para marcarla tú.</p>
<p class="viz-nota">Los pasos de la primera caminata:</p><ol class="viz-lista"><li>Escoge una sola calle.</li><li>Detente en el mismo lugar y mira hacia arriba.</li><li>Marca cada tarde. Cuando la luna esté llena, terminas.</li></ol>
<p class="viz-nota">Nuestro experimento. Todas las rondas funcionan igual; las siguientes empiezan el martes 17 de noviembre y el jueves 17 de diciembre [4]. Una semana de rayas es solo un comienzo. En un estudio con 96 personas (82 dieron datos suficientes), una conducta diaria tardó entre 18 y 254 días en volverse automática, y faltar un día no pesó mucho [21]. No encontramos ningún estudio sobre caminar según la fase de la luna [23]. Si se te pasa una tarde, camina la siguiente. Del 18 al 25 son ocho tardes; en Nueva York la luna llena llegó justo después de la medianoche del 26.</p></figcaption>
