<figure class="viz viz-mapa" lang="es" data-viz="mapa">
<h3 class="viz-t">Un camino, cuatro lunas</h3>
<svg class="cm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 883" width="400" height="883" role="img" aria-labelledby="cm-t-es cm-d-es" lang="es">
<title id="cm-t-es">Mapa de esta página: un camino dibujado con puntos que serpentea hacia abajo por la página, con la luna dibujada a su lado cuatro veces, muy iluminada el 22 de octubre, una creciente delgada el 13 de diciembre, una creciente más gruesa el 15 y un poco más que media luna el 17, y nueve piezas puestas a lo largo del camino.</title>
<desc id="cm-d-es">Nueve piezas en orden de fecha a lo largo de un solo camino de puntos. Jueves 22 de octubre: Camina la misma calle hasta que la luna esté llena, una historia al mediodía y un Short de noche, junto a una luna muy iluminada. Domingo 13 de diciembre: Gemínidas esta noche y Sal a ver las Gemínidas esta noche, junto a una creciente delgada. Martes 15 de diciembre: Camina al lado de alguien, al mediodía y de noche, junto a una creciente más gruesa. Jueves 17 de diciembre: Vuelve a casa por el camino largo, al mediodía y de noche, junto a una luna que pasó un poco la mitad. Sábado 19 de diciembre: la versión en español del Short del 15 de diciembre, sin luna. Un punto lleno es una pieza ya publicada; un anillo es una pieza que viene.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> Las piezas van por un solo camino, en orden de fecha, y la luna que está junto a cada tramo es la luna de esa noche. La pieza de la que vienes lleva un círculo, y el camino se ilumina hasta ella.</p>
<p class="viz-nota">La luna se dibuja como está a las 8 de la noche en Nueva York en la noche de cada pareja de piezas. La separación es pareja dentro de una noche y no sigue el calendario. La pieza del 19 de diciembre es la versión en español del Short del 15, así que no lleva luna propia.</p>
