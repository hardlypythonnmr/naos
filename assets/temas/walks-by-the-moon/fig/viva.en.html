<h3 class="viz-t">Eight evenings, one road</h3>
<div class="cv-wrap"><svg class="cv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" width="360" height="272" role="img" aria-labelledby="cv-t-en cv-d-en" lang="en">
<title id="cv-t-en">The first round of the first walk: a row of eight moons, from just past half to almost round, with the dates 18 to 25 October, and under it one dotted road that goes out to a bend and back. Tap a moon to mark it with a pencil.</title>
<desc id="cv-d-en">Eight evenings in a row, Sunday 18 to Sunday 25 October. A dot walks out to the bend of the road, stops, looks up once at the moon of that evening, walks back, and a pencil mark is drawn under that evening&#x27;s date. The moons are drawn from the moon&#x27;s phase at 8 pm in New York; they grow from just past half to almost round.</desc>

<figcaption><p class="viz-que"><strong>What this shows.</strong> The pencil marks of the first walk, one per evening. A dot walks the same road out to the bend and back, looks up once at the moon, and that evening gets its mark. It plays once, and you can pause it, go evening by evening, or tap a moon to mark it yourself.</p>
<p class="viz-nota">The steps of the first walk:</p><ol class="viz-lista"><li>Pick one road.</li><li>Stop at the same spot and look up.</li><li>Mark it. Stop when the moon is full.</li></ol>
<p class="viz-nota">Our experiment. Every round works the same; the next ones start on Tuesday 17 November and Thursday 17 December [4]. A week of marks is only a start. In a study of 96 people (82 gave enough data), it took from 18 to 254 days for a daily behavior to become automatic, and missing one day did not matter much [21]. We found no study of walking by moon phase [23]. If you miss an evening, walk the next one. From the 18th to the 25th is eight evenings; the moon was full just after midnight on the 26th in New York.</p></figcaption>
