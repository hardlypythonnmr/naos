<svg class="cv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 272" width="360" height="272" role="img" aria-labelledby="cv-t-es cv-d-es" lang="es">
<title id="cv-t-es">La primera ronda de la primera caminata: una fila de ocho lunas, de un poco más de la mitad a casi llena, con las fechas del 18 al 25 de octubre, y debajo un solo camino de puntos que va hasta una curva y vuelve. Toca una luna para marcarla con lápiz.</title>
<desc id="cv-d-es">Ocho tardes seguidas, del domingo 18 al domingo 25 de octubre. Un punto camina hasta la curva del camino, se detiene, mira una vez la luna de esa tarde y vuelve, y se dibuja una raya de lápiz bajo la fecha de esa tarde. Las lunas se dibujan con la fase de la luna a las 8 de la noche en Nueva York; van de un poco más de la mitad a casi llena.</desc>
<style>svg.cv{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.cv[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.cv text{fill:var(--ink)}svg.cv .cv-g{fill:var(--grey);font-size:15px;text-anchor:middle}svg.cv .cv-n{font-size:17px;font-weight:600;text-anchor:middle;font-variant-numeric:tabular-nums}svg.cv .cv-mes{fill:var(--grey);font-size:15px}svg.cv .cv-lb{fill:var(--grey);font-size:15px}svg.cv .cv-sh{fill:var(--paper);stroke:var(--chart);stroke-width:1.6}svg.cv .cv-lit{fill:var(--ink)}svg.cv .cv-mark{fill:none;stroke:var(--ink);stroke-width:2.8;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .5s linear}svg.cv .cv-e[data-on] .cv-mark{stroke-dashoffset:0;opacity:1}svg.cv .cv-road{fill:none;stroke:var(--chart);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:.01 8.5}svg.cv .cv-cola{fill:none;stroke:var(--chart);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:.01 12}svg.cv .cv-casa{fill:var(--paper);stroke:var(--ink);stroke-width:2}svg.cv .cv-dot{fill:var(--ink)}svg.cv .cv-look{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;opacity:0}svg.cv .cv-ring{fill:none;stroke:var(--ink);stroke-width:2;opacity:0}@media (prefers-reduced-motion:reduce){svg.cv .cv-mark{transition:none}}svg.cv[data-quieto] .cv-mark{transition:none}</style>
