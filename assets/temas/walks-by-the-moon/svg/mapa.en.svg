<svg class="cm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" width="400" height="860" role="img" aria-labelledby="cm-t-en cm-d-en" lang="en">
<title id="cm-t-en">Map of this page: one road drawn in dots that winds down the page, with the moon drawn beside it four times, mostly lit on 22 October, a thin crescent on 13 December, a fuller crescent on 15 December and just past half on 17 December, and nine pieces set along the road.</title>
<desc id="cm-d-en">Nine pieces in date order along one dotted road. Thursday 22 October: Walk the same road until the moon is full, a story at noon and a Short at night, beside a moon that is mostly lit. Sunday 13 December: Geminids tonight, and Go see the Geminids tonight, beside a thin crescent. Tuesday 15 December: Walk side by side, at noon and at night, beside a fuller crescent. Thursday 17 December: Walk home the long way, at noon and at night, beside a moon just past half. Saturday 19 December: the Spanish version of the 15 December Short, with no moon. A filled dot is a piece that is out; a ring is a piece that is coming.</desc>
<style>svg.cm{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.cm[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.cm text{fill:var(--ink)}svg.cm .cm-d{fill:var(--grey);font-size:16px;font-variant-numeric:tabular-nums}svg.cm .cm-t{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:21px;font-weight:400}svg.cm .cm-k{fill:var(--grey);font-size:16px}svg.cm .cm-p{fill:var(--grey);font-size:15px;text-anchor:middle}svg.cm .cm-road{fill:none;stroke:var(--chart);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:.01 8.5}svg.cm .cm-lit{fill:none;stroke:var(--ink);stroke-width:3.6;stroke-linecap:round;stroke-dasharray:.01 8.5}svg.cm .cm-mk{transition:stroke-dashoffset 1s cubic-bezier(.2,0,0,1)}svg.cm .cm-sh{fill:var(--paper);stroke:var(--chart);stroke-width:1.6}svg.cm .cm-lit-m{fill:var(--ink)}svg.cm .cm-halo{fill:var(--paper)}svg.cm .cm-out{fill:var(--ink)}svg.cm .cm-in{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}svg.cm .cm-sel{display:none;fill:none;stroke:var(--ink);stroke-width:2}svg.cm .is-from .cm-sel{display:inline}svg.cm .is-from .cm-t{font-weight:600}@media (prefers-reduced-motion:reduce){svg.cm .cm-mk{transition:none}}</style>
