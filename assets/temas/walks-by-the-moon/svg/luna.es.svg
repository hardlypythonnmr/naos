<svg class="cl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 466" width="420" height="466" role="img" aria-labelledby="cl-t-es cl-d-es" lang="es">
<title id="cl-t-es">Gráfica de puntos de cuatro noches de caminata. Jueves 22 de octubre, unos 88 % iluminada: la luna sale a las 16:13 en Nueva York y a las 15:08 en Medellín. Domingo 13 de diciembre, unos 21 %: se pone a las 20:43 y a las 21:42. Martes 15 de diciembre, unos 38 %: se pone a las 22:47 y a las 23:11. Jueves 17 de diciembre, unos 58 %: sale a las 11:59 y a las 12:16.</title>
<desc id="cl-d-es">Cuatro filas, una por noche, cada una con una luna pequeña dibujada con su parte iluminada y dos puntos sobre un eje de reloj de 11:00 a 24:00: un punto lleno para Nueva York y un anillo para Medellín, cada uno con la hora a la que la luna sale o se pone. Una línea de puntos marca las 10 p. m. El 13 de diciembre los dos puntos quedan a la izquierda de la línea: antes de las diez la luna ya se puso en las dos ciudades.</desc>
<style>svg.cl{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.cl[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.cl text{fill:var(--ink)}svg.cl .cl-g{fill:var(--grey)}svg.cl .cl-s{font-size:16px}svg.cl .cl-b{font-weight:600}svg.cl .cl-v{font-variant-numeric:tabular-nums}svg.cl .cl-ln{stroke:var(--rule);stroke-width:1;fill:none}svg.cl .cl-tk{stroke:var(--chart);stroke-width:1.2;fill:none}svg.cl .cl-ref{stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-dasharray:.01 6;fill:none}svg.cl .cl-ny{fill:var(--ink)}svg.cl .cl-me{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}svg.cl .cl-sh{fill:var(--paper);stroke:var(--chart);stroke-width:1.6}svg.cl .cl-lit{fill:var(--ink)}svg.cl .cl-h{paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}</style>
