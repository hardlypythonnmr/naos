<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 904" width="350" height="904" role="img" lang="en" xml:lang="en" aria-labelledby="q-en-estrecho-t" aria-describedby="q-en-estrecho-d" style="max-width:100%;height:auto">
<title id="q-en-estrecho-t">One evening</title>
<desc id="q-en-estrecho-d">A thread with four stops: sound rings coming from one person, an extra place set across from the first, a line joining two people with a pulse running along it, and the same line drawn dashed for next week.</desc>
<style>
.svq-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)} .svq-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-grey,#59616D);font-size:14px} .svq-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-sec,#454C57);font-size:14px}
.svq-num{font-family:var(--font-serif,"Newsreader",Georgia,serif);font-size:28px;font-weight:300;fill:var(--naos-ink,#0E1116)}
.svq-hilo{stroke:var(--naos-ink,#0E1116);stroke-width:2;fill:none}
.svq-tallo{stroke:var(--naos-chart,#737B87);stroke-width:1.5} .svq-nodo{fill:var(--naos-ink,#0E1116)}
.svq-yo{fill:var(--naos-ink,#0E1116)} .svq-otro{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2}
.svq-arc{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;stroke-linecap:round} .svq-a2{opacity:.75} .svq-a3{opacity:.5}
.svq-plato{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2} .svq-taza{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-chart,#737B87);stroke-width:2} .svq-silla{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-chart,#737B87);stroke-width:2}
.svq-lin{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2} .svq-lin2{stroke-dasharray:6 6}
.svq-pul{fill:var(--naos-ink,#0E1116);opacity:0}
.svq-s4 .svq-otro{stroke:var(--naos-chart,#737B87)}
</style>
<g transform="translate(175 66)"><g class="svq-s1"><circle class="svq-yo" cx="-24" cy="0" r="7"/><path class="svq-arc svq-a1" d="M-9.1,-13.4 A20,20 0 0 1 -9.1,13.4"/><path class="svq-arc svq-a2" d="M1.3,-22.8 A34,34 0 0 1 1.3,22.8"/><path class="svq-arc svq-a3" d="M11.7,-32.1 A48,48 0 0 1 11.7,32.1"/></g></g>
<text class="svq-num" x="12" y="132">1</text>
<text class="svq-t" x="44" y="132" text-anchor="start" font-size="18">Say one name out loud.</text>
<text class="svq-s" x="44" y="154" text-anchor="start">Tradition: naming the dead, in Jewish</text><text class="svq-s" x="44" y="172" text-anchor="start">prayer and in some churches. [15] [8]</text><text class="svq-s" x="44" y="190" text-anchor="start">[4]</text>
<g transform="translate(175 284)"><g class="svq-s2"><g class="svq-pA"><circle class="svq-plato" cx="-44" cy="0" r="18"/><circle class="svq-taza" cx="-18" cy="-8" r="6"/><rect class="svq-silla" x="-60" y="27" width="32" height="8" rx="4"/></g><g class="svq-pB"><circle class="svq-plato" cx="44" cy="0" r="18"/><circle class="svq-taza" cx="18" cy="-8" r="6"/><rect class="svq-silla" x="28" y="27" width="32" height="8" rx="4"/></g></g></g>
<text class="svq-num" x="12" y="350">2</text>
<text class="svq-t" x="44" y="350" text-anchor="start" font-size="18">Set one more place.</text>
<text class="svq-s" x="44" y="372" text-anchor="start">Our experiment: we found no sourced</text><text class="svq-s" x="44" y="390" text-anchor="start">custom.</text>
<g transform="translate(175 484)"><g class="svq-s3"><path class="svq-lin" d="M-41,0 H41" pathLength="100"/><circle class="svq-yo" cx="-50" cy="0" r="7"/><circle class="svq-otro" cx="50" cy="0" r="8"/><circle class="svq-pul svq-p1" cx="-41" cy="0" r="3.5"/><circle class="svq-pul svq-p2" cx="41" cy="0" r="3.5"/></g></g>
<text class="svq-num" x="12" y="550">3</text>
<text class="svq-t" x="44" y="550" text-anchor="start" font-size="18">Call someone older who&#x27;s</text><text class="svq-t" x="44" y="572" text-anchor="start" font-size="18">still here.</text>
<text class="svq-s" x="44" y="594" text-anchor="start">Study: a program of friendly calls, not</text><text class="svq-s" x="44" y="612" text-anchor="start">a family call. [23] [24]</text>
<g transform="translate(175 706)"><g class="svq-s4"><path class="svq-lin svq-lin2" d="M-41,0 H41" pathLength="100"/><circle class="svq-otro" cx="-50" cy="0" r="8"/><circle class="svq-otro" cx="50" cy="0" r="8"/></g></g>
<text class="svq-num" x="12" y="772">4</text>
<text class="svq-t" x="44" y="772" text-anchor="start" font-size="18">Next week, call the same</text><text class="svq-t" x="44" y="794" text-anchor="start" font-size="18">person again.</text>
<text class="svq-s" x="44" y="816" text-anchor="start">Our experiment.</text>
<text class="svq-f" x="12" y="864" text-anchor="start">Sunday 1 or Monday 2 November, or any night.</text><text class="svq-f" x="12" y="882" text-anchor="start">Ten minutes.</text>
</svg>
