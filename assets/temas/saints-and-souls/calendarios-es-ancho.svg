<text class="sg-h" x="596.6" y="358" text-anchor="end">24 oct, calendario nuevo</text>
<circle class="sg-dia" cx="668.2" cy="354" r="5.5"/>
<text class="sg-h" x="680.3" y="358" text-anchor="start">7 nov, calendario antiguo</text>
<line class="sg-base" x1="250" y1="440" x2="700" y2="440"/>
<text class="sg-nom" x="16" y="420">Calendario judío</text>
<text class="sg-f" x="16" y="438" text-anchor="start">el yahrzeit</text>
<text class="sg-sf" x="258" y="432">Sin fecha aquí: cada persona tiene su propio día</text>
