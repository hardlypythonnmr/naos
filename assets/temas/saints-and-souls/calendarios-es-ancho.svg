<rect class="sg-inc" x="480.5" y="520.8" width="10.0" height="10.4" rx="2"/><rect class="sg-rango" x="492.0" y="520" width="59.4" height="12" rx="3"/>
<text class="sg-h" x="561.4" y="530" text-anchor="start">26 o 27 sep al 10 oct</text>
<line class="sg-base" x1="250" y1="612" x2="700" y2="612"/>
<text class="sg-nom" x="16" y="592">Calendario chino</text>
<text class="sg-f" x="16" y="610" text-anchor="start">como lo guarda Hong Kong:</text><text class="sg-f" x="16" y="627" text-anchor="start">días de los antepasados</text>
<text class="sg-s" x="16" y="644">Antes: 5 abr, Ching Ming</text>
