<rect class="sg-rango" x="300.9" y="606" width="123.1" height="12" rx="3"/>
<text class="sg-h" x="434.1" y="616" text-anchor="start">13 ago al 10 sep, Yu Lan</text>
<text class="sg-f" x="642.7" y="670" text-anchor="middle">Esta página: 27 oct al 6 nov</text>
<circle class="sg-dia" cx="23" cy="700" r="5.5"/><text class="sg-s" x="36" y="704">un día</text><rect class="sg-rango" x="206" y="694" width="22" height="12" rx="3"/><text class="sg-s" x="236" y="704">varios días</text><rect class="sg-inc" x="400" y="694.8" width="12" height="10.4" rx="2"/><text class="sg-s" x="420" y="704">inicio incierto</text>
<text class="sg-f" x="16" y="738" text-anchor="start">Fuentes [1] [2] [5] [12] [13] [14] [15] [16] [18] [19] [20] [21] [22], leídas el 16 de octubre de 2026. Cada fila guiada por un</text><text class="sg-f" x="16" y="756" text-anchor="start">calendario oficial o por la guía de su propia tradición.</text>
