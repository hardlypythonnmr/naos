<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" role="img" lang="es" xml:lang="es" aria-labelledby="sg-es-ancho-t" aria-describedby="sg-es-ancho-d" style="max-width:100%;height:auto">
<title id="sg-es-ancho-t">Solo las iglesias de Occidente guardan a sus muertos el 1 y el 2 de noviembre</title>
<desc id="sg-es-ancho-d">Gráfica con una fila por calendario, de agosto a noviembre de 2026: las iglesias de Occidente, Colombia y Filipinas el 1 y el 2 de noviembre; el sábado ortodoxo de San Demetrio el 24 de octubre o el 7 de noviembre; el Pitru Paksha terminando el 10 de octubre; el Yu Lan, días de los antepasados del calendario chino, del 13 de agosto al 10 de septiembre en la comunidad Chiu Chow de Hong Kong; y el calendario judío, con un día para cada persona. Cada fila es un calendario y sus días para los muertos o los antepasados en 2026, de agosto a noviembre. Las iglesias de Occidente, Colombia y Filipinas se juntan el 1 y el 2 de noviembre. Los ortodoxos de tradición rusa guardan el sábado de San Demetrio el 24 de octubre o el 7 de noviembre, según el calendario. La quincena hindú de Pitru Paksha terminó el 10 de octubre; empezó el 26 o el 27 de septiembre, según se cuente o no el día de luna llena. El calendario chino, como lo guarda Hong Kong, tiene días de los antepasados: en la comunidad Chiu Chow de Hong Kong, el Yu Lan dura todo el séptimo mes lunar, del 13 de agosto al 10 de septiembre. El calendario judío no lleva marca: cada persona tiene su propio día. La franja son los días de esta página, del 27 de octubre al 6 de noviembre. Dos fechas anteriores quedan fuera, a la izquierda: el Ching Ming, el 5 de abril, y Todos los Santos de los ortodoxos, el 7 de junio.</desc>
<style>
