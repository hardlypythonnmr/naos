<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 355" width="1040" height="355" role="img" lang="es" xml:lang="es" aria-labelledby="sm-es-ancho-t" aria-describedby="sm-es-ancho-d" style="max-width:100%;height:auto">
<title id="sm-es-ancho-t">Nueve piezas, del 27 oct al 6 nov</title>
<desc id="sm-es-ancho-d">Las dos primeras piezas son sobre los vivos, las cinco siguientes sobre los muertos, después una sobre los dos y la última otra vez sobre los muertos. El cuarto menguante cae el domingo 1 de noviembre. La pieza de la que vienes lleva un aro. La luna mengua, de casi llena el 27 de octubre a un hilo el 6 de noviembre. 1, mar 27 · en inglés: Call someone older tonight (sobre los vivos). 2, jue 29 · en inglés: Call again next week (sobre los vivos). 3, sáb 31, noche · en inglés: The dead in three calendars (sobre los muertos). 4, dom 1, mediodía · en español: Los muertos en tres calendarios (sobre los muertos). 5, dom 1, 19:00 · en inglés: Saints and Souls (sobre los muertos). 6, dom 1, 20:00 · en inglés: Say one name out loud (sobre los muertos). 7, lun 2 · en inglés: The day after the saints (sobre los muertos). 8, mié 4 · en inglés: Set a place for the one you miss (sobre los dos). 9, vie 6 · en inglés: Three Masses in one day (sobre los muertos). Cuarto menguante: domingo 1 de noviembre, 15:28 en Medellín y en Nueva York.</desc>
