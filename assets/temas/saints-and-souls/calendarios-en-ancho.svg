<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" role="img" lang="en" xml:lang="en" aria-labelledby="sg-en-ancho-t" aria-describedby="sg-en-ancho-d" style="max-width:100%;height:auto">
<title id="sg-en-ancho-t">Only the Western churches keep their dead on 1 and 2 November</title>
<desc id="sg-en-ancho-d">Chart with one row per calendar, August to November 2026: the Western churches, Colombia and the Philippines on 1 and 2 November; Orthodox Demetrius Saturday on 24 October or 7 November; Pitru Paksha ending 10 October; Yu Lan, days for the ancestors in the Chinese calendar, 13 August to 10 September in Hong Kong&#x27;s Chiu Chow community; the Jewish calendar with a day for each person. Each row is one calendar and its days for the dead or the ancestors in 2026, from August to November. The Western churches, Colombia and the Philippines gather on 1 and 2 November. Orthodox churches in the Russian tradition keep Demetrius Saturday on 24 October or 7 November, depending on the calendar. The Hindu fortnight of Pitru Paksha ended on 10 October; it began on 26 or 27 September, depending on whether the full-moon day counts. The Chinese calendar, as Hong Kong keeps it, has days for the ancestors: in Hong Kong&#x27;s Chiu Chow community, Yu Lan runs through the seventh lunar month, 13 August to 10 September. The Jewish calendar has no mark: each person has a day of their own. The band is the days of this page, 27 October to 6 November. Two earlier days sit off the left edge: Ching Ming on 5 April and, for the Orthodox, All Saints on 7 June.</desc>
<style>
.sg-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)}
.sg-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-grey,#59616D);font-size:14px}
.sg-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-sec,#454C57);font-size:14px}
.sg-h{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-ink,#0E1116);font-size:14px;font-variant-numeric:tabular-nums}
.sg-nom{font-family:var(--font-serif,"Newsreader",Georgia,serif);font-size:18px;fill:var(--naos-ink,#0E1116)}
.sg-mes{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:14px;fill:var(--naos-grey,#59616D)}
.sg-base{stroke:var(--naos-rule,#D7DBE0);stroke-width:1}
.sg-grid{stroke:var(--naos-chart,#737B87);stroke-width:1}
.sg-mesl{stroke:var(--naos-rule,#D7DBE0);stroke-width:1}
.sg-banda{fill:var(--naos-rule,#D7DBE0);opacity:.55}
.sg-dia{fill:var(--naos-ink,#0E1116)} .sg-rango{fill:var(--naos-ink,#0E1116)}
.sg-inc{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:1.6}
.sg-fuera{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:1.6}
.sg-sf{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:14px;fill:var(--naos-sec,#454C57)}
</style>
<rect class="sg-banda" x="619.3" y="66" width="46.7" height="586"/>
<line class="sg-mesl" x1="250.0" y1="62" x2="250.0" y2="652"/><line class="sg-grid" x1="250.0" y1="56" x2="250.0" y2="66"/><text class="sg-mes" x="256.0" y="52">Aug</text>
<line class="sg-mesl" x1="381.6" y1="62" x2="381.6" y2="652"/><line class="sg-grid" x1="381.6" y1="56" x2="381.6" y2="66"/><text class="sg-mes" x="387.6" y="52">Sep</text>
<line class="sg-mesl" x1="509.0" y1="62" x2="509.0" y2="652"/><line class="sg-grid" x1="509.0" y1="56" x2="509.0" y2="66"/><text class="sg-mes" x="515.0" y="52">Oct</text>
<line class="sg-mesl" x1="640.6" y1="62" x2="640.6" y2="652"/><line class="sg-grid" x1="640.6" y1="56" x2="640.6" y2="66"/><text class="sg-mes" x="646.6" y="52">Nov</text>
<line class="sg-base" x1="250" y1="96" x2="700" y2="96"/>
<text class="sg-nom" x="16" y="76">Western churches</text>
<text class="sg-f" x="16" y="94" text-anchor="start">Catholic, Anglican, many</text><text class="sg-f" x="16" y="111" text-anchor="start">Lutheran</text>
<rect class="sg-rango" x="640.6" y="90" width="10.0" height="12" rx="3"/>
<text class="sg-h" x="660.6" y="92" text-anchor="start">1 Nov All Saints · 2 Nov All</text><text class="sg-h" x="660.6" y="108" text-anchor="start">Souls</text>
<line class="sg-base" x1="250" y1="182" x2="700" y2="182"/>
<text class="sg-nom" x="16" y="162">Colombia</text>
<text class="sg-f" x="16" y="180" text-anchor="start">holiday</text>
<circle class="sg-dia" cx="646.9" cy="182" r="5.5"/>
<text class="sg-h" x="659.1" y="178" text-anchor="start">Mon 2 Nov, All Saints moved</text><text class="sg-h" x="659.1" y="194" text-anchor="start">to Monday</text>
<line class="sg-base" x1="250" y1="268" x2="700" y2="268"/>
<text class="sg-nom" x="16" y="248">Philippines</text>
<text class="sg-f" x="16" y="266" text-anchor="start">Undas, special non-working</text><text class="sg-f" x="16" y="283" text-anchor="start">days</text>
<rect class="sg-rango" x="640.6" y="262" width="10.0" height="12" rx="3"/>
<text class="sg-h" x="660.6" y="272" text-anchor="start">1 and 2 Nov</text>
<line class="sg-base" x1="250" y1="354" x2="700" y2="354"/>
<text class="sg-nom" x="16" y="334">Orthodox churches</text>
<text class="sg-f" x="16" y="352" text-anchor="start">Demetrius Saturday, Russian</text><text class="sg-f" x="16" y="369" text-anchor="start">tradition</text>
<text class="sg-s" x="16" y="386">Earlier: 7 Jun, All Saints</text>
<path class="sg-fuera" d="M259,348 L251,354 L259,360 Z"/>
<circle class="sg-dia" cx="608.7" cy="354" r="5.5"/>
<text class="sg-h" x="596.6" y="358" text-anchor="end">24 Oct, new calendar</text>
<circle class="sg-dia" cx="668.2" cy="354" r="5.5"/>
<text class="sg-h" x="680.3" y="358" text-anchor="start">7 Nov, old calendar</text>
<line class="sg-base" x1="250" y1="440" x2="700" y2="440"/>
<text class="sg-nom" x="16" y="420">Jewish calendar</text>
<text class="sg-f" x="16" y="438" text-anchor="start">yahrzeit</text>
<text class="sg-sf" x="258" y="432">No date here: each person has a day of their own</text>
<line class="sg-base" x1="250" y1="526" x2="700" y2="526"/>
<text class="sg-nom" x="16" y="506">Hindu calendar</text>
<text class="sg-f" x="16" y="524" text-anchor="start">Pitru Paksha, in India</text>
<rect class="sg-inc" x="480.5" y="520.8" width="10.0" height="10.4" rx="2"/><rect class="sg-rango" x="492.0" y="520" width="59.4" height="12" rx="3"/>
<text class="sg-h" x="561.4" y="530" text-anchor="start">26 or 27 Sep to 10 Oct</text>
<line class="sg-base" x1="250" y1="612" x2="700" y2="612"/>
<text class="sg-nom" x="16" y="592">Chinese calendar</text>
<text class="sg-f" x="16" y="610" text-anchor="start">as Hong Kong keeps it: days</text><text class="sg-f" x="16" y="627" text-anchor="start">for the ancestors</text>
<text class="sg-s" x="16" y="644">Earlier: 5 Apr, Ching Ming</text>
<path class="sg-fuera" d="M259,606 L251,612 L259,618 Z"/>
<rect class="sg-rango" x="300.9" y="606" width="123.1" height="12" rx="3"/>
<text class="sg-h" x="434.1" y="616" text-anchor="start">13 Aug to 10 Sep, Yu Lan</text>
<text class="sg-f" x="642.7" y="670" text-anchor="middle">This page: 27 Oct to 6 Nov</text>
<circle class="sg-dia" cx="23" cy="700" r="5.5"/><text class="sg-s" x="36" y="704">one day</text><rect class="sg-rango" x="206" y="694" width="22" height="12" rx="3"/><text class="sg-s" x="236" y="704">several days</text><rect class="sg-inc" x="400" y="694.8" width="12" height="10.4" rx="2"/><text class="sg-s" x="420" y="704">start uncertain</text>
<text class="sg-f" x="16" y="738" text-anchor="start">Sources [1] [2] [5] [12] [13] [14] [15] [16] [18] [19] [20] [21] [22], read 16 October 2026. Each row led by an official calendar</text><text class="sg-f" x="16" y="756" text-anchor="start">or the tradition&#x27;s own guide.</text>
</svg>
