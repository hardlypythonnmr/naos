<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 520" width="350" height="520" role="img" lang="en" xml:lang="en" aria-labelledby="sm-en-estrecho-t" aria-describedby="sm-en-estrecho-d" style="max-width:100%;height:auto">
<title id="sm-en-estrecho-t">Nine pieces, 27 Oct to 6 Nov</title>
<desc id="sm-en-estrecho-d">The first two pieces are about the living, the next five about the dead, then one about both, and the last about the dead again. Last quarter falls on Sunday 1 November. The piece you came from has a ring. The moon wanes from nearly full on 27 October to a thin crescent on 6 November. 1, Tue 27: Call someone older tonight (about the living). 2, Thu 29: Call again next week (about the living). 3, Sat 31, morning: Three calendars of remembering (about the dead). 4, Sat 31, night: The dead in three calendars (about the dead). 5, Sun 1, evening: Saints and Souls (about the dead). 6, Sun 1, night: Say one name out loud (about the dead). 7, Mon 2: The day after the saints (about the dead). 8, Wed 4: Set a place for the one you miss (about both). 9, Fri 6: Three Masses in one day (about the dead). Last quarter: Sunday 1 November, 15:28 in Medellín and New York.</desc>
