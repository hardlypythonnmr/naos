<p class="sv-intro">El domingo 1 o el lunes 2 de noviembre, o cualquier noche. Diez minutos.</p>
<div class="sv-ctl" hidden></div>
<ol class="sv-pasos">

<li class="sv-paso" data-paso="2" data-src="1104h"><div class="sv-escena"><svg viewBox="0 0 240 170" class="sv-svg" aria-hidden="true" focusable="false"><path class="sv-hilo" d="M0,150 H240" pathLength="100"/><g class="sv-est" data-k="2"><line class="sv-tallo" x1="120" y1="112" x2="120" y2="150"/><circle class="sv-nodo" cx="120" cy="150" r="5"/><g transform="translate(120 66)"><g class="sv-s2"><g class="sv-pA"><circle class="sv-plato" cx="-44" cy="0" r="18"/><circle class="sv-taza" cx="-18" cy="-8" r="6"/><rect class="sv-silla" x="-60" y="27" width="32" height="8" rx="4"/></g><g class="sv-pB"><circle class="sv-plato" cx="44" cy="0" r="18"/><circle class="sv-taza" cx="18" cy="-8" r="6"/><rect class="sv-silla" x="28" y="27" width="32" height="8" rx="4"/></g></g></g></g></svg></div><div class="sv-txt"><p class="sv-num" aria-hidden="true">2</p><div><h3 class="sv-h3"><span class="sv-sr">Paso 2: </span>Pon un lugar más en la mesa.</h3><p class="sv-p">Un plato, una taza, una silla. Déjalo ahí mientras comes.</p><p class="sv-etq">Nuestro experimento: sin costumbre con fuente.</p><p class="sv-origen" hidden>De la pieza de la que vienes</p></div></div></li>
<li class="sv-paso" data-paso="3" data-src="1027h"><div class="sv-escena"><svg viewBox="0 0 240 170" class="sv-svg" aria-hidden="true" focusable="false"><path class="sv-hilo" d="M0,150 H240" pathLength="100"/><g class="sv-est" data-k="3"><line class="sv-tallo" x1="120" y1="112" x2="120" y2="150"/><circle class="sv-nodo" cx="120" cy="150" r="5"/><g transform="translate(120 66)"><g class="sv-s3"><path class="sv-lin" d="M-41,0 H41" pathLength="100"/><circle class="sv-yo" cx="-50" cy="0" r="7"/><circle class="sv-otro" cx="50" cy="0" r="8"/><circle class="sv-pul sv-p1" cx="-41" cy="0" r="3.5"/><circle class="sv-pul sv-p2" cx="41" cy="0" r="3.5"/></g></g></g></svg></div><div class="sv-txt"><p class="sv-num" aria-hidden="true">3</p><div><h3 class="sv-h3"><span class="sv-sr">Paso 3: </span>Llama a alguien mayor que siga aquí.</h3><p class="sv-p">Dile qué nombre dijiste, o pregúntale cómo está.</p><p class="sv-etq">Estudio: llamadas de un programa, no de familia. [23] [24]</p><p class="sv-origen" hidden>De la pieza de la que vienes</p></div></div></li>
<li class="sv-paso" data-paso="4" data-src="1029h"><div class="sv-escena"><svg viewBox="0 0 240 170" class="sv-svg" aria-hidden="true" focusable="false"><path class="sv-hilo" d="M0,150 H240" pathLength="100"/><g class="sv-est" data-k="4"><line class="sv-tallo" x1="120" y1="112" x2="120" y2="150"/><circle class="sv-nodo" cx="120" cy="150" r="5"/><g transform="translate(120 66)"><g class="sv-s4"><path class="sv-lin sv-lin2" d="M-41,0 H41" pathLength="100"/><circle class="sv-otro" cx="-50" cy="0" r="8"/><circle class="sv-otro" cx="50" cy="0" r="8"/></g></g></g></svg></div><div class="sv-txt"><p class="sv-num" aria-hidden="true">4</p><div><h3 class="sv-h3"><span class="sv-sr">Paso 4: </span>La semana que viene, llama otra vez a esa persona.</h3><p class="sv-etq">Nuestro experimento.</p><p class="sv-origen" hidden>De la pieza de la que vienes</p></div></div></li>
</ol>
<p class="sv-despues">Eso es todo. En una línea: di un nombre y después llama a alguien que siga aquí.</p>
