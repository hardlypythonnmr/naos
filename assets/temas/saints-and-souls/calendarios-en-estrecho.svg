<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 1234" width="350" height="1234" role="img" lang="en" xml:lang="en" aria-labelledby="sg-en-estrecho-t" aria-describedby="sg-en-estrecho-d" style="max-width:100%;height:auto">
<title id="sg-en-estrecho-t">Only the Western churches keep their dead on 1 and 2 November</title>
<desc id="sg-en-estrecho-d">Chart with one row per calendar, August to November 2026: the Western churches, Colombia and the Philippines on 1 and 2 November; Orthodox Demetrius Saturday on 24 October or 7 November; Pitru Paksha ending 10 October; Yu Lan, days for the ancestors in the Chinese calendar, 13 August to 10 September in Hong Kong&#x27;s Chiu Chow community; the Jewish calendar with a day for each person. Each row is one calendar and its days for the dead or the ancestors in 2026, from August to November. The Western churches, Colombia and the Philippines gather on 1 and 2 November. Orthodox churches in the Russian tradition keep Demetrius Saturday on 24 October or 7 November, depending on the calendar. The Hindu fortnight of Pitru Paksha ended on 10 October; it began on 26 or 27 September, depending on whether the full-moon day counts. The Chinese calendar, as Hong Kong keeps it, has days for the ancestors: in Hong Kong&#x27;s Chiu Chow community, Yu Lan runs through the seventh lunar month, 13 August to 10 September. The Jewish calendar has no mark: each person has a day of their own. The band is the days of this page, 27 October to 6 November. Two earlier days sit off the left edge: Ching Ming on 5 April and, for the Orthodox, All Saints on 7 June.</desc>
