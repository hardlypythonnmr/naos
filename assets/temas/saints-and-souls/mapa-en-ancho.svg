.sm-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.sm-lunad{fill:var(--naos-chart,#737B87)} .sm-lunal{fill:var(--naos-paper,#FFFFFF)} .sm-lunac{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:1.5}
