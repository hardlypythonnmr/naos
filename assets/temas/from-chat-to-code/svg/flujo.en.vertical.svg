<svg class="fl fl-vert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1424" width="360" height="1424" role="img" aria-labelledby="fl-en-v-t" aria-describedby="fl-en-v-d" lang="en">
<title id="fl-en-v-t">Flow in five steps across three places: a chat that starts almost empty, a handover, a private folder, a notes file under 200 lines, and a first real task on its own branch.</title>
<desc id="fl-en-v-d">A path with five steps in three places. In the chat: 1, it starts almost empty; 2, a handover that you keep outside the chat. In the folder: 3, a private folder that keeps every saved step; 4, a notes file, with two numbers: under 200 lines is the size Anthropic suggests, and a study of code repositories found over 20 percent more cost on average. In the code: 5, your first real task, with one number: in a study of 47 people, those with an AI assistant wrote less secure code. A dotted rule marks the older evidence, an assistant from 2022.</desc>
<style>svg.fl{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);--idx:var(--lab-accent,#2438C7);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.fl[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116);--idx:var(--lab-night-accent,#8C9BFF)}svg.fl text{fill:var(--ink)}svg.fl .fl-z{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:22px;font-weight:400}svg.fl .fl-t{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:18px;font-weight:400}svg.fl .fl-b{fill:var(--sec);font-size:15px}svg.fl .fl-m{fill:var(--grey);font-size:15px}svg.fl .fl-v{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}svg.fl .fl-q{fill:var(--sec);font-size:15px}svg.fl .fl-o{fill:var(--grey);font-size:15px}svg.fl .fl-n{fill:var(--idx);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}svg.fl .fl-zr{stroke:var(--ink);stroke-width:1.5}svg.fl .fl-rail{stroke:var(--chart);stroke-width:2;fill:none}svg.fl .fl-c{fill:var(--paper);stroke:var(--ink);stroke-width:2}svg.fl .fl-s{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}svg.fl .fl-s.fl-viejo{stroke:var(--chart);stroke-dasharray:1 5}</style>
<path class="fl-rail" d="M24 78V199"/><path class="fl-rail" d="M24 223V390"/><path class="fl-rail" d="M24 414V535"/><path class="fl-rail" d="M24 559V1053"/>
<line class="fl-zr" x1="12" y1="8" x2="348" y2="8"/>
<text class="fl-z" x="52" y="36" data-r="348">Chat</text>
<circle class="fl-c" cx="24" cy="66" r="12"/><text class="fl-n" x="24" y="71" text-anchor="middle">1</text>
<text class="fl-t" x="52" y="72" data-r="348">It starts almost empty</text>
<text class="fl-b" x="52" y="96" data-r="348">Each new chat starts almost empty.</text><text class="fl-b" x="52" y="117" data-r="348">Where memory is on, it carries a few</text><text class="fl-b" x="52" y="138" data-r="348">saved topics.</text>
<text class="fl-m" x="52" y="161" data-r="348">Official docs [1] [2]</text>
<circle class="fl-c" cx="24" cy="211" r="12"/><text class="fl-n" x="24" y="216" text-anchor="middle">2</text>
<text class="fl-t" x="52" y="217" data-r="348">A handover</text>
<text class="fl-b" x="52" y="241" data-r="348">You ask for the goal, the decisions</text><text class="fl-b" x="52" y="262" data-r="348">and the open questions, and keep them</text><text class="fl-b" x="52" y="283" data-r="348">outside the chat.</text>
<text class="fl-m" x="52" y="306" data-r="348">Our method [3] [11] [12]</text>
<line class="fl-zr" x1="12" y1="344" x2="348" y2="344"/>
<text class="fl-z" x="52" y="372" data-r="348">Folder</text>
<circle class="fl-c" cx="24" cy="402" r="12"/><text class="fl-n" x="24" y="407" text-anchor="middle">3</text>
<text class="fl-t" x="52" y="408" data-r="348">A private folder</text>
<text class="fl-b" x="52" y="432" data-r="348">A private repository keeps every</text><text class="fl-b" x="52" y="453" data-r="348">saved step, and you can go back to</text><text class="fl-b" x="52" y="474" data-r="348">any of them.</text>
<text class="fl-m" x="52" y="497" data-r="348">Official docs [7] [8]</text>
<circle class="fl-c" cx="24" cy="547" r="12"/><text class="fl-n" x="24" y="552" text-anchor="middle">4</text>
<text class="fl-t" x="52" y="553" data-r="348">A notes file</text>
<text class="fl-b" x="52" y="577" data-r="348">Claude Code reads it at the start of</text><text class="fl-b" x="52" y="598" data-r="348">every session. Short notes work best.</text>
<text class="fl-m" x="52" y="621" data-r="348">Official docs · Study [5] [24]</text>
<line class="fl-s" x1="52" y1="651" x2="88" y2="651"/><text class="fl-v" x="52" y="679" data-r="348">Under 200 lines</text><text class="fl-q" x="52" y="700" data-r="348">The size Anthropic suggests for a</text><text class="fl-q" x="52" y="720" data-r="348">notes file.</text><text class="fl-o" x="52" y="743" data-r="348">Claude Code docs, read 16 Oct</text><text class="fl-o" x="52" y="763" data-r="348">2026 [5]</text>
<line class="fl-s" x1="52" y1="805" x2="88" y2="805"/><text class="fl-v" x="52" y="833" data-r="348">Over 20%</text><text class="fl-q" x="52" y="854" data-r="348">more cost on average with context</text><text class="fl-q" x="52" y="874" data-r="348">files, in a study of code</text><text class="fl-q" x="52" y="894" data-r="348">repositories. No general gain in task</text><text class="fl-q" x="52" y="914" data-r="348">success.</text><text class="fl-o" x="52" y="937" data-r="348">Gloaguen and others, v3, 29 Sep</text><text class="fl-o" x="52" y="957" data-r="348">2026 [24]</text>
<line class="fl-zr" x1="12" y1="1007" x2="348" y2="1007"/>
<text class="fl-z" x="52" y="1035" data-r="348">Code</text>
<circle class="fl-c" cx="24" cy="1065" r="12"/><text class="fl-n" x="24" y="1070" text-anchor="middle">5</text>
<text class="fl-t" x="52" y="1071" data-r="348">Your first real task</text>
<text class="fl-b" x="52" y="1095" data-r="348">You ask the AI to work on its own</text><text class="fl-b" x="52" y="1116" data-r="348">branch, list every file it changed</text><text class="fl-b" x="52" y="1137" data-r="348">and wait for your OK.</text>
<text class="fl-m" x="52" y="1160" data-r="348">Our method · Study [9] [13] [25]</text>
<line class="fl-s fl-viejo" x1="52" y1="1190" x2="88" y2="1190"/><text class="fl-v" x="52" y="1218" data-r="348">47 people</text><text class="fl-q" x="52" y="1239" data-r="348">In a study of five security tasks,</text><text class="fl-q" x="52" y="1259" data-r="348">those who used an AI assistant wrote</text><text class="fl-q" x="52" y="1279" data-r="348">less secure code and felt more sure</text><text class="fl-q" x="52" y="1299" data-r="348">it was fine. The assistant was from</text><text class="fl-q" x="52" y="1319" data-r="348">2022.</text><text class="fl-o" x="52" y="1342" data-r="348">Perry and others, 2023 [25]</text>
<line class="fl-s fl-viejo" x1="52" y1="1400" x2="88" y2="1400"/><text class="fl-m" x="100" y="1405" data-r="348">Dotted rule: older evidence</text>
</svg>
