<svg class="fl fl-vert" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1505" width="360" height="1505" role="img" aria-labelledby="fl-es-v-t" aria-describedby="fl-es-v-d" lang="es">
<title id="fl-es-v-t">Flujo de cinco pasos en tres lugares: un chat que arranca casi vacío, un resumen para retomar, una carpeta privada, un archivo de notas de menos de 200 líneas y una primera tarea de verdad en su propia rama.</title>
<desc id="fl-es-v-d">Un camino de cinco pasos en tres lugares. En el chat: 1, arranca casi vacío; 2, un resumen para retomar, que guardas fuera del chat. En la carpeta: 3, una carpeta privada que guarda cada paso; 4, un archivo de notas, con dos cifras: menos de 200 líneas es el tamaño que sugiere Anthropic, y un estudio de repositorios de código halló más de 20 por ciento de costo extra en promedio. En el código: 5, tu primera tarea de verdad, con una cifra: en un estudio de 47 personas, quienes usaron un asistente de IA escribieron código menos seguro. Una regla punteada marca la evidencia más vieja, un asistente de 2022.</desc>
<style>svg.fl{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);--idx:var(--lab-accent,#2438C7);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.fl[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116);--idx:var(--lab-night-accent,#8C9BFF)}svg.fl text{fill:var(--ink)}svg.fl .fl-z{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:22px;font-weight:400}svg.fl .fl-t{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:18px;font-weight:400}svg.fl .fl-b{fill:var(--sec);font-size:15px}svg.fl .fl-m{fill:var(--grey);font-size:15px}svg.fl .fl-v{font-family:var(--font-serif,'Newsreader',Georgia,serif);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}svg.fl .fl-q{fill:var(--sec);font-size:15px}svg.fl .fl-o{fill:var(--grey);font-size:15px}svg.fl .fl-n{fill:var(--idx);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}svg.fl .fl-zr{stroke:var(--ink);stroke-width:1.5}svg.fl .fl-rail{stroke:var(--chart);stroke-width:2;fill:none}svg.fl .fl-c{fill:var(--paper);stroke:var(--ink);stroke-width:2}svg.fl .fl-s{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}svg.fl .fl-s.fl-viejo{stroke:var(--chart);stroke-dasharray:1 5}</style>
<path class="fl-rail" d="M24 78V199"/><path class="fl-rail" d="M24 223V390"/><path class="fl-rail" d="M24 414V535"/><path class="fl-rail" d="M24 559V1094"/>
<line class="fl-zr" x1="12" y1="8" x2="348" y2="8"/>
<text class="fl-z" x="52" y="36" data-r="348">Chat</text>
<circle class="fl-c" cx="24" cy="66" r="12"/><text class="fl-n" x="24" y="71" text-anchor="middle">1</text>
<text class="fl-t" x="52" y="72" data-r="348">Arranca casi vacío</text>
<text class="fl-b" x="52" y="96" data-r="348">Cada chat nuevo empieza casi vacío.</text><text class="fl-b" x="52" y="117" data-r="348">Si la memoria está activada, trae</text><text class="fl-b" x="52" y="138" data-r="348">algunos temas guardados.</text>
<text class="fl-m" x="52" y="161" data-r="348">Documentación oficial [1] [2]</text>
<circle class="fl-c" cx="24" cy="211" r="12"/><text class="fl-n" x="24" y="216" text-anchor="middle">2</text>
<text class="fl-t" x="52" y="217" data-r="348">Un resumen para retomar</text>
<text class="fl-b" x="52" y="241" data-r="348">Pides la meta, las decisiones y las</text><text class="fl-b" x="52" y="262" data-r="348">preguntas abiertas, y las guardas</text><text class="fl-b" x="52" y="283" data-r="348">fuera del chat.</text>
<text class="fl-m" x="52" y="306" data-r="348">Nuestro método [3] [11] [12]</text>
<line class="fl-zr" x1="12" y1="344" x2="348" y2="344"/>
<text class="fl-z" x="52" y="372" data-r="348">Carpeta</text>
<circle class="fl-c" cx="24" cy="402" r="12"/><text class="fl-n" x="24" y="407" text-anchor="middle">3</text>
<text class="fl-t" x="52" y="408" data-r="348">Una carpeta privada</text>
<text class="fl-b" x="52" y="432" data-r="348">Un repositorio privado conserva cada</text><text class="fl-b" x="52" y="453" data-r="348">paso guardado, y puedes volver a</text><text class="fl-b" x="52" y="474" data-r="348">cualquiera de ellos.</text>
<text class="fl-m" x="52" y="497" data-r="348">Documentación oficial [7] [8]</text>
<circle class="fl-c" cx="24" cy="547" r="12"/><text class="fl-n" x="24" y="552" text-anchor="middle">4</text>
<text class="fl-t" x="52" y="553" data-r="348">Un archivo de notas</text>
<text class="fl-b" x="52" y="577" data-r="348">Claude Code lo lee al empezar cada</text><text class="fl-b" x="52" y="598" data-r="348">sesión. Las notas cortas funcionan</text><text class="fl-b" x="52" y="619" data-r="348">mejor.</text>
<text class="fl-m" x="52" y="642" data-r="348">Documentación oficial · Estudio [5]</text><text class="fl-m" x="52" y="662" data-r="348">[24]</text>
<line class="fl-s" x1="52" y1="692" x2="88" y2="692"/><text class="fl-v" x="52" y="720" data-r="348">Menos de 200</text><text class="fl-q" x="52" y="741" data-r="348">líneas: el tamaño que sugiere</text><text class="fl-q" x="52" y="761" data-r="348">Anthropic para un archivo de notas.</text><text class="fl-o" x="52" y="784" data-r="348">Doc. de Claude Code, leída el 16 oct</text><text class="fl-o" x="52" y="804" data-r="348">2026 [5]</text>
<line class="fl-s" x1="52" y1="846" x2="88" y2="846"/><text class="fl-v" x="52" y="874" data-r="348">Más de 20 %</text><text class="fl-q" x="52" y="895" data-r="348">de costo extra en promedio con</text><text class="fl-q" x="52" y="915" data-r="348">archivos de contexto, en un estudio</text><text class="fl-q" x="52" y="935" data-r="348">de repositorios de código. Sin mejora</text><text class="fl-q" x="52" y="955" data-r="348">general en el éxito de las tareas.</text><text class="fl-o" x="52" y="978" data-r="348">Gloaguen y otros, v3, 29 sep</text><text class="fl-o" x="52" y="998" data-r="348">2026 [24]</text>
<line class="fl-zr" x1="12" y1="1048" x2="348" y2="1048"/>
<text class="fl-z" x="52" y="1076" data-r="348">Código</text>
<circle class="fl-c" cx="24" cy="1106" r="12"/><text class="fl-n" x="24" y="1111" text-anchor="middle">5</text>
<text class="fl-t" x="52" y="1112" data-r="348">Tu primera tarea de verdad</text>
<text class="fl-b" x="52" y="1136" data-r="348">Le pides a la IA que trabaje en su</text><text class="fl-b" x="52" y="1157" data-r="348">propia rama, liste cada archivo que</text><text class="fl-b" x="52" y="1178" data-r="348">cambió y espere tu visto bueno.</text>
<text class="fl-m" x="52" y="1201" data-r="348">Nuestro método · Estudio [9] [13]</text><text class="fl-m" x="52" y="1221" data-r="348">[25]</text>
<line class="fl-s fl-viejo" x1="52" y1="1251" x2="88" y2="1251"/><text class="fl-v" x="52" y="1279" data-r="348">47 personas</text><text class="fl-q" x="52" y="1300" data-r="348">En un estudio de cinco tareas de</text><text class="fl-q" x="52" y="1320" data-r="348">seguridad, quienes usaron un</text><text class="fl-q" x="52" y="1340" data-r="348">asistente de IA escribieron código</text><text class="fl-q" x="52" y="1360" data-r="348">menos seguro y estaban más seguros de</text><text class="fl-q" x="52" y="1380" data-r="348">que su código era seguro. El</text><text class="fl-q" x="52" y="1400" data-r="348">asistente era de 2022.</text><text class="fl-o" x="52" y="1423" data-r="348">Perry y otros, 2023 [25]</text>
<line class="fl-s fl-viejo" x1="52" y1="1481" x2="88" y2="1481"/><text class="fl-m" x="100" y="1486" data-r="348">Regla punteada: evidencia más vieja</text>
</svg>
