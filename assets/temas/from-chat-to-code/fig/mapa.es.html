<h3 class="viz-t">De un chat a un proyecto que recuerda</h3>
<svg class="mp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" width="360" height="610" role="img" aria-labelledby="mp-es-t" aria-describedby="mp-es-d" lang="es">
<title id="mp-es-t">Mapa de esta página: siete piezas en una sola escalera, desde el video completo del 20 de octubre hasta las reglas de la casa y deshacer el 17 de noviembre.</title>
<desc id="mp-es-d">Siete peldaños bajan hacia la derecha como una escalera, en orden de fecha. Empiezan en un chat que se olvida y terminan en un proyecto que recuerda. Peldaño 1, martes 20 de octubre: las seis partes en un video. 2, miércoles 21 de octubre: por qué se olvida el chat. 3, viernes 23 de octubre: lo que necesitas. 4, domingo 25 de octubre: el primer prompt. 5, jueves 29 de octubre: un archivo de memoria. 6, sábado 7 de noviembre: tu primera tarea de verdad. 7, martes 17 de noviembre: reglas de la casa y deshacer. Un cuadrado marca el video y un punto marca cada Short y Reel.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> Cada peldaño es una pieza, en orden de fecha, desde un chat que se olvida hasta un proyecto con casa, notas, un lugar seguro para probar y una forma de volver atrás. La pieza de la que vienes se ilumina.</p>
<p class="viz-nota">Los peldaños van parejos. Siguen las fechas, pero no son una escala de tiempo. Las horas son de Nueva York (ET), en las piezas de abajo.</p>
