<figcaption><p class="viz-que"><strong>Qué muestra.</strong> El camino de un proyecto, desde un chat que arranca casi vacío hasta una primera tarea de verdad, en la que le pides a la IA trabajar en su propia rama y esperar tu visto bueno. Tres cifras están donde importan, cada una con su fuente y la fecha en que la leímos.</p>
<p class="viz-nota">El estudio de los archivos de notas cubre solo repositorios de código, y el de seguridad usó un asistente de 2022. Los leemos como razones para mirar antes de decir que sí. Los pasos marcados Nuestro método son nuestros. El 16 de octubre de 2026, Claude corrió los prompts una vez y guardamos el registro; todavía no los prueba alguien que nunca haya programado.</p>
