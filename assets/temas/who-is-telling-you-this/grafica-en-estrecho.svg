<line class="vg-grid" x1="76" x2="76" y1="382" y2="416"/>
<text class="vg-f" x="76" y="454" text-anchor="middle">5%</text>
<line class="vg-grid" x1="136" x2="136" y1="220" y2="254"/>
<line class="vg-grid" x1="136" x2="136" y1="322" y2="356"/>
<line class="vg-grid" x1="136" x2="136" y1="382" y2="416"/>
<text class="vg-f" x="136" y="454" text-anchor="middle">10%</text>
<line class="vg-grid" x1="196" x2="196" y1="220" y2="254"/>
<line class="vg-grid" x1="196" x2="196" y1="322" y2="356"/>
<line class="vg-grid" x1="196" x2="196" y1="382" y2="416"/>
<text class="vg-f" x="196" y="454" text-anchor="middle">15%</text>
<line class="vg-grid" x1="256" x2="256" y1="220" y2="254"/>
<line class="vg-grid" x1="256" x2="256" y1="322" y2="356"/>
<line class="vg-grid" x1="256" x2="256" y1="382" y2="416"/>
<text class="vg-f" x="256" y="454" text-anchor="middle">20%</text>
<text class="vg-t" font-size="22" x="16" y="34" text-anchor="start">Clicks on Google, with and</text><text class="vg-t" font-size="22" x="16" y="60" text-anchor="start">without an AI summary</text>
<text class="vg-f" x="16" y="84" text-anchor="start">Share of visits in which people</text><text class="vg-f" x="16" y="102" text-anchor="start">clicked. Pew Research Center, 22 July</text><text class="vg-f" x="16" y="120" text-anchor="start">2025: 900 US adults, 68,879 searches,</text><text class="vg-f" x="16" y="138" text-anchor="start">March 2025.</text>
<text class="vg-t" x="16" y="188" font-size="17">Pages without an AI summary</text>
<text class="vg-s" x="16" y="216">A regular result</text>
<text class="vg-t" x="16" y="290" font-size="17">Pages with an AI summary</text>
<text class="vg-s" x="16" y="318">A regular result</text>
<text class="vg-s" x="16" y="378">A link inside the summary</text>
<rect class="vg-barra" x="16" y="224" width="180" height="26"/>
<text class="vg-v" x="204" y="244">15%</text>
<rect class="vg-barra" x="16" y="326" width="96" height="26"/>
<text class="vg-v" x="120" y="346">8%</text>
<rect class="vg-barra" x="16" y="386" width="12" height="26"/>
<text class="vg-v" x="36" y="406">about 1%</text>
<line class="vg-base" x1="16" x2="16" y1="220" y2="254"/>
<line class="vg-base" x1="16" x2="16" y1="322" y2="356"/>
<line class="vg-base" x1="16" x2="16" y1="382" y2="416"/>
<text class="vg-f" x="136.0" y="474" text-anchor="middle">Share of visits</text>
<line class="vg-sep" x1="16" x2="344" y1="498" y2="498"/>
<text class="vg-t" x="16" y="524" font-size="17">Google disagrees</text>
<text class="vg-s" x="16" y="546" text-anchor="start">A Google spokesperson called Pew&#x27;s</text><text class="vg-s" x="16" y="565" text-anchor="start">method a &quot;flawed methodology&quot;.</text><text class="vg-s" x="16" y="584" text-anchor="start">Google&#x27;s own post says total organic</text><text class="vg-s" x="16" y="603" text-anchor="start">clicks from Google Search to websites</text><text class="vg-s" x="16" y="622" text-anchor="start">have been &quot;relatively stable</text><text class="vg-s" x="16" y="641" text-anchor="start">year-over-year&quot;. It gives no figures,</text><text class="vg-s" x="16" y="660" text-anchor="start">so there is nothing of Google&#x27;s to</text><text class="vg-s" x="16" y="679" text-anchor="start">plot.</text>
<text class="vg-f" x="16" y="718" text-anchor="start">Pew Research Center, 22 July 2025.</text><text class="vg-f" x="16" y="735" text-anchor="start">Google, 6 August 2025. MediaPost, 24</text><text class="vg-f" x="16" y="752" text-anchor="start">July 2025. Read 16 October 2026.</text>
</svg>
