<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 775" width="360" height="775" role="img" aria-labelledby="vg-en-estrecho-t vg-en-estrecho-d" style="max-width:100%;height:auto">
<title id="vg-en-estrecho-t">Clicks on Google, with and without an AI summary</title>
<desc id="vg-en-estrecho-d">When an AI summary appeared on a Google results page, people clicked a regular result in 8% of visits. Without one, in 15%. In about 1% of visits to pages with a summary, someone clicked a link inside it. This is Pew&#x27;s count of what 900 US adults did in March 2025. Google disputes the method and gives no figures of its own. It shows what people did in one period, in the US, on Google; it does not show why. Pew Research Center, 22 July 2025. Google, 6 August 2025. MediaPost, 24 July 2025. Read 16 October 2026.</desc>
<style>
.vg-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)}
.vg-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.vg-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:14px;fill:var(--naos-sec,#454C57)}
.vg-v{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:16px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vg-barra{fill:var(--naos-ink,#0E1116)}
.vg-grid{stroke:var(--naos-rule,#D7DBE0);stroke-width:1}
.vg-base{stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vg-sep{stroke:var(--naos-ink,#0E1116);stroke-width:1}
.vg-f{font-size:16px}
.vg-s{font-size:16px}
.vg-v{font-size:17px}
</style>
<line class="vg-grid" x1="16" x2="16" y1="220" y2="254"/>
<line class="vg-grid" x1="16" x2="16" y1="322" y2="356"/>
<line class="vg-grid" x1="16" x2="16" y1="382" y2="416"/>
<text class="vg-f" x="16" y="454" text-anchor="middle">0%</text>
<line class="vg-grid" x1="76" x2="76" y1="220" y2="254"/>
