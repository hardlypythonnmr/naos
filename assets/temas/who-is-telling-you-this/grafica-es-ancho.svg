<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 554" width="800" height="554" role="img" aria-labelledby="vg-es-ancho-t vg-es-ancho-d" style="max-width:100%;height:auto">
<title id="vg-es-ancho-t">Clics en Google, con y sin resumen de IA</title>
<desc id="vg-es-ancho-d">Cuando salía un resumen de IA en la página de resultados de Google, la gente hacía clic en un resultado normal en el 8 % de las visitas. Sin resumen, en el 15 %. En cerca del 1 % de las visitas a páginas con resumen, alguien hizo clic en un enlace dentro del resumen. Es el conteo de Pew sobre lo que hicieron 900 adultos de EE. UU. en marzo de 2025. Google discute el método y no da cifras propias. Muestra qué hizo la gente en un solo periodo, en EE. UU. y en Google; no explica por qué. Pew Research Center, 22 de julio de 2025. Google, 6 de agosto de 2025. MediaPost, 24 de julio de 2025. Leído el 16 de octubre de 2026.</desc>
<style>
.vg-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)}
.vg-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.vg-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:14px;fill:var(--naos-sec,#454C57)}
.vg-v{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:16px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vg-barra{fill:var(--naos-ink,#0E1116)}
.vg-grid{stroke:var(--naos-rule,#D7DBE0);stroke-width:1}
.vg-base{stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vg-sep{stroke:var(--naos-ink,#0E1116);stroke-width:1}
</style>
<line class="vg-grid" x1="272" x2="272" y1="110" y2="308"/>
<text class="vg-f" x="272" y="326" text-anchor="middle">0 %</text>
<line class="vg-grid" x1="392" x2="392" y1="110" y2="308"/>
<text class="vg-f" x="392" y="326" text-anchor="middle">5 %</text>
<line class="vg-grid" x1="512" x2="512" y1="110" y2="308"/>
<text class="vg-f" x="512" y="326" text-anchor="middle">10 %</text>
<line class="vg-grid" x1="632" x2="632" y1="110" y2="308"/>
<text class="vg-f" x="632" y="326" text-anchor="middle">15 %</text>
<line class="vg-grid" x1="752" x2="752" y1="110" y2="308"/>
<text class="vg-f" x="752" y="326" text-anchor="middle">20 %</text>
<text class="vg-t" font-size="22" x="32" y="34" text-anchor="start">Clics en Google, con y sin resumen de IA</text>
<text class="vg-f" x="32" y="58" text-anchor="start">Parte de las visitas en las que alguien hizo clic. Pew Research Center, 22 de julio de 2025: 900</text><text class="vg-f" x="32" y="76" text-anchor="start">adultos de EE. UU., 68.879 búsquedas, marzo de 2025.</text>
<text class="vg-t" x="32" y="126" font-size="17">Páginas sin resumen de IA</text>
<text class="vg-s" x="48" y="162">Un resultado normal</text>
<text class="vg-t" x="32" y="206" font-size="17">Páginas con resumen de IA</text>
<text class="vg-s" x="48" y="242">Un resultado normal</text>
<text class="vg-s" x="48" y="280">Un enlace dentro del resumen</text>
<rect class="vg-barra" x="272" y="144" width="360" height="26"/>
<text class="vg-v" x="640" y="164">15 %</text>
<rect class="vg-barra" x="272" y="224" width="192" height="26"/>
<text class="vg-v" x="472" y="244">8 %</text>
<rect class="vg-barra" x="272" y="262" width="24" height="26"/>
<text class="vg-v" x="304" y="282">cerca de 1 %</text>
<line class="vg-base" x1="272" x2="272" y1="110" y2="308"/>
<text class="vg-f" x="512.0" y="346" text-anchor="middle">Parte de las visitas</text>
<line class="vg-sep" x1="32" x2="768" y1="370" y2="370"/>
<text class="vg-t" x="32" y="396" font-size="17">Google no está de acuerdo</text>
<text class="vg-s" x="32" y="418" text-anchor="start">Un vocero de Google dijo que el estudio usa una &quot;<tspan lang="en" xml:lang="en">flawed methodology</tspan>&quot; (metodología defectuosa). La</text><text class="vg-s" x="32" y="437" text-anchor="start">propia entrada de Google dice que el volumen total de clics orgánicos de Google hacia los sitios web</text><text class="vg-s" x="32" y="456" text-anchor="start">ha sido &quot;<tspan lang="en" xml:lang="en">relatively stable year-over-year</tspan>&quot; (relativamente estable de un año a otro). No da cifras,</text><text class="vg-s" x="32" y="475" text-anchor="start">así que no hay nada de Google para graficar. Entre paréntesis, nuestra traducción.</text>
<text class="vg-f" x="32" y="514" text-anchor="start">Pew Research Center, 22 de julio de 2025. Google, 6 de agosto de 2025. MediaPost, 24 de julio de</text><text class="vg-f" x="32" y="531" text-anchor="start">2025. Leído el 16 de octubre de 2026.</text>
</svg>
