<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 527" width="940" height="527" role="img" aria-labelledby="tmq-en-ancho-t tmq-en-ancho-d" style="max-width:100%;height:auto">
<title id="tmq-en-ancho-t">The three moves, done once on a closed case</title>
<desc id="tmq-en-ancho-d">Three small panels: a headline with its outlet underlined and a line to write who; a new tab with three questions; what you read joined by lines to the original and to another side, with the question who gains. The three moves, drawn as a sketch that shows no real outlet. Each step is written beside its drawing, with the Jarre case done once. Our method: we have not timed these moves or measured whether they help you.</desc>
<style>
.tm-card{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-chart,#737B87);stroke-width:2}
.tm-doc{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2}
.tm-bar{fill:var(--naos-ink,#0E1116)}
.tm-ln{fill:var(--naos-chart,#737B87)}
.tm-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-sec,#454C57)}
.tm-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.tm-q{font-family:var(--font-serif,"Newsreader",Georgia,serif);font-size:19px;fill:var(--naos-ink,#0E1116)}
.tm-sub{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2}
.tm-campo{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:1.5}
.tm-tab{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:1.5}
.tm-tab-on{fill:var(--naos-ink,#0E1116);stroke:var(--naos-ink,#0E1116);stroke-width:1.5}
.tm-tab-ont{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-paper,#FFFFFF)}
.tm-busca{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-chart,#737B87);stroke-width:1.5}
.tm-pt{fill:var(--naos-ink,#0E1116)}
.tm-con{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2}
.tm-onda{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;stroke-linecap:round}
.tmq-num{font-family:var(--font-serif,"Newsreader",Georgia,serif);font-weight:300;font-size:30px;fill:var(--naos-ink,#0E1116)}
.tmq-h{font-family:var(--font-serif,"Newsreader",Georgia,serif);font-size:20px;fill:var(--naos-ink,#0E1116)}
.tmq-pp{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:14px;fill:var(--naos-sec,#454C57)}
</style>
<g transform="translate(10 8)"><defs><clipPath id="tmq-en-ancho-1-c1"><rect x="20" y="164" width="260" height="52"/></clipPath></defs><rect class="tm-card" x="20" y="14" width="260" height="136" rx="4"/><text class="tm-s" x="34" y="40">The outlet</text><path class="tm-sub" d="M34 47 H103"/><g><text class="tm-q" x="150" y="44">Who?</text></g><rect class="tm-bar" x="34" y="62" width="212" height="12"/><rect class="tm-bar" x="34" y="80" width="150" height="12"/><rect class="tm-ln" x="34" y="104" width="224" height="3"/><rect class="tm-ln" x="34" y="116" width="200" height="3"/><rect class="tm-ln" x="34" y="128" width="176" height="3"/><g><rect class="tm-campo" x="20" y="164" width="260" height="52" rx="3"/><g clip-path="url(#tmq-en-ancho-1-c1)"><text class="tm-s" x="32" y="186">Who is telling you this?</text><text class="tm-f" x="32" y="205">An outlet, a person, a company.</text></g></g></g>
<text class="tmq-num" x="10" y="266">1</text>
<text class="tmq-h" x="10" y="294" text-anchor="start">Name them.</text>
<text class="tmq-pp" x="10" y="326" text-anchor="start">Write one line: who is telling you this?</text><text class="tmq-pp" x="10" y="345" text-anchor="start">An outlet, a person, a company, or a</text><text class="tmq-pp" x="10" y="364" text-anchor="start">forward with no name.</text>
<text class="tmq-pp" x="10" y="391" text-anchor="start">Jarre: several obituaries, all with the</text><text class="tmq-pp" x="10" y="410" text-anchor="start">same quote.</text>
<g transform="translate(330 8)"><g><rect class="tm-card" x="20" y="40" width="260" height="176" rx="4"/><rect class="tm-tab" x="20" y="14" width="104" height="26" rx="3"/><text class="tm-s" x="72" y="32" text-anchor="middle">The page</text><g><rect class="tm-tab-on" x="128" y="14" width="116" height="26" rx="3"/><text class="tm-tab-ont" x="186" y="32" text-anchor="middle">New tab</text></g><g><rect class="tm-busca" x="32" y="52" width="236" height="28" rx="3"/><circle class="tm-con" cx="48" cy="66" r="5"/><path class="tm-con" d="M52 70 l6 6"/><text class="tm-f" x="68" y="71">the name</text></g><g><circle class="tm-pt" cx="38" cy="112" r="3.5"/><text class="tm-s" x="52" y="116">Who runs it?</text></g><g><circle class="tm-pt" cx="38" cy="146" r="3.5"/><text class="tm-s" x="52" y="150">Who pays for it?</text></g><g><circle class="tm-pt" cx="38" cy="180" r="3.5"/><text class="tm-s" x="52" y="184">Who else reports it?</text></g></g></g>
<text class="tmq-num" x="330" y="266">2</text>
<text class="tmq-h" x="330" y="294" text-anchor="start">Leave the page.</text>
<text class="tmq-pp" x="330" y="326" text-anchor="start">Open a new tab and search that name or</text><text class="tmq-pp" x="330" y="345" text-anchor="start">that sentence. Who runs it? Who pays for</text><text class="tmq-pp" x="330" y="364" text-anchor="start">it? Who else reports the same thing?</text>
<text class="tmq-pp" x="330" y="391" text-anchor="start">Jarre: trace the quote back and you reach</text><text class="tmq-pp" x="330" y="410" text-anchor="start">Jarre&#x27;s Wikipedia page, where a</text><text class="tmq-pp" x="330" y="429" text-anchor="start">22-year-old student had added it just</text><text class="tmq-pp" x="330" y="448" text-anchor="start">after Jarre died.</text>
<g transform="translate(650 8)"><g><rect class="tm-doc" x="12" y="70" width="80" height="84" rx="3"/><rect class="tm-bar" x="20" y="80" width="64" height="8"/><rect class="tm-bar" x="20" y="94" width="44" height="8"/><rect class="tm-ln" x="20" y="112" width="64" height="3"/><rect class="tm-ln" x="20" y="122" width="64" height="3"/><rect class="tm-ln" x="20" y="132" width="48" height="3"/><text class="tm-f" x="52" y="174" text-anchor="middle">What you read</text><path class="tm-con" d="M92 100 H136 V45 H180"/><g><rect class="tm-doc" x="180" y="12" width="108" height="66" rx="3"/><rect class="tm-bar" x="190" y="22" width="60" height="8"/><rect class="tm-ln" x="190" y="40" width="88" height="3"/><rect class="tm-ln" x="190" y="50" width="88" height="3"/><rect class="tm-ln" x="190" y="60" width="64" height="3"/><text class="tm-s" x="234" y="97" text-anchor="middle">The original</text></g><path class="tm-con" d="M92 124 H136 V157 H180"/><g><rect class="tm-doc" x="180" y="126" width="108" height="66" rx="3"/><rect class="tm-bar" x="190" y="136" width="48" height="8"/><rect class="tm-ln" x="190" y="154" width="88" height="3"/><rect class="tm-ln" x="190" y="164" width="76" height="3"/><rect class="tm-ln" x="190" y="174" width="88" height="3"/><text class="tm-s" x="234" y="211" text-anchor="middle">Another side</text></g><g><circle class="tm-pt" cx="20" cy="206" r="3.5"/><text class="tm-q" x="32" y="212">Who gains?</text></g></g></g>
<text class="tmq-num" x="650" y="266">3</text>
<text class="tmq-h" x="650" y="294" text-anchor="start">Find the original, then</text><text class="tmq-h" x="650" y="318" text-anchor="start">look again from another</text><text class="tmq-h" x="650" y="342" text-anchor="start">side.</text>
<text class="tmq-pp" x="650" y="374" text-anchor="start">The document, the data, the full quote.</text><text class="tmq-pp" x="650" y="393" text-anchor="start">Then someone who says otherwise, in their</text><text class="tmq-pp" x="650" y="412" text-anchor="start">own words. Ask who gains if you believe</text><text class="tmq-pp" x="650" y="431" text-anchor="start">it as it stands.</text>
<text class="tmq-pp" x="650" y="458" text-anchor="start">Jarre: there was no original. The student</text><text class="tmq-pp" x="650" y="477" text-anchor="start">made the quote up, and the Guardian ran a</text><text class="tmq-pp" x="650" y="496" text-anchor="start">correction.</text>
</svg>
