<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" width="360" height="310" role="img" aria-labelledby="vm-es-estrecho-t vm-es-estrecho-d" style="max-width:100%;height:auto">
<title id="vm-es-estrecho-t">De un titular a su fuente</title>
<desc id="vm-es-estrecho-d">Seis piezas en orden de fecha, del titular hacia el original. La pieza de la que vienes se ilumina. 1, Lun 19 oct: Un titular del fin de semana. 2, Mar 20 oct: ¿Etiquetar toda imagen de IA?. 3, Sáb 14 nov: Un titular de la COP31. 4, Lun 16 nov, mediodía: Resúmenes: ¿sí o no?. 5, Lun 16 nov, tarde: Resúmenes de IA y clics. 6, Lun 28 dic: La historia de la que dudas. Las paradas van a la misma distancia, sin escala.</desc>
<style>
.vm-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);font-size:17px;fill:var(--naos-ink,#0E1116)}
.vm-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.vm-n{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:14px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vm-lin{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vm-pta{fill:var(--naos-ink,#0E1116)}
.vm-plato{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vm-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.vm-origen .vm-plato{fill:var(--naos-ink,#0E1116)}
.vm-origen .vm-n{fill:var(--naos-paper,#FFFFFF)}
.vm-origen .vm-aro{opacity:1}
.vm-origen .vm-t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.vm-t{font-size:18px}
.vm-f{font-size:16px}
.vm-n{font-size:16px}
</style>
<path class="vm-lin" d="M26 6 V290"/><path class="vm-pta" d="M26 304 l-7 -14 h14 z"/>
<g class="vm-seat" data-n="1" data-src="1019p"><circle class="vm-aro" cx="26" cy="30" r="20"/><circle class="vm-plato" cx="26" cy="30" r="14"/><text class="vm-n" x="26" y="35" text-anchor="middle">1</text><text class="vm-f" x="58" y="25">Lun 19 oct</text><text class="vm-t" x="58" y="46">Un titular del fin de semana</text></g>
<g class="vm-seat" data-n="2" data-src="1020p"><circle class="vm-aro" cx="26" cy="76" r="20"/><circle class="vm-plato" cx="26" cy="76" r="14"/><text class="vm-n" x="26" y="81" text-anchor="middle">2</text><text class="vm-f" x="58" y="71">Mar 20 oct</text><text class="vm-t" x="58" y="92">¿Etiquetar toda imagen de IA?</text></g>
<g class="vm-seat" data-n="3" data-src="1114p"><circle class="vm-aro" cx="26" cy="122" r="20"/><circle class="vm-plato" cx="26" cy="122" r="14"/><text class="vm-n" x="26" y="127" text-anchor="middle">3</text><text class="vm-f" x="58" y="117">Sáb 14 nov</text><text class="vm-t" x="58" y="138">Un titular de la COP31</text></g>
<g class="vm-seat" data-n="4" data-src="1116p-story-1200"><circle class="vm-aro" cx="26" cy="168" r="20"/><circle class="vm-plato" cx="26" cy="168" r="14"/><text class="vm-n" x="26" y="173" text-anchor="middle">4</text><text class="vm-f" x="58" y="163">Lun 16 nov, mediodía</text><text class="vm-t" x="58" y="184">Resúmenes: ¿sí o no?</text></g>
