<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170" role="img" aria-labelledby="vm-en-ancho-t vm-en-ancho-d" style="max-width:100%;height:auto">
<title id="vm-en-ancho-t">From a headline to its source</title>
<desc id="vm-en-ancho-d">Six pieces in date order, from the headline toward the original. The piece you came from lights up. 1, Mon 19 Oct: A weekend headline. 2, Tue 20 Oct: Label every AI image?. 3, Sat 14 Nov: A COP31 headline. 4, Mon 16 Nov, noon: Summaries: yes or no?. 5, Mon 16 Nov, evening: AI summaries and clicks. 6, Mon 28 Dec: The story you doubt. Stops are evenly spaced, not to scale.</desc>
