<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 867" width="360" height="867" role="img" aria-labelledby="vg-es-estrecho-t vg-es-estrecho-d" style="max-width:100%;height:auto">
<title id="vg-es-estrecho-t">Clics en Google, con y sin resumen de IA</title>
<desc id="vg-es-estrecho-d">Cuando salía un resumen de IA en la página de resultados de Google, la gente hacía clic en un resultado normal en el 8 % de las visitas. Sin resumen, en el 15 %. En cerca del 1 % de las visitas a páginas con resumen, alguien hizo clic en un enlace dentro del resumen. Es el conteo de Pew sobre lo que hicieron 900 adultos de EE. UU. en marzo de 2025. Google discute el método y no da cifras propias. Muestra qué hizo la gente en un solo periodo, en EE. UU. y en Google; no explica por qué. Pew Research Center, 22 de julio de 2025. Google, 6 de agosto de 2025. MediaPost, 24 de julio de 2025. Leído el 16 de octubre de 2026.</desc>
<style>
.vg-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)}
.vg-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:13px;fill:var(--naos-grey,#59616D)}
.vg-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-size:14px;fill:var(--naos-sec,#454C57)}
.vg-v{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:16px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vg-barra{fill:var(--naos-ink,#0E1116)}
.vg-grid{stroke:var(--naos-rule,#D7DBE0);stroke-width:1}
.vg-base{stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vg-sep{stroke:var(--naos-ink,#0E1116);stroke-width:1}
.vg-f{font-size:16px}
.vg-s{font-size:16px}
.vg-v{font-size:17px}
</style>
<line class="vg-grid" x1="16" x2="16" y1="238" y2="272"/>
<line class="vg-grid" x1="16" x2="16" y1="340" y2="374"/>
