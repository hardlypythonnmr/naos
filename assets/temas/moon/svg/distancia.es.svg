<svg class="ds" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 432" width="360" height="432" role="img" aria-labelledby="ds-t-es ds-d-es" lang="es">
<title id="ds-t-es">Gráfica de puntos: la luna está a 368.872 km en la llena del 25 de octubre, a 360.766 km en la del 24 de noviembre y a 356.738 km en la del 23 de diciembre.</title>
<desc id="ds-d-es">Tres puntos sobre una misma escala de 355.000 a 370.000 kilómetros, una fila por cada luna llena. Cada una está más cerca que la anterior: 8.106 km más cerca en noviembre que en octubre, y 4.028 km más cerca en diciembre que en noviembre. La de diciembre es la llena más cercana de 2026.</desc>
<style>svg.ds{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.ds[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.ds text{fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}svg.ds .ds-g{fill:var(--grey);font-size:13px}svg.ds .ds-h{font-size:15px;font-weight:600}svg.ds .ds-h tspan{font-weight:400}svg.ds .ds-v{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}svg.ds .ds-grid{stroke:var(--rule);stroke-width:1}svg.ds .ds-ax{stroke:var(--chart);stroke-width:1}svg.ds .ds-tr{stroke:var(--chart);stroke-width:1}svg.ds .ds-a{fill:var(--ink)}svg.ds .ds-ab{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}</style>
