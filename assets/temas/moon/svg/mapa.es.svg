<svg class="mp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 962" width="360" height="962" role="img" aria-labelledby="mp-t-es mp-d-es" lang="es">
<title id="mp-t-es">Mapa de esta página: la luna dibujada cinco veces sobre una curva, llena, oscura, llena, oscura, llena, con nueve piezas del 24 de octubre al 22 de diciembre.</title>
<desc id="mp-d-es">Cinco lunas bajan por la página sobre una curva de puntos: llena el 25 de octubre, nueva el 9 de noviembre, llena el 24 de noviembre, nueva el 8 de diciembre y llena el 23 de diciembre. Al lado van las nueve piezas, en orden de fecha. Los puntos llenos son Shorts y Reels de la noche; los puntos vacíos, historias de Instagram del mediodía.</desc>
