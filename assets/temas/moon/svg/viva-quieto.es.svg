<svg class="mv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 394" width="360" height="394" role="img" aria-labelledby="mv-t-es mv-d-es" lang="es">
<title id="mv-t-es">Animación: la luna recorre dos ciclos de fases, de la luna llena del 25 de octubre a la del 23 de diciembre, y una barra de abajo sigue las fechas.</title>
<desc id="mv-d-es">Un dibujo visto desde arriba, con la luz del Sol llegando por la izquierda. La Tierra está en el centro y la luna en un círculo a su alrededor. En la luna llena, a la derecha, nos mira toda la mitad iluminada. En la luna nueva, a la izquierda, no nos mira nada de ella. Abajo, una barra va del 25 de octubre al 23 de diciembre con las cinco fases marcadas: llena el 25 de octubre, nueva el 9 de noviembre, llena el 24 de noviembre, nueva el 8 de diciembre y llena el 23 de diciembre. Esta imagen muestra la luna llena del 23 de diciembre.</desc>
<style>svg.mv{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.mv[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.mv text{fill:var(--ink)}svg.mv .mv-g{fill:var(--grey);font-size:13px}svg.mv .mv-n{font-size:13px;font-weight:600}svg.mv .mv-fec{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}svg.mv .mv-or{fill:none;stroke:var(--chart);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:.1 6.5}svg.mv .mv-ray{stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}svg.mv .mv-tie{fill:var(--sec)}svg.mv .mv-lit{fill:var(--paper);stroke:none}svg.mv .mv-osc{fill:var(--ink);stroke:none}svg.mv .mv-bd{fill:none;stroke:var(--ink);stroke-width:1.8}svg.mv .mv-tr{fill:var(--rule)}svg.mv .mv-lleno{fill:var(--ink)}svg.mv .mv-bar{stroke:var(--ink);stroke-width:1.5}svg.mv .mv-full{fill:var(--paper);stroke:var(--ink);stroke-width:2.2}svg.mv .mv-new{fill:var(--ink);stroke:var(--ink);stroke-width:2.2}svg.mv .mv-tk{stroke:var(--chart);stroke-width:1.8;stroke-linecap:round}svg.mv .mv-tk.mv-pas{stroke:var(--ink)}svg.mv .mv-cab polygon{fill:var(--ink)}</style>
