<h3 class="viz-t">One season of moon</h3>
<svg class="mp" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 962" width="360" height="962" role="img" aria-labelledby="mp-t-en mp-d-en" lang="en">
<title id="mp-t-en">Map of this page: the moon drawn five times along one curve, full, dark, full, dark, full, with nine pieces from 24 October to 22 December.</title>
<desc id="mp-d-en">Five moons run down the page along a dotted curve: full on 25 October, new on 9 November, full on 24 November, new on 8 December and full on 23 December. Nine pieces sit beside them, in date order. Filled dots are Shorts and Reels at night, open dots are Instagram stories at noon.</desc>

<figcaption><p class="viz-que"><strong>What this shows.</strong> Each moon is one full or new moon of the season, with its pieces beside it. The piece you came from lights up.</p>
<p class="viz-nota">Times are Medellín. The full and new moons are spaced evenly, about two weeks apart. A piece sits above the moon it leads to, or below the one it follows.</p>
