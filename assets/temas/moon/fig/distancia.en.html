<h3 class="viz-t">How far the moon is at each full moon</h3>
<p class="viz-sub">From the center of the Earth to the center of the Moon, in kilometers.</p>
<svg class="ds" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 432" width="360" height="432" role="img" aria-labelledby="ds-t-en ds-d-en" lang="en">
<title id="ds-t-en">Dot chart: the moon is 368,872 km away at the full moon of 25 October, 360,766 km at the one of 24 November and 356,738 km at the one of 23 December.</title>
<desc id="ds-d-en">Three dots on one scale from 355,000 to 370,000 kilometers, one row for each full moon. Each is closer than the one before: 8,106 km closer in November than in October, and 4,028 km closer in December than in November. December&#x27;s is the closest full moon of 2026.</desc>
<style>svg.ds{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.ds[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.ds text{fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}svg.ds .ds-g{fill:var(--grey);font-size:13px}svg.ds .ds-h{font-size:15px;font-weight:600}svg.ds .ds-h tspan{font-weight:400}svg.ds .ds-v{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}svg.ds .ds-grid{stroke:var(--rule);stroke-width:1}svg.ds .ds-ax{stroke:var(--chart);stroke-width:1}svg.ds .ds-tr{stroke:var(--chart);stroke-width:1}svg.ds .ds-a{fill:var(--ink)}svg.ds .ds-ab{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}</style>

<figcaption><p class="viz-que"><strong>What this shows.</strong> The full moons get closer as the season goes on: 368,872 km on 25 October, 360,766 km on 24 November and 356,738 km on 23 December. December&#x27;s is the closest full moon of 2026.</p>
<p class="viz-nota">The scale starts at 355,000 km, not at zero, so the three dots can be told apart.</p>
<p class="viz-nota">Distances: NASA JPL Horizons, center to center. Times: U.S. Naval Observatory. Both checked on 16 October 2026. Times are Medellín. Sources [2] [4].</p>
