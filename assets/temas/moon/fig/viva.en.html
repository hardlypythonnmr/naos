<h3 class="viz-t">Two cycles of the moon</h3>
<svg class="mv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 394" width="360" height="394" role="img" aria-labelledby="mv-t-en mv-d-en" lang="en">
<title id="mv-t-en">Animation: the moon goes through two cycles of phases, from the full moon of 25 October to the full moon of 23 December, and a bar below follows the dates.</title>
<desc id="mv-d-en">A drawing seen from above, with the Sun&#x27;s light coming from the left. The Earth is in the middle and the moon on a circle around it. At the full moon, on the right, the whole lit half faces us. At the new moon, on the left, none of it does. Below, a bar runs from 25 October to 23 December with the five phases on it: full 25 October, new 9 November, full 24 November, new 8 December, full 23 December. The line under the drawing says which full or new moon it shows.</desc>

<figcaption><p class="viz-que"><strong>What this shows.</strong> From the full moon of 25 October to the full moon of 23 December, the moon goes through two cycles of phases. The Sun&#x27;s light comes from the left and always lights the half of the moon that faces it. From Earth we see that half whole at the full moon and not at all at the new moon. Play it, or go one phase at a time.</p>
<p class="viz-nota">The times are from the U.S. Naval Observatory, checked on 16 October 2026 [2]. The gap between one phase and the next is not always the same, from 14 days 3 hours to 15 days 8 hours. The animation keeps those gaps and moves at an even pace inside each one. The small ticks under the bar are the nine pieces, each within 33 hours of a full or new moon.</p>
