<h3 class="viz-t">Dos ciclos de la luna</h3>
<svg class="mv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 394" width="360" height="394" role="img" aria-labelledby="mv-t-es mv-d-es" lang="es">
<title id="mv-t-es">Animación: la luna recorre dos ciclos de fases, de la luna llena del 25 de octubre a la del 23 de diciembre, y una barra de abajo sigue las fechas.</title>
<desc id="mv-d-es">Un dibujo visto desde arriba, con la luz del Sol llegando por la izquierda. La Tierra está en el centro y la luna en un círculo a su alrededor. En la luna llena, a la derecha, nos mira toda la mitad iluminada. En la luna nueva, a la izquierda, no nos mira nada de ella. Abajo, una barra va del 25 de octubre al 23 de diciembre con las cinco fases marcadas: llena el 25 de octubre, nueva el 9 de noviembre, llena el 24 de noviembre, nueva el 8 de diciembre y llena el 23 de diciembre. La línea bajo el dibujo dice qué luna llena o nueva muestra.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> De la luna llena del 25 de octubre a la del 23 de diciembre, la luna recorre dos ciclos de fases. La luz del Sol llega por la izquierda y ilumina siempre la mitad de la luna que lo mira. Desde la Tierra vemos esa mitad completa en la luna llena y nada de ella en la luna nueva. Reprodúcela o ve de una fase a la siguiente.</p>
<p class="viz-nota">Las horas son del Observatorio Naval de los Estados Unidos, revisadas el 16 de octubre de 2026 [2]. El tiempo entre una fase y la siguiente no es siempre el mismo: va de 14 días y 3 horas a 15 días y 8 horas. La animación respeta esos tiempos y avanza a ritmo parejo dentro de cada uno. Las marcas pequeñas bajo la barra son las nueve piezas, cada una a menos de 33 horas de una luna llena o nueva.</p>
