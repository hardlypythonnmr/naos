<figure class="viz viz-dist" lang="es" data-viz="distancia">
<h3 class="viz-t">A qué distancia está la luna en cada luna llena</h3>
<p class="viz-sub">Del centro de la Tierra al centro de la Luna, en kilómetros.</p>
<svg class="ds" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 432" width="360" height="432" role="img" aria-labelledby="ds-t-es ds-d-es" lang="es">
<title id="ds-t-es">Gráfica de puntos: la luna está a 368.872 km en la llena del 25 de octubre, a 360.766 km en la del 24 de noviembre y a 356.738 km en la del 23 de diciembre.</title>
<desc id="ds-d-es">Tres puntos sobre una misma escala de 355.000 a 370.000 kilómetros, una fila por cada luna llena. Cada una está más cerca que la anterior: 8.106 km más cerca en noviembre que en octubre, y 4.028 km más cerca en diciembre que en noviembre. La de diciembre es la llena más cercana de 2026.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> Las lunas llenas se van acercando a medida que avanza la temporada: 368.872 km el 25 de octubre, 360.766 km el 24 de noviembre y 356.738 km el 23 de diciembre. La de diciembre es la llena más cercana de 2026.</p>
<p class="viz-nota">La escala empieza en 355.000 km, no en cero, para que se distingan los tres puntos.</p>
<p class="viz-nota">Distancias: NASA JPL Horizons, de centro a centro. Horas: Observatorio Naval de los Estados Unidos. Las dos se revisaron el 16 de octubre de 2026. Las horas son de Medellín. Fuentes [2] [4].</p>
