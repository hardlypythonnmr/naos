<svg class="cs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 388" width="400" height="388" role="img" aria-labelledby="cs-t-es cs-d-es" lang="es">
<title id="cs-t-es">Gráfica de la tarde del 8 de noviembre de 2026 en tres ciudades. En todas la luna se pone antes que el sol: en Nueva York a las 16:01 y 16:44, en Delhi a las 16:39 y 17:31, en Medellín a las 17:13 y 17:42.</title>
<desc id="cs-d-es">Una fila por ciudad sobre un eje de reloj de 15:45 a 18:00. Un anillo marca la puesta de la luna y un punto lleno la puesta del sol. En todas las filas el anillo va primero. La diferencia es de 43 minutos en Nueva York, 52 en Delhi y 29 en Medellín.</desc>
<style>svg.cs{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);--night:var(--naos-night,#0E1116);--nt:var(--naos-night-text,#F4F6F8);--ns:var(--naos-night-sec,#C3C9D2);--ng:var(--naos-night-grey,#9AA3B0);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.cs text{fill:var(--ink)}svg.cs .cs-g{fill:var(--grey);font-size:16px;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;font-variant-numeric:tabular-nums}svg.cs .cs-h{font-size:17px;font-weight:600;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}svg.cs .cs-h tspan{font-weight:400;fill:var(--grey);font-size:16px}svg.cs .cs-v{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}svg.cs .cs-grid{stroke:var(--rule);stroke-width:1}svg.cs .cs-ax{stroke:var(--chart);stroke-width:1}svg.cs .cs-con{stroke:var(--chart);stroke-width:2}svg.cs .cs-a{fill:var(--ink)}svg.cs .cs-b{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}</style>
