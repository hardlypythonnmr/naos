<h3 class="viz-t">One minute, one light</h3>
<svg class="lv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" width="440" height="360" role="img" data-paso="3" aria-labelledby="lv-t-en lv-d-en" lang="en">
<title id="lv-t-en">Three rooms seen from above, one for each step. 1: every light goes off and a ring of sixty dots fills, one for each second of the minute. 2: one small light comes on beside the bed. 3: the light goes out and the room stays dark.</title>
<desc id="lv-d-en">Three numbered steps, each a small room in dots with a bed, a bedside table and a window. Step 1: the floor goes dark and a ring of sixty dots, one per second, fills clockwise. Step 2: a small light glows on the bedside table. Step 3: the light is out and the room is dark.</desc>

<figcaption><p class="viz-que"><strong>What this shows.</strong> The three steps of the behavior in one room seen from above: every light goes off and a ring of sixty dots fills, one for each second of the minute; one small light comes on beside the bed; then it goes out and the room stays dark. It plays once, faster than real life, and you can pause it or go step by step.</p>
<ol class="viz-lista"><li>Sit on the bed and turn off the last light. One minute in the dark.</li><li>Light one small light, warm and dim. A diya or a candle goes in a holder, on something steady, away from the bed. Watch it for a few breaths.</li><li>Put it out, and sleep in the dark. Make sure a flame is out before you sleep or leave the room.</li></ol>
<p class="viz-nota">The minute is shown in about six seconds. This is our experiment: no study has tested it. The studies, folded above, speak to the parts.</p></figcaption>
</figure>
