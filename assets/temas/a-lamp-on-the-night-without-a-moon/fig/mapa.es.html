<figure class="viz viz-mapa" lang="es" data-viz="mapa">
<h3 class="viz-t">Una hilera de lámparas, del 7 al 14 de noviembre</h3>
<svg class="cm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 890" width="440" height="890" role="img" aria-labelledby="cm-t-es cm-d-es" lang="es">
<title id="cm-t-es">Mapa de esta página: una hilera de siete lamparitas de barro en puntos, una por cada título del 7 al 14 de noviembre, cada una con la luna de ese día a su lado. La luna casi no tiene luz el 7 de noviembre, apenas se nota la noche de Diwali, el 8, y es una luna creciente muy delgada el 13.</title>
<desc id="cm-d-es">Siete paradas de arriba abajo, por fecha. 7 de noviembre: la luna está iluminada al 1,7 %. 8 de noviembre, mañana: 0,6 %. 8 de noviembre, noche: 0,2 %. 10 de noviembre: 3,1 %. 12 de noviembre: 12,8 %. 13 de noviembre: 19,6 %. 14 de noviembre: una pieza en español, sin cifra de luna. Las cifras de la luna son de la hora de cada pieza. Una lámpara con contorno es una pieza que aún no sale, una lámpara llena es una pieza que ya salió, y una lámpara con llama es la pieza de la que vienes.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> Cada lámpara es un título, por fecha: la historia y su Short comparten una, y el 8 de noviembre hay dos. Al lado, la luna a la hora de esa pieza: 1,7 % iluminada el 7, 0,6 % y 0,2 % el 8, el día de Diwali, cuando la luna se pone antes que el sol y esa noche no hay ninguna en el cielo, y luego 3,1 % el 10 y 19,6 % el 13. La pieza de la que vienes aparece encendida.</p>
<p class="viz-nota">La separación es pareja y no sigue el calendario. La parte iluminada de la luna va a escala: por debajo del 5 % es más delgada que el contorno. Datos de la luna: U.S. Naval Observatory y NASA JPL Horizons.</p>
