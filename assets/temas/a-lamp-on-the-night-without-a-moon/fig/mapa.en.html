<figure class="viz viz-mapa" lang="en" data-viz="mapa">
<h3 class="viz-t">A row of lamps, 7 to 14 November</h3>
<svg class="cm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 890" width="440" height="890" role="img" aria-labelledby="cm-t-en cm-d-en" lang="en">
<title id="cm-t-en">Map of this page: a row of seven small clay lamps in dots, one for each title from 7 to 14 November, each with the moon beside it as it is that day. The moon is almost dark on 7 November, has no light to speak of on Diwali night, 8 November, and is a thin crescent by the 13th.</title>
<desc id="cm-d-en">Seven stops from top to bottom, in date order. 7 November: the moon is 1.7% lit. 8 November, morning: 0.6%. 8 November, night: 0.2%. 10 November: 3.1%. 12 November: 12.8%. 13 November: 19.6%. 14 November: a piece in Spanish, no moon figure. Moon figures are for the hour of each piece. An outlined lamp is a piece still coming, a filled lamp is a piece already out, and a lamp with a flame is the piece you came from.</desc>
