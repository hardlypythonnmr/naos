<svg class="cm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 556" width="400" height="556" role="img" aria-labelledby="cm-t-es cm-d-es" lang="es">
<title id="cm-t-es">Mapa de esta página: la carátula de un reloj en puntos, con la manecilla devuelta una hora, de las 2:00 a la 1:00, y cinco piezas que salen de ella, entre el 3 y el 7 de noviembre.</title>
<desc id="cm-d-es">La carátula de un reloj en puntos, a la izquierda. Su manecilla marca la 1:00, con un rastro de puntos hasta donde estaba a las 2:00. Cinco líneas de puntos van del reloj a cinco piezas en una columna, por fecha: mar 3 nov mediodía, Registro de siete noches; mar 3 nov noche, La misma hora al acostarte; jue 5 nov mediodía, Soltar el día, en tu pantalla; jue 5 nov noche, Soltar el día; sáb 7 nov mediodía, Misma hora de dormir. Un punto lleno ya salió y un anillo está por salir. La separación es pareja y no sigue el calendario. La pieza de la que vienes lleva un círculo y la manecilla gira hacia ella.</desc>
