<svg class="cr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 770" width="420" height="770" role="img" aria-labelledby="cr-t-en cr-d-en" lang="en">
<title id="cr-t-en">Chart of Sunday 1 November in hours: 25 rows, one for each real hour, read on three clocks: UTC, Medellín and New York. New York shows 01:00 twice, first on summer time (EDT) and then on standard time (EST), so its day has 25 hours. Medellín shows 01:00 once and its day has 24. From the second 01:00 on, both cities show the same hour.</title>
<desc id="cr-d-en">Rows from 04:00 UTC on 1 November to 04:00 UTC on 2 November, one per real hour. Medellín keeps UTC-5 all year: its column runs from 23:00 on 31 October to 23:00 on 1 November. New York is on UTC-4 in the first two rows (00:00 and 01:00 EDT), one hour ahead of Medellín. At 06:00 UTC its clock goes back from 02:00 to 01:00 EST, so 01:00 appears twice, and from there both columns match. New York has 25 hours on 1 November, Medellín 24.</desc>
<style>svg.cr{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.cr[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.cr text{fill:var(--ink)}svg.cr .cr-g{fill:var(--grey)}svg.cr .cr-s{font-size:16px}svg.cr .cr-t{font-size:17px;font-weight:600}svg.cr .cr-v{font-size:16px;font-variant-numeric:tabular-nums}svg.cr .cr-b{font-weight:600}svg.cr .cr-c{fill:var(--paper);stroke:var(--chart);stroke-width:1}svg.cr .cr-x{fill:var(--rule);stroke:var(--ink);stroke-width:2.2}svg.cr .cr-p{fill:none;stroke:var(--chart);stroke-width:1.2;stroke-dasharray:4 3}svg.cr .cr-l{stroke:var(--chart);stroke-width:1.5;fill:none}svg.cr .cr-i{stroke:var(--ink);stroke-width:1.5;fill:none}svg.cr .cr-h{fill:var(--paper);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}</style>
