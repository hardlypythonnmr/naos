<figure class="viz viz-viva" id="three-steps" lang="en" data-viz="viva" data-viva>
<h3 class="viz-t">Three steps, one evening</h3>
<svg class="cv" xmlns="http://www.w3.org/2000/svg" viewBox="0 8 360 400" width="360" height="400" role="img" data-paso="3" aria-labelledby="cv-t-en cv-d-en" lang="en">
<title id="cv-t-en">Animation of a clock face in dots. Its hand points to 10 p.m., an example of your hour, and a mark appears there. A ring in the middle grows twice and shrinks once, three times, with the words In, In, Out. Then the mark fills in and the first night of a seven-night log is marked. Steps 1 to 3 are numbered.</title>
<desc id="cv-d-en">Three numbered steps. 1: a ring marks 10 p.m. on the clock, an example of your hour, where the hand points. 2: a ring in the middle of the clock grows twice and shrinks once, three times, while the words In, In, Out appear. 3: the mark on your hour fills in, for going to bed at that hour, and a log of seven dots appears with the first one marked.</desc>

<figcaption><p class="viz-que"><strong>What this shows.</strong> An evening in three steps: a clock marks your hour, a ring breathes in, in a little more, and out long, three times, and the first of seven nights is marked. You can go step by step; with motion on, it plays once and you can pause it.</p>
<details class="viz-alt"><summary>The three steps in text</summary><ol><li>Pick your hour. The time on the clock when you went to bed before it moved. If it changed from night to night, pick one you can keep. Write it where you&#x27;ll see it.</li><li>Close the day on purpose. Breathe in, then in a little more, then out, long and slow. That&#x27;s one breath. Take three. If you get dizzy, go back to normal breathing.</li><li>Go to bed at your hour, and mark it. Write down when you got into bed. Get up at a similar time each day. Seven nights.</li></ol></details>
<p class="viz-nota">Our experiment. Three breaths is our short version of a practice studied at 5 minutes a day for a month [23]. No study has tested three breaths, or keeping your bedtime through the clock change. The 10 p.m. is an example, from the tale.</p></figcaption>
