<figure class="viz viz-viva" id="tres-pasos" lang="es" data-viz="viva" data-viva>
<h3 class="viz-t">Tres pasos, una noche</h3>
<svg class="cv" xmlns="http://www.w3.org/2000/svg" viewBox="0 8 360 400" width="360" height="400" role="img" data-paso="3" aria-labelledby="cv-t-es cv-d-es" lang="es">
<title id="cv-t-es">Animación de la carátula de un reloj en puntos. Su manecilla marca las 10 de la noche, un ejemplo de tu hora, y ahí aparece una marca. Un anillo en el centro crece dos veces y se achica una, tres veces, con las palabras Adentro, Adentro, Afuera. Después la marca se llena y se marca la primera noche de un registro de siete. Los pasos 1 a 3 están numerados.</title>
<desc id="cv-d-es">Tres pasos numerados. 1: un anillo marca las 10 de la noche en el reloj, un ejemplo de tu hora, donde apunta la manecilla. 2: un anillo en el centro del reloj crece dos veces y se achica una, tres veces, mientras aparecen las palabras Adentro, Adentro, Afuera. 3: la marca de tu hora se llena, por acostarte a esa hora, y aparece un registro de siete puntos con el primero marcado.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> Una noche en tres pasos: un reloj marca tu hora, un anillo respira (toma aire, un poco más, y suelta largo) tres veces, y se marca la primera de siete noches. Puedes ir paso a paso; con el movimiento activado, corre una sola vez y puedes pausarla.</p>
<details class="viz-alt"><summary>Los tres pasos en texto</summary><ol><li>Escoge tu hora. La hora en que te acostabas antes del cambio de hora, o la de siempre si donde vives no cambia. Si variaba de una noche a otra, escoge una que puedas mantener. Anótala donde la veas.</li><li>Cierra el día con calma. Toma aire, luego un poco más, y suéltalo largo y despacio. Esa es una respiración. Haz tres. Si te mareas, vuelve a respirar normal.</li><li>Acuéstate a tu hora y anótalo. Escribe a qué hora te metiste a la cama. Levántate a horas parecidas cada día. Siete noches.</li></ol></details>
<p class="viz-nota">Nuestro experimento. Tres respiraciones es nuestra versión corta de una práctica que se estudió con 5 minutos al día durante un mes [23]. Ningún estudio ha probado tres respiraciones, ni mantener tu hora de acostarte a lo largo del cambio de hora. Las 10 de la noche son un ejemplo, del cuento.</p></figcaption>
