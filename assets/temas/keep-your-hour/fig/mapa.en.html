<h3 class="viz-t">Five days around one hour</h3>
<svg class="cm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 556" width="400" height="556" role="img" aria-labelledby="cm-t-en cm-d-en" lang="en">
<title id="cm-t-en">Map of this page: a clock face in dots with its hand turned back one hour, from 2:00 to 1:00, and five pieces fanned out from it, from 3 to 7 November.</title>
<desc id="cm-d-en">A clock face in dots at the left. Its hand points to 1:00, with a dotted trail back to where it stood at 2:00. Five dotted lines run from the clock to five pieces in a column, by date: Tue 3 Nov noon, Seven-night log; Tue 3 Nov night, Same bedtime; Thu 5 Nov noon, Letting the day go, lock screen; Thu 5 Nov night, Letting the day go; Sat 7 Nov noon, Same hour, in Spanish. A filled dot is out, a ring is coming. The spacing is even and does not follow the calendar. The piece you came from is circled and the hand turns to it.</desc>

<figcaption><p class="viz-que"><strong>What this shows.</strong> Five pieces over five days, one for each time the hour comes up: the log that starts the week, the bedtime, the breaths that close the day, and the same behavior in Spanish. The piece you came from is circled, and the hand turns to it.</p>
<p class="viz-nota">The spacing is even and does not follow the calendar. Noon is 12:00 and night is 20:00, the same in New York and in Medellín.</p>
