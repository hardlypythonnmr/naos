<figure class="viz viz-reloj" lang="es" data-viz="reloj">
<h3 class="viz-t">El domingo 1 de noviembre, hora por hora</h3>
<p class="viz-sub">Cada fila es una hora real, leída en tres relojes</p>
<svg class="cr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 770" width="420" height="770" role="img" aria-labelledby="cr-t-es cr-d-es" lang="es">
<title id="cr-t-es">Gráfica del domingo 1 de noviembre por horas: 25 filas, una por cada hora real, leídas en tres relojes: UTC, Medellín y Nueva York. En Nueva York la 01:00 aparece dos veces, primero con el horario de verano (EDT) y después con el horario estándar (EST), así que ese día tiene 25 horas. En Medellín la 01:00 aparece una vez y el día tiene 24. Desde la segunda 01:00, las dos ciudades marcan la misma hora.</title>
<desc id="cr-d-es">Filas desde las 04:00 UTC del 1 de noviembre hasta las 04:00 UTC del 2 de noviembre, una por cada hora real. Medellín conserva UTC-5 todo el año: su columna va de las 23:00 del 31 de octubre a las 23:00 del 1 de noviembre. Nueva York está en UTC-4 en las dos primeras filas (00:00 y 01:00 EDT), una hora adelante de Medellín. A las 06:00 UTC su reloj se atrasa de las 02:00 a la 01:00 EST, así que la 01:00 aparece dos veces, y desde ahí las dos columnas coinciden. El 1 de noviembre Nueva York tiene 25 horas y Medellín 24.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> El domingo 1 de noviembre los relojes de Nueva York se atrasan de las 2:00 a la 1:00: la 1:00 a. m. ocurre dos veces y ese día tiene 25 horas. En Medellín no cambia nada y el día tiene 24. Desde la segunda 1:00, las dos ciudades marcan la misma hora.</p>
<p class="viz-nota">Regla: 15 U.S. Code § 260a [1], NIST [2], base de datos de zonas horarias IANA [4]; Colombia, Decreto 2707 de 1982 [6]. Horas calculadas para esta página con las reglas de IANA (zoneinfo de Python) el 16 de octubre de 2026.</p>
