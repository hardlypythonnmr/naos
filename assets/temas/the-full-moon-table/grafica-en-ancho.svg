<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 960 477" width="960" height="477" role="img" aria-labelledby="vg-en-ancho-t vg-en-ancho-d" style="max-width:100%;height:auto">
<title id="vg-en-ancho-t">One full moon, four local clocks</title>
<desc id="vg-en-ancho-d">One full moon, four clocks. Each bar is the full-moon day (purnima) as Drik Panchang lists it, drawn on each place&#x27;s own clock. It starts and ends at the same moment everywhere, so on the wall it begins on Saturday night in Mountain View and ends on Monday morning in Delhi. Drik&#x27;s date for Kojagara Puja is Sunday 25 in Delhi, New York and Medellín, and Saturday 24 in Mountain View. The date depends on where you are and which rule your family keeps. Mountain View, California: Sat 24 23:25 to Sun 25 21:11. Medellín: Sun 25 01:25 to Sun 25 23:11. New York: Sun 25 02:25 to Mon 26 00:11. Delhi: Sun 25 11:55 to Mon 26 09:41.</desc>
<style>
.vg-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)}
.vg-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-grey,#59616D);font-size:13px}
.vg-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-sec,#454C57);font-size:13px}
.vg-n{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:14px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vg-h{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-ink,#0E1116);font-size:14px;font-variant-numeric:tabular-nums}
.vg-mesa{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-chart,#737B87);stroke-width:2}
.vg-plato{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vg-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.vg-lun{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2.5}
.vg-g{stroke:var(--naos-chart,#737B87);stroke-width:1}
.vg-banda{fill:var(--naos-rule,#D7DBE0);opacity:.45}
.vg-barra{fill:var(--naos-ink,#0E1116)}
.vg-origen .vg-plato{fill:var(--naos-ink,#0E1116)}
.vg-origen .vg-n{fill:var(--naos-paper,#FFFFFF)}
.vg-origen .vg-aro{opacity:1}
</style>
<rect class="vg-banda" x="300.0" y="48" width="360.0" height="336"/>
<text class="vg-t" x="255.0" y="36" text-anchor="middle" font-size="19">Sat 24</text>
<text class="vg-t" x="480.0" y="36" text-anchor="middle" font-size="19">Sun 25</text>
<text class="vg-t" x="795.0" y="36" text-anchor="middle" font-size="19">Mon 26</text>
<text class="vg-t" x="16" y="88" font-size="19">Mountain View</text><text class="vg-f" x="16" y="108">Kojagara Puja: Sat 24</text>
<rect class="vg-barra" x="291.2" y="76" width="326.5" height="24" rx="4"/>
<text class="vg-h" x="283.2" y="94" text-anchor="end">Sat 24 23:25</text>
<text class="vg-h" x="625.8" y="94">Sun 25 21:11</text>
<text class="vg-t" x="16" y="172" font-size="19">Medellín</text><text class="vg-f" x="16" y="192">Kojagara Puja: Sun 25</text>
<rect class="vg-barra" x="321.2" y="160" width="326.5" height="24" rx="4"/>
<text class="vg-h" x="313.2" y="178" text-anchor="end">Sun 25 01:25</text>
<text class="vg-h" x="655.8" y="178">Sun 25 23:11</text>
<text class="vg-t" x="16" y="256" font-size="19">New York</text><text class="vg-f" x="16" y="276">Kojagara Puja: Sun 25</text>
<rect class="vg-barra" x="336.2" y="244" width="326.5" height="24" rx="4"/>
<text class="vg-h" x="328.2" y="262" text-anchor="end">Sun 25 02:25</text>
<text class="vg-h" x="670.8" y="262">Mon 26 00:11</text>
<text class="vg-t" x="16" y="340" font-size="19">Delhi</text><text class="vg-f" x="16" y="360">Kojagara Puja: Sun 25</text>
<rect class="vg-barra" x="478.7" y="328" width="326.5" height="24" rx="4"/>
<text class="vg-h" x="470.7" y="346" text-anchor="end">Sun 25 11:55</text>
<text class="vg-h" x="813.2" y="346">Mon 26 09:41</text>
<text class="vg-f" x="16" y="412" text-anchor="start">Bars: the full-moon day (purnima) as Drik Panchang lists it, on each place&#x27;s own clock.</text><text class="vg-f" x="16" y="431" text-anchor="start">Drik counts the lunar day; the exact full moon (USNO) is one minute later, 04:12 UTC.</text><text class="vg-f" x="16" y="450" text-anchor="start">Source: Drik Panchang, read 16 Oct 2026.</text>
</svg>
