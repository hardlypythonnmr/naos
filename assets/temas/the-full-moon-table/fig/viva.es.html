<h3 class="ml-h3"><span class="ml-num">3</span> Antes del primer bocado, mira arriba.</h3>
<p class="ml-p">Toma aire y suéltalo. Ahora sí, come. Conversen, o quédense un rato en silencio.</p>

<p class="ml-despues">Piensa en una persona, cerca o lejos, e invítala a comer. Por llamada, en altavoz. Si no puede, el segundo plato espera. <a href="#a-solas">¿Comes a solas?</a></p>
<p class="ml-despues">No hay que ayunar ni dejar comida afuera toda la noche: tu plato es para la cena.</p>
<p class="ml-despues">“Cuando ponga la mesa el domingo, pongo un plato más y miro arriba primero.”</p>
<p class="ml-despues">Eso es todo.</p>
