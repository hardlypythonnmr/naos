<h3 class="ml-h3"><span class="ml-num">2</span> Take your plate where you can see the sky.</h3>
<p class="ml-p">On Sunday the full moon comes up low in the east, around sunset. Put your phone face down.</p>

<h3 class="ml-h3"><span class="ml-num">3</span> Before the first bite, look up.</h3>
<p class="ml-p">One breath in, one out. Then eat. Talk, or be quiet together.</p>

<p class="ml-despues">Think of one person, near you or a call away, and ask: want to eat together? On a call, put it on speaker. If they can't make it, the second plate waits. <a href="#on-your-own">Eating alone tonight?</a></p>
<p class="ml-despues">Fasting isn't part of this. Nor is leaving food out overnight. Your plate is for tonight's dinner.</p>
<p class="ml-despues">In one line: “When I set the table on Sunday, I set one more plate. I look up first.”</p>
<p class="ml-despues">That's it.</p>
