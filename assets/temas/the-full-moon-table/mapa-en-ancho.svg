<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="vm-en-ancho-t vm-en-ancho-d" style="max-width:100%;height:auto">
<title id="vm-en-ancho-t">The table: nine pieces, 20 to 30 October</title>
<desc id="vm-en-ancho-d">Each seat is one piece, in date order. The full moon falls in the middle, on Sunday 25. The seat you came from lights up. 1, Tue 20: Two plates. 2, Wed 21: Who taught you thanks. 3, Fri 23: Who you eat with. 4, Sat 24: Seven slides. 5, Sun 25, morning: A table under the moon. 6, Sun 25, night: One plate outside. 7, Mon 26: The bowl left out. 8, Wed 28: Look up first. 9, Fri 30: The empty chair. Full moon, Sun 25, 23:12 in Medellín.</desc>
<style>
.vm-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)}
.vm-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-grey,#59616D);font-size:13px}
.vm-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-sec,#454C57);font-size:13px}
.vm-n{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:14px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vm-h{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-ink,#0E1116);font-size:14px;font-variant-numeric:tabular-nums}
.vm-mesa{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-chart,#737B87);stroke-width:2}
.vm-plato{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vm-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.vm-lun{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2.5}
.vm-g{stroke:var(--naos-chart,#737B87);stroke-width:1}
.vm-banda{fill:var(--naos-rule,#D7DBE0);opacity:.45}
.vm-barra{fill:var(--naos-ink,#0E1116)}
.vm-origen .vm-plato{fill:var(--naos-ink,#0E1116)}
.vm-origen .vm-n{fill:var(--naos-paper,#FFFFFF)}
.vm-origen .vm-aro{opacity:1}
</style>
<g font-size="17"><rect class="vm-mesa" x="40" y="130" width="880" height="170" rx="40"/>
<circle class="vm-lun" cx="527.5" cy="215" r="26"/>
<text class="vm-t" x="487.5" y="211" text-anchor="end" font-size="18">Full moon</text>
<text class="vm-f" x="487.5" y="231" text-anchor="end">Sun 25, 23:12 in Medellín</text>
<g class="vm-seat" data-n="1" data-src="1020h"><circle class="vm-aro" cx="100.0" cy="146" r="21"/><circle class="vm-plato" cx="100.0" cy="146" r="15"/><text class="vm-n" x="100.0" y="151" text-anchor="middle">1</text><text class="vm-t" x="100.0" y="118" text-anchor="middle">Two plates</text><text class="vm-f" x="100.0" y="96" text-anchor="middle">Tue 20</text></g>
<g class="vm-seat" data-n="2" data-src="1021h"><circle class="vm-aro" cx="195.0" cy="284" r="21"/><circle class="vm-plato" cx="195.0" cy="284" r="15"/><text class="vm-n" x="195.0" y="289" text-anchor="middle">2</text><text class="vm-f" x="195.0" y="328" text-anchor="middle">Wed 21</text><text class="vm-t" x="195.0" y="350" text-anchor="middle">Who taught you</text><text class="vm-t" x="195.0" y="372" text-anchor="middle">thanks</text></g>
<g class="vm-seat" data-n="3" data-src="1023h"><circle class="vm-aro" cx="290.0" cy="146" r="21"/><circle class="vm-plato" cx="290.0" cy="146" r="15"/><text class="vm-n" x="290.0" y="151" text-anchor="middle">3</text><text class="vm-t" x="290.0" y="118" text-anchor="middle">Who you eat with</text><text class="vm-f" x="290.0" y="96" text-anchor="middle">Fri 23</text></g>
<g class="vm-seat" data-n="4" data-src=""><circle class="vm-aro" cx="385.0" cy="284" r="21"/><circle class="vm-plato" cx="385.0" cy="284" r="15"/><text class="vm-n" x="385.0" y="289" text-anchor="middle">4</text><text class="vm-f" x="385.0" y="328" text-anchor="middle">Sat 24</text><text class="vm-t" x="385.0" y="350" text-anchor="middle">Seven slides</text></g>
<g class="vm-seat" data-n="5" data-src=""><circle class="vm-aro" cx="480.0" cy="146" r="21"/><circle class="vm-plato" cx="480.0" cy="146" r="15"/><text class="vm-n" x="480.0" y="151" text-anchor="middle">5</text><text class="vm-t" x="480.0" y="96" text-anchor="middle">A table under the</text><text class="vm-t" x="480.0" y="118" text-anchor="middle">moon</text><text class="vm-f" x="480.0" y="74" text-anchor="middle">Sun 25, morning</text></g>
<g class="vm-seat" data-n="6" data-src="1025h"><circle class="vm-aro" cx="575.0" cy="284" r="21"/><circle class="vm-plato" cx="575.0" cy="284" r="15"/><text class="vm-n" x="575.0" y="289" text-anchor="middle">6</text><text class="vm-f" x="575.0" y="328" text-anchor="middle">Sun 25, night</text><text class="vm-t" x="575.0" y="350" text-anchor="middle">One plate outside</text></g>
<g class="vm-seat" data-n="7" data-src="1026h"><circle class="vm-aro" cx="670.0" cy="146" r="21"/><circle class="vm-plato" cx="670.0" cy="146" r="15"/><text class="vm-n" x="670.0" y="151" text-anchor="middle">7</text><text class="vm-t" x="670.0" y="118" text-anchor="middle">The bowl left out</text><text class="vm-f" x="670.0" y="96" text-anchor="middle">Mon 26</text></g>
<g class="vm-seat" data-n="8" data-src="1028h"><circle class="vm-aro" cx="765.0" cy="284" r="21"/><circle class="vm-plato" cx="765.0" cy="284" r="15"/><text class="vm-n" x="765.0" y="289" text-anchor="middle">8</text><text class="vm-f" x="765.0" y="328" text-anchor="middle">Wed 28</text><text class="vm-t" x="765.0" y="350" text-anchor="middle">Look up first</text></g>
<g class="vm-seat" data-n="9" data-src="1030h"><circle class="vm-aro" cx="860.0" cy="146" r="21"/><circle class="vm-plato" cx="860.0" cy="146" r="15"/><text class="vm-n" x="860.0" y="151" text-anchor="middle">9</text><text class="vm-t" x="860.0" y="118" text-anchor="middle">The empty chair</text><text class="vm-f" x="860.0" y="96" text-anchor="middle">Fri 30</text></g></g>
</svg>
