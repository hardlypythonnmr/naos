<svg xmlns="http://www.w3.org/2000/svg" lang="es-419" xml:lang="es-419" viewBox="0 0 350 688" width="350" height="688" role="img" aria-labelledby="vg-es-estrecho-t vg-es-estrecho-d" style="max-width:100%;height:auto">
<title id="vg-es-estrecho-t">Una luna llena, cuatro relojes</title>
<desc id="vg-es-estrecho-d">Una sola luna llena, cuatro relojes. Cada barra es el día de luna llena (purnima) tal como lo lista Drik Panchang, dibujado en la hora de cada lugar. Empieza y termina en el mismo instante en todas partes, así que en el reloj de pared arranca el sábado en la noche en Mountain View y termina el lunes en la mañana en Delhi. La fecha que da Drik para la Kojagara Puja es el domingo 25 en Delhi, Nueva York y Medellín, y el sábado 24 en Mountain View. La fecha depende de dónde estés y de qué regla guarde tu familia. Mountain View, California: sáb 24 23:25 a dom 25 21:11. Medellín: dom 25 01:25 a dom 25 23:11. Nueva York: dom 25 02:25 a lun 26 00:11. Delhi: dom 25 11:55 a lun 26 09:41.</desc>
<style>
.vg-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)}
.vg-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-grey,#59616D);font-size:14px}
.vg-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-sec,#454C57);font-size:14px}
.vg-n{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:15px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vg-h{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-ink,#0E1116);font-size:15px;font-variant-numeric:tabular-nums}
.vg-mesa{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-chart,#737B87);stroke-width:2}
.vg-plato{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vg-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.vg-lun{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2.5}
.vg-g{stroke:var(--naos-chart,#737B87);stroke-width:1}
.vg-banda{fill:var(--naos-rule,#D7DBE0);opacity:.45}
.vg-barra{fill:var(--naos-ink,#0E1116)}
.vg-origen .vg-plato{fill:var(--naos-ink,#0E1116)}
.vg-origen .vg-n{fill:var(--naos-paper,#FFFFFF)}
.vg-origen .vg-aro{opacity:1}
</style>
<rect class="vg-banda" x="95.5" y="44" width="159.0" height="448"/>
<text class="vg-t" x="55.8" y="32" text-anchor="middle" font-size="17">sáb 24</text>
<text class="vg-t" x="175.0" y="32" text-anchor="middle" font-size="17">dom 25</text>
<text class="vg-t" x="294.2" y="32" text-anchor="middle" font-size="17">lun 26</text>
<text class="vg-t" x="16" y="76" font-size="18">Mountain View</text><text class="vg-f" x="334" y="76" text-anchor="end">Kojagara Puja: sáb 24</text>
<text class="vg-h" x="91.6" y="102" text-anchor="start">sáb 24 23:25</text>
<rect class="vg-barra" x="91.6" y="109" width="144.2" height="22" rx="4"/>
<text class="vg-h" x="235.8" y="150" text-anchor="end">dom 25 21:11</text>
<text class="vg-t" x="16" y="188" font-size="18">Medellín</text><text class="vg-f" x="334" y="188" text-anchor="end">Kojagara Puja: dom 25</text>
<text class="vg-h" x="104.9" y="214" text-anchor="start">dom 25 01:25</text>
<rect class="vg-barra" x="104.9" y="221" width="144.2" height="22" rx="4"/>
<text class="vg-h" x="249.1" y="262" text-anchor="end">dom 25 23:11</text>
<text class="vg-t" x="16" y="300" font-size="18">Nueva York</text><text class="vg-f" x="334" y="300" text-anchor="end">Kojagara Puja: dom 25</text>
<text class="vg-h" x="111.5" y="326" text-anchor="start">dom 25 02:25</text>
<rect class="vg-barra" x="111.5" y="333" width="144.2" height="22" rx="4"/>
<text class="vg-h" x="255.7" y="374" text-anchor="end">lun 26 00:11</text>
<text class="vg-t" x="16" y="412" font-size="18">Delhi</text><text class="vg-f" x="334" y="412" text-anchor="end">Kojagara Puja: dom 25</text>
<text class="vg-h" x="174.4" y="438" text-anchor="start">dom 25 11:55</text>
<rect class="vg-barra" x="174.4" y="445" width="144.2" height="22" rx="4"/>
<text class="vg-h" x="318.7" y="486" text-anchor="end">lun 26 09:41</text>
<text class="vg-f" x="16" y="520" text-anchor="start">Barras: el día de luna llena (purnima) tal</text><text class="vg-f" x="16" y="540" text-anchor="start">como lo lista Drik Panchang, en la hora de</text><text class="vg-f" x="16" y="560" text-anchor="start">cada lugar.</text><text class="vg-f" x="16" y="580" text-anchor="start">Drik cuenta el día lunar; la luna llena</text><text class="vg-f" x="16" y="600" text-anchor="start">exacta (USNO) llega un minuto después, a</text><text class="vg-f" x="16" y="620" text-anchor="start">las 04:12 UTC.</text><text class="vg-f" x="16" y="640" text-anchor="start">Fuente: Drik Panchang, leído el 16 de</text><text class="vg-f" x="16" y="660" text-anchor="start">octubre de 2026.</text>
</svg>
