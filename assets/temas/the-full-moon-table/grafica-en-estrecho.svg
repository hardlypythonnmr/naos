<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 350 668" width="350" height="668" role="img" aria-labelledby="vg-en-estrecho-t vg-en-estrecho-d" style="max-width:100%;height:auto">
<title id="vg-en-estrecho-t">One full moon, four local clocks</title>
<desc id="vg-en-estrecho-d">One full moon, four clocks. Each bar is the full-moon day (purnima) as Drik Panchang lists it, drawn on each place&#x27;s own clock. It starts and ends at the same moment everywhere, so on the wall it begins on Saturday night in Mountain View and ends on Monday morning in Delhi. Drik&#x27;s date for Kojagara Puja is Sunday 25 in Delhi, New York and Medellín, and Saturday 24 in Mountain View. The date depends on where you are and which rule your family keeps. Mountain View, California: Sat 24 23:25 to Sun 25 21:11. Medellín: Sun 25 01:25 to Sun 25 23:11. New York: Sun 25 02:25 to Mon 26 00:11. Delhi: Sun 25 11:55 to Mon 26 09:41.</desc>
<style>
.vg-t{font-family:var(--font-serif,"Newsreader",Georgia,serif);fill:var(--naos-ink,#0E1116)}
.vg-f{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-grey,#59616D);font-size:14px}
.vg-s{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-sec,#454C57);font-size:14px}
.vg-n{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);font-weight:600;font-size:15px;fill:var(--naos-ink,#0E1116);font-variant-numeric:tabular-nums}
.vg-h{font-family:var(--font-sans,"IBM Plex Sans",system-ui,sans-serif);fill:var(--naos-ink,#0E1116);font-size:15px;font-variant-numeric:tabular-nums}
.vg-mesa{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-chart,#737B87);stroke-width:2}
.vg-plato{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2}
.vg-aro{fill:none;stroke:var(--naos-ink,#0E1116);stroke-width:2;opacity:0}
.vg-lun{fill:var(--naos-paper,#FFFFFF);stroke:var(--naos-ink,#0E1116);stroke-width:2.5}
.vg-g{stroke:var(--naos-chart,#737B87);stroke-width:1}
.vg-banda{fill:var(--naos-rule,#D7DBE0);opacity:.45}
.vg-barra{fill:var(--naos-ink,#0E1116)}
.vg-origen .vg-plato{fill:var(--naos-ink,#0E1116)}
.vg-origen .vg-n{fill:var(--naos-paper,#FFFFFF)}
.vg-origen .vg-aro{opacity:1}
</style>
<rect class="vg-banda" x="95.5" y="44" width="159.0" height="448"/>
<text class="vg-t" x="55.8" y="32" text-anchor="middle" font-size="17">Sat 24</text>
<text class="vg-t" x="175.0" y="32" text-anchor="middle" font-size="17">Sun 25</text>
<text class="vg-t" x="294.2" y="32" text-anchor="middle" font-size="17">Mon 26</text>
<text class="vg-t" x="16" y="76" font-size="18">Mountain View</text><text class="vg-f" x="334" y="76" text-anchor="end">Kojagara Puja: Sat 24</text>
<text class="vg-h" x="91.6" y="102" text-anchor="start">Sat 24 23:25</text>
<rect class="vg-barra" x="91.6" y="109" width="144.2" height="22" rx="4"/>
<text class="vg-h" x="235.8" y="150" text-anchor="end">Sun 25 21:11</text>
<text class="vg-t" x="16" y="188" font-size="18">Medellín</text><text class="vg-f" x="334" y="188" text-anchor="end">Kojagara Puja: Sun 25</text>
<text class="vg-h" x="104.9" y="214" text-anchor="start">Sun 25 01:25</text>
<rect class="vg-barra" x="104.9" y="221" width="144.2" height="22" rx="4"/>
<text class="vg-h" x="249.1" y="262" text-anchor="end">Sun 25 23:11</text>
<text class="vg-t" x="16" y="300" font-size="18">New York</text><text class="vg-f" x="334" y="300" text-anchor="end">Kojagara Puja: Sun 25</text>
<text class="vg-h" x="111.5" y="326" text-anchor="start">Sun 25 02:25</text>
<rect class="vg-barra" x="111.5" y="333" width="144.2" height="22" rx="4"/>
<text class="vg-h" x="255.7" y="374" text-anchor="end">Mon 26 00:11</text>
<text class="vg-t" x="16" y="412" font-size="18">Delhi</text><text class="vg-f" x="334" y="412" text-anchor="end">Kojagara Puja: Sun 25</text>
<text class="vg-h" x="174.4" y="438" text-anchor="start">Sun 25 11:55</text>
<rect class="vg-barra" x="174.4" y="445" width="144.2" height="22" rx="4"/>
<text class="vg-h" x="318.7" y="486" text-anchor="end">Mon 26 09:41</text>
<text class="vg-f" x="16" y="520" text-anchor="start">Bars: the full-moon day (purnima) as Drik</text><text class="vg-f" x="16" y="540" text-anchor="start">Panchang lists it, on each place&#x27;s own</text><text class="vg-f" x="16" y="560" text-anchor="start">clock.</text><text class="vg-f" x="16" y="580" text-anchor="start">Drik counts the lunar day; the exact full</text><text class="vg-f" x="16" y="600" text-anchor="start">moon (USNO) is one minute later, 04:12</text><text class="vg-f" x="16" y="620" text-anchor="start">UTC.</text><text class="vg-f" x="16" y="640" text-anchor="start">Source: Drik Panchang, read 16 Oct 2026.</text>
</svg>
