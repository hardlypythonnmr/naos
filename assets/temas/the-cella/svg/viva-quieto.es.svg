<svg class="cv" xmlns="http://www.w3.org/2000/svg" viewBox="0 14 360 406" width="360" height="406" role="img" data-paso="3" aria-labelledby="cv-t-es cv-d-es" lang="es">
<title id="cv-t-es">Animación de la planta de un templo en puntos: se abre una puerta al oriente, la luz cruza el piso, se barre una cosa pequeña en el escalón de la entrada y un punto se para en la luz y respira. Los pasos 1 a 3 están numerados.</title>
<desc id="cv-d-es">Tres pasos numerados. 1: la puerta del oriente se abre y la luz empieza a cruzar el piso. 2: unos granos en el escalón de la entrada se barren a un lado. 3: la luz llega a la pared del fondo y un punto se para en ella; un anillo alrededor del punto crece dos veces y se achica una, tres veces.</desc>
<style>svg.cv{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.cv[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.cv text{fill:var(--ink)}svg.cv .cv-l{font-size:15px}svg.cv .cv-w{stroke:var(--ink);stroke-width:4.4;stroke-linecap:round;fill:none}svg.cv .cv-f{stroke:var(--rule);stroke-width:3.2;stroke-linecap:round;fill:none}svg.cv .cv-lit{stroke:var(--rule);stroke-width:3.6;stroke-linecap:round;fill:none;transition:stroke .5s linear}svg.cv .cv-luz{fill:var(--ink);opacity:.1;transform-origin:0 0;transform:scaleY(var(--p,1));transition:transform 2.4s linear 0.8s}svg.cv .cv-hoja{stroke:var(--ink);stroke-width:3;stroke-linecap:round;transform-origin:0 0;transform:rotate(var(--r,-90deg));transition:transform 1.2s var(--ease-enter,cubic-bezier(.2,0,0,1))}svg.cv .cv-gr{fill:var(--grey);transition:opacity .6s linear,transform .6s linear}svg.cv .cv-esc{stroke:var(--ink);stroke-width:3;stroke-linecap:round;opacity:0;transform:translateX(var(--bx,0));transition:transform 2.4s linear,opacity .4s linear}svg.cv .cv-per{fill:var(--ink);opacity:0;transition:opacity .8s linear 2.2s}svg.cv .cv-ring{fill:none;stroke:var(--ink);stroke-width:2;transform-origin:0 0;transform:scale(.8);opacity:0;transition:opacity .8s linear 2.2s}svg.cv .cv-cue{font-size:15px;opacity:0;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}svg.cv .cv-nu{fill:var(--paper);stroke:var(--ink);stroke-width:2}svg.cv .cv-nt{font-size:14px;font-weight:600;text-anchor:middle}svg.cv .cv-lead{stroke:var(--chart);stroke-width:1;stroke-dasharray:1 4;stroke-linecap:round;fill:none}svg.cv[data-paso="0"]{--p:0;--r:0deg}svg.cv[data-paso="1"]{--p:.34;--r:-90deg}svg.cv[data-paso="2"]{--p:.68;--r:-90deg}svg.cv[data-paso="3"]{--p:1;--r:-90deg}svg.cv[data-paso="0"] .cv-gr,svg.cv[data-paso="1"] .cv-gr{opacity:1;transform:none}svg.cv[data-paso="2"] .cv-gr,svg.cv[data-paso="3"] .cv-gr{opacity:0;transform:translateX(14px)}svg.cv[data-paso="2"] .cv-esc{--bx:124px;opacity:1}svg.cv[data-paso="3"] .cv-esc{--bx:124px;opacity:.55;transition:opacity .6s linear}svg.cv[data-paso="3"] .cv-per,svg.cv[data-paso="3"] .cv-ring{opacity:1}svg.cv[data-paso="1"] .cv-lit[data-s="1"],svg.cv[data-paso="2"] .cv-lit[data-s="1"],svg.cv[data-paso="2"] .cv-lit[data-s="2"],svg.cv[data-paso="3"] .cv-lit{stroke:var(--ink)}svg.cv[data-paso="0"] .cv-lit{transition-delay:0s!important}@keyframes cv-resp{0%{transform:scale(.55)}20%{transform:scale(.78)}40%{transform:scale(1)}100%{transform:scale(.55)}}@keyframes cv-ca{0%{opacity:0}3%{opacity:1}17%{opacity:1}20%,100%{opacity:0}}@keyframes cv-cb{0%,20%{opacity:0}23%{opacity:1}37%{opacity:1}40%,100%{opacity:0}}@keyframes cv-cc{0%,40%{opacity:0}43%{opacity:1}97%{opacity:1}100%{opacity:0}}svg.cv[data-resp] .cv-ring{animation:cv-resp 5s linear 2.6s 3 both}svg.cv[data-resp] .cv-ca{animation:cv-ca 5s linear 2.6s 3 both}svg.cv[data-resp] .cv-cb{animation:cv-cb 5s linear 2.6s 3 both}svg.cv[data-resp] .cv-cc{animation:cv-cc 5s linear 2.6s 3 both}svg.cv[data-pausa] .cv-ring,svg.cv[data-pausa] .cv-cue{animation-play-state:paused}svg.cv.cv-sin *,svg.cv[data-quieto] *{transition:none!important;animation:none!important}@media (prefers-reduced-motion:reduce){svg.cv *{transition:none!important;animation:none!important}}</style>
