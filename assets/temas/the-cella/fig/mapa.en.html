<figure class="viz viz-mapa" lang="en" data-viz="mapa">
<h3 class="viz-t">One room, from empty to full</h3>
<svg class="cm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 860" width="440" height="860" role="img" aria-labelledby="cm-t-en cm-d-en" lang="en">
<title id="cm-t-en">Map of this page: a temple floor plan in dots, its one door at the east end, with seven pieces set along the path of the morning light, from 19 October to 31 December.</title>
<desc id="cm-d-en">Seven pieces along the path of the morning light, from the east door to the back wall. The room is empty at the door on 19 October and full at the back wall on 31 December: it fills as the year does. Filled dots are out, rings are coming. The spacing is even and does not follow the calendar scale. The piece you came from is circled and the path lights up to it.</desc>

<figcaption><p class="viz-que"><strong>What this shows.</strong> The pieces sit along the path of the morning light: the room is empty at the door on 19 October and full at the back wall on 31 December. It fills as the year does. The piece you came from is circled, and the path lights up to it.</p>
<p class="viz-nota">Pieces are spaced evenly. The gap between 19 October and 29 December is not drawn to calendar scale.</p>
