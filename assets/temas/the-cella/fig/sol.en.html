<figure class="viz viz-sol" lang="en" data-viz="sol">
<h3 class="viz-t">When the light comes in</h3>
<p class="viz-sub">Sunrise on the days of the first and last Short, by each city&#x27;s own clock</p>
<svg class="cs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" width="400" height="372" role="img" aria-labelledby="cs-t-en cs-d-en" lang="en">
<title id="cs-t-en">Dot chart of sunrise by local clock: Medellín 05:48 on 19 October and 06:12 on 31 December; New York 07:12 EDT on 19 October and 07:20 EST on 31 December.</title>
<desc id="cs-d-en">Two rows, one per city. Each row joins two points on a clock axis from 05:30 to 07:30: a filled dot for 19 October and a ring for 31 December. Medellín goes from 05:48 to 06:12, 24 minutes later. New York goes from 07:12 EDT to 07:20 EST, 8 minutes later on the clock.</desc>
<style>svg.cs{--ink:var(--naos-ink,#0E1116);--sec:var(--naos-sec,#454C57);--grey:var(--naos-grey,#59616D);--chart:var(--naos-chart,#737B87);--rule:var(--naos-rule,#D7DBE0);--paper:var(--naos-paper,#FFFFFF);font-family:var(--font-sans,'IBM Plex Sans',system-ui,sans-serif)}svg.cs[data-tono=noche]{--ink:var(--naos-night-text,#F4F6F8);--sec:var(--naos-night-sec,#C3C9D2);--grey:var(--naos-night-grey,#9AA3B0);--chart:var(--naos-night-grey,#9AA3B0);--rule:var(--naos-night-rule,#2A303A);--paper:var(--naos-night,#0E1116)}svg.cs text{fill:var(--ink)}svg.cs .cs-g{fill:var(--grey);font-size:16px;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}svg.cs .cs-h{font-size:16px;font-weight:600}svg.cs .cs-h{paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}svg.cs .cs-h tspan{font-weight:400;fill:var(--grey);font-size:15px}svg.cs .cs-v{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}svg.cs .cs-grid{stroke:var(--rule);stroke-width:1}svg.cs .cs-ax{stroke:var(--chart);stroke-width:1}svg.cs .cs-con{stroke:var(--chart);stroke-width:2}svg.cs .cs-a{fill:var(--ink)}svg.cs .cs-b{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}</style>

<figcaption><p class="viz-que"><strong>What this shows.</strong> On the days of the first and last Short, the sun comes up at 05:48 and 06:12 in Medellín and at 07:12 and 07:20 in New York, by each city&#x27;s own clock. The door opens when the morning does, wherever you are.</p>
<p class="viz-nota">Source: U.S. Naval Observatory, queried 16 October 2026 [21]. Medellín at 6.25, -75.56; New York at 40.71, -74.01. Rounded to the minute.</p>
<details class="viz-alt"><summary>Data table</summary><table><thead><tr><th scope="col">City and clock</th><th scope="col">19 Oct</th><th scope="col">31 Dec</th><th scope="col">Difference</th></tr></thead><tbody><tr><th scope="row">Medellín <span>clock UTC-5</span></th><td>05:48</td><td>06:12</td><td>24 minutes later</td></tr><tr><th scope="row">New York <span>EDT on 19 Oct, EST on 31 Dec</span></th><td>07:12</td><td>07:20</td><td>8 minutes later on the clock</td></tr></tbody></table><p class="viz-nota">The differences are computed from the two times. New York&#x27;s clock moves back an hour between the two dates (EDT to EST): on a single clock, sunrise there comes 68 minutes later, not 8.</p></details></figcaption>
</figure>
