<h3 class="viz-t">Cuándo entra la luz</h3>
<p class="viz-sub">La salida del sol en los días del primer y del último Short, según el reloj de cada ciudad</p>
<svg class="cs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 372" width="400" height="372" role="img" aria-labelledby="cs-t-es cs-d-es" lang="es">

<desc id="cs-d-es">Dos filas, una por ciudad. Cada fila une dos puntos en un eje de reloj de 5:30 a 7:30: un punto lleno para el 19 de octubre y un anillo para el 31 de diciembre. En Medellín pasa de 5:48 a 6:12, 24 minutos más tarde. En Nueva York pasa de 7:12 EDT a 7:20 EST, 8 minutos más tarde en el reloj.</desc>

<figcaption><p class="viz-que"><strong>Qué muestra.</strong> En los días del primer y del último Short, el sol sale a las 5:48 y a las 6:12 en Medellín, y a las 7:12 y a las 7:20 en Nueva York, según el reloj de cada ciudad. La puerta se abre cuando llega la mañana, donde estés.</p>
<p class="viz-nota">Fuente: Observatorio Naval de Estados Unidos (USNO), consultado el 16 de octubre de 2026 [21]. Medellín en 6,25 y -75,56; Nueva York en 40,71 y -74,01. Redondeado al minuto.</p>
<details class="viz-alt"><summary>Tabla de datos</summary><table><thead><tr><th scope="col">Ciudad y reloj</th><th scope="col">19 oct</th><th scope="col">31 dic</th><th scope="col">Diferencia</th></tr></thead><tbody><tr><th scope="row">Medellín <span>reloj UTC-5</span></th><td>5:48</td><td>6:12</td><td>24 minutos más tarde</td></tr><tr><th scope="row">Nueva York <span>EDT el 19 oct, EST el 31 dic</span></th><td>7:12</td><td>7:20</td><td>8 minutos más tarde en el reloj</td></tr></tbody></table><p class="viz-nota">Las diferencias se calculan con las dos horas. Entre una fecha y otra, el reloj de Nueva York se atrasa una hora (de EDT a EST): con un solo reloj, allá el sol sale 68 minutos más tarde, no 8.</p></details></figcaption>
